name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Agregador: conserva el nombre «go» (check requerido de la protección de main).
  # if: always() + comprobación explícita, porque un job saltado cuenta como éxito.
  go:
    needs: [go-race-core, go-race-rest, go-race-mask, go-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: todos los jobs de Go en verde
        run: |
          [[ "${{ needs.go-race-core.result }}" == success && "${{ needs.go-race-rest.result }}" == success && "${{ needs.go-race-mask.result }}" == success && "${{ needs.go-checks.result }}" == success ]]

  go-race-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: test -race (core, platform, cmd, service)
        run: |
          set -o pipefail
          tools/ci/pkgs.sh core | xargs go test -race

  go-race-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: test -race (todo lo demás menos mask)
        run: |
          set -o pipefail
          tools/ci/pkgs.sh rest | xargs go test -race

  go-race-mask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: mask con -race (muestra con semilla del día; MACUAHUITL_SEED la fija)
        run: |
          set -o pipefail
          tools/ci/pkgs.sh mask | xargs go test -race -count=1

  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: reparto de paquetes entre jobs (core, rest, mask)
        run: tools/ci/pkgs.sh check
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: vet para Windows de los paquetes ya portables (tools/ci/windows-pkgs.txt)
        run: grep -v '^#' tools/ci/windows-pkgs.txt | awk '{print $1}' | GOOS=windows CGO_ENABLED=0 xargs go vet
      - name: x/sys/windows solo donde lo permite el ADR 0012 (también en archivos _windows.go)
        run: tools/ci/winsys.sh
      - name: la UI no depende de internal/secret (sin caché, go test no ve los cambios que lee go list)
        run: go test -count=1 ./tools/ci
      - name: mask sin -race (corpus completo)
        run: go test -count=1 ./internal/mask/... ./internal/terminal/...
      - name: noegress
        run: go run ./tools/noegress/cmd/noegress ./...
      - name: archcheck
        run: go run ./tools/archcheck/cmd/archcheck ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: build reproducible
        run: |
          build() { rm -rf "$1" && CGO_ENABLED=0 go build -trimpath -ldflags "-buildid=" -o "$1/" ./cmd/... && (cd "$1" && sha256sum *); }
          diff <(build /tmp/a) <(build /tmp/b)
          build /tmp/a

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: main de Wails compila (sin WebKitGTK, etiqueta purego)
        working-directory: .
        run: CGO_ENABLED=0 go vet -tags 'wails purego' ./ui/
      - name: noegress también en ui/main.go (solo se compila con la etiqueta wails)
        working-directory: .
        run: CGO_ENABLED=0 GOFLAGS=-tags=wails,purego go run ./tools/noegress/cmd/noegress ./ui/

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.75.0
          lint: true
          # Sin comentario en el PR: el workflow solo tiene permiso de lectura.
          pr_comment: false
          breaking: false
          format: false
          push: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: código generado al día
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          buf generate
          git diff --exit-code -- gen/

  # Windows (fase 43, ADR 0012): informativo mientras dure 43a; al cerrarla pasa a obligatorio junto con ui-windows.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: pruebas de los paquetes ya portables (tools/ci/windows-pkgs.txt)
        run: |
          set -o pipefail
          grep -v '#' tools/ci/windows-pkgs.txt | xargs go test -count=1
      - name: noegress (paquetes portables)
        if: always()
        run: grep -v '^#' tools/ci/windows-pkgs.txt | awk '{print $1}' | xargs go run ./tools/noegress/cmd/noegress
      - name: archcheck (paquetes portables)
        if: always()
        run: grep -v '^#' tools/ci/windows-pkgs.txt | awk '{print $1}' | xargs go run ./tools/archcheck/cmd/archcheck
      - name: compila todo (informativo, lista lo que falta portar)
        if: always()
        continue-on-error: true
        run: go build ./cmd/... ./internal/...

  # La app en Windows (ADR 0012, «Instalador», 43b): vitest y el build de la interfaz en windows-latest, y el main de
  # Wails sin purego (en Windows WebView2 es Go puro). continue-on-error y fuera de la protección de main hasta que lo sea
  # el job windows; el vet es informativo hasta que ipc y sys compilen en Windows (43a2, 43a4).
  ui-windows:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
        working-directory: ui/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rutas que chocan sin mayúsculas (en Windows git deja una sola)
        working-directory: .
        run: test -z "$(git ls-files | sort -f | uniq -di)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: main de Wails para Windows (informativo hasta 43a2 y 43a4)
        working-directory: .
        continue-on-error: true
        run: CGO_ENABLED=0 go vet -tags wails ./ui/
      # Hasta que la app y el núcleo compilen en Windows (43a), el instalador se arma con binarios de prueba: lo que se
      # prueba es la plantilla (deploy/windows/macuahuitl.nsi), no los programas.
      - name: instalador NSIS (binarios de prueba)
        working-directory: .
        run: |
          mkdir -p bin-win
          for f in macuahuitl.exe macuahuitld.exe mctl.exe; do echo "binario de prueba" > "bin-win/$f"; done
          command -v makensis >/dev/null || export PATH="$PATH:/c/Program Files (x86)/NSIS"
          command -v makensis >/dev/null || { choco install nsis -y --no-progress >/dev/null && export PATH="$PATH:/c/Program Files (x86)/NSIS"; }
          VERSION=0.0.0 BIN=bin-win deploy/windows/build-installer.sh dist-win/MACUAHUITL-setup.exe
          TEST_DELETE_DATA=1 VERSION=0.0.0 BIN=bin-win deploy/windows/build-installer.sh dist-win/prueba-borrado.exe
      - name: instalar, desinstalar y que /S no borre los datos
        working-directory: .
        shell: pwsh
        run: deploy/windows/test-installer.ps1 -Installer dist-win/MACUAHUITL-setup.exe -DeleteDataInstaller dist-win/prueba-borrado.exe -Version 0.0.0

  # Prueba de punta a punta en Windows (fase 43, ADR 0012): el núcleo y mctl corren como usuarios estándar creados en el job
  # (el runner es administrador y el núcleo se niega a correr elevado). Informativo, como el job windows.
  windows-e2e:
    runs-on: windows-latest
    continue-on-error: true
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: compila núcleo, mctl y simulador
        run: |
          mkdir -p bin-win
          go build -trimpath -o bin-win/ ./cmd/macuahuitld ./cmd/mctl
          go build -trimpath -o bin-win/simserver.exe ./test/simulator/cmd/simserver
      - name: compila la app (con binario de relleno si no compila en Windows todavía)
        run: |
          (cd ui/frontend && npm ci && npm run build)
          if go build -tags wails,production -ldflags -H=windowsgui -o bin-win/macuahuitl.exe ./ui; then
            echo "app macuahuitl.exe compilada de verdad"
          else
            echo "::warning::la app no compila en Windows todavía: se usa un binario de relleno SOLO para macuahuitl.exe"
            echo "binario de relleno" > bin-win/macuahuitl.exe
          fi
      - name: instalador NSIS
        run: |
          command -v makensis >/dev/null || export PATH="$PATH:/c/Program Files (x86)/NSIS"
          command -v makensis >/dev/null || { choco install nsis -y --no-progress >/dev/null && export PATH="$PATH:/c/Program Files (x86)/NSIS"; }
          VERSION=0.0.0 BIN=bin-win deploy/windows/build-installer.sh dist-win/MACUAHUITL-setup.exe
      - name: windows-e2e (usuarios estándar, pipe, bóveda, Patrol, instalador)
        shell: pwsh
        run: tools/ci/windows-e2e.ps1 -Bin bin-win -Installer dist-win/MACUAHUITL-setup.exe -Transcripts "$PWD/test/transcripts/ios-xe" -Version 0.0.0
