name: release-packs

# Release solo de paquetes de contenido (tag packs-AAAA-MM-DD o packs-AAAA-MM-DD.N): sin núcleo, sin UI ni npm.
# Las reglas del repo (convivencia, segmentos, nombres) corren con el código del tag; la firma corre con el código del
# último núcleo publicado (el v* anterior) y su versión: mpack-sign valida cada paquete como lo haría ese núcleo, así
# lo que sale aquí se instala en el núcleo que la gente ya tiene, y un paquete que pida uno más nuevo hace fallar el release.
on:
  push:
    tags: ["packs-*"]

permissions:
  contents: read

jobs:
  packs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # los tags anteriores: el núcleo publicado y la regla de versión
          persist-credentials: false
      - name: núcleo publicado
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^packs-[0-9]{4}-[0-9]{2}-[0-9]{2}(\.[0-9]+)?$ ]] || { echo "::error::tag inválido: packs-AAAA-MM-DD[.N]"; exit 1; }
          core=$(git describe --tags --abbrev=0 --match 'v*' HEAD)
          echo "CORE_TAG=$core" >> "$GITHUB_ENV"
          echo "CORE=${core#v}" >> "$GITHUB_ENV"
          echo "WHEN=${GITHUB_REF_NAME#packs-}" >> "$GITHUB_ENV"
          git worktree add .core "$core"
          rm -rf .core/packs && cp -r packs .core/packs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: paquetes de contenido, reglas del repo (sin el secret)
        run: |
          go test ./internal/pack/ -run 'TestPacksDelRepoSonValidos|TestSegmentosOficialesEstanReservados|TestBuildEsDeterminista|TestPaquetesOficialesConviven|TestTodosLosPaquetesOficialesConviven|TestChocaElNombreEnIngles'
          tools/packaging/packs-version.sh "$GITHUB_REF_NAME"
      # El secret solo vive en el entorno de este paso.
      - name: paquetes de contenido firmados (.mpack)
        env:
          MPACK_SIGNING_KEY: ${{ secrets.MPACK_SIGNING_KEY }}
        run: (cd .core && go run ./tools/packaging/mpack-sign -packs packs -out "$GITHUB_WORKSPACE/dist" -core "$CORE")
      - name: sumas y notas
        run: |
          cd dist && sha256sum * > SHA256SUMS
          {
            echo "Content packs only: no new core. They install on MACUAHUITL ${CORE_TAG} or newer; each pack's README states its minimum core."
            echo
            echo '```sh'
            echo 'sha256sum -c --ignore-missing SHA256SUMS'
            echo 'mctl pack install oom-<name>-<version>.mpack'
            echo '```'
            echo
            echo "| Pack | Version |"
            echo "|---|---|"
            for m in *.mpack; do v=${m%.mpack}; echo "| oom/${v%-*} | ${v##*-} |" | sed 's#oom/oom-#oom/#'; done
          } > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Content packs ${{ env.WHEN }}
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
          make_latest: "false" # «latest» sigue apuntando al último núcleo
