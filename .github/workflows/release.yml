name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # npm y el código de sus dependencias (scripts de instalación, plugins de vite) corren solo aquí: sin token de
  # escritura ni secrets, y sin acceso a los binarios ni a las sumas del release.
  ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: UI (frontend)
        working-directory: ui/frontend
        run: npm ci && npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/frontend/dist
          if-no-files-found: error
          retention-days: 1

  release:
    needs: ui
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Todas las acciones fijadas por SHA; checkout sin guardar el token en .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # el tag anterior, para exigir versión nueva en un paquete que cambió
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # la caché la escribe el CI de main: el release no compila con objetos que no generó él
      - name: versión
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: paquetes de contenido, reglas del repo (sin el secret)
        run: |
          go test ./internal/pack/ -run 'TestPacksDelRepoSonValidos|TestSegmentosOficialesEstanReservados|TestBuildEsDeterminista'
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          [ -z "$prev" ] && exit 0
          for d in packs/*/; do
            git diff --quiet "$prev" -- "$d" && continue
            old=$(git show "$prev:${d}manifest.yaml" 2>/dev/null | sed -n 's/^version: *//p' || true)
            new=$(sed -n 's/^version: *//p' "${d}manifest.yaml")
            # mayor, no solo distinta: el núcleo rechaza instalar una versión igual o más vieja
            [ -z "$old" ] || { [ "$old" != "$new" ] && [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" = "$new" ]; } ||
              { echo "::error::${d} cambió desde $prev sin subir version ($old -> $new)"; exit 1; }
          done
      # El secret solo vive en el entorno de este paso; npm no corre en este job.
      - name: paquetes de contenido firmados (.mpack)
        env:
          MPACK_SIGNING_KEY: ${{ secrets.MPACK_SIGNING_KEY }}
        run: |
          go run ./tools/packaging/mpack-sign -packs packs -out dist -core "$VERSION"
          (cd dist && sha256sum *.mpack *.README.md) > "$RUNNER_TEMP/mpack.sha256"
      - name: dependencias de la UI
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config rpm
      - name: núcleo y CLI (reproducibles)
        run: |
          build() { rm -rf "$1" && CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -buildid= -X github.com/oom-netsec/MACUAHUITL/internal/version.Version=${GITHUB_REF_NAME}" -o "$1/" ./cmd/macuahuitld ./cmd/mctl && (cd "$1" && sha256sum macuahuitld mctl); }
          diff <(build /tmp/a) <(build /tmp/b)
          build bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/frontend/dist
      - name: UI
        run: |
          CGO_ENABLED=1 go build -tags 'wails gtk3' -trimpath -ldflags "-s -w -X github.com/oom-netsec/MACUAHUITL/internal/version.Version=${GITHUB_REF_NAME}" -o bin/macuahuitl ./ui
      - name: paquetes
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          mkdir -p dist
          nfpm package -p deb -f deploy/packaging/nfpm.yaml -t dist/
          nfpm package -p rpm -f deploy/packaging/nfpm.yaml -t dist/
          cp bin/macuahuitld bin/mctl bin/macuahuitl LICENSE NOTICE THIRD_PARTY_LICENSES dist/
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/macuahuitl-${{ env.VERSION }}.sbom.spdx.json
          upload-artifact: false
      - name: sumas
        run: |
          (cd dist && sha256sum -c --quiet "$RUNNER_TEMP/mpack.sha256") # contra accidentes; contra alteraciones protege la firma
          cd dist && sha256sum * > SHA256SUMS
          { echo "go: $(go version)"; echo "tag: ${GITHUB_REF_NAME}"; echo "commit: ${GITHUB_SHA}"; echo "reproducible: macuahuitld, mctl (CGO_ENABLED=0 -trimpath -ldflags '-s -w -buildid=')"; echo "no reproducible byte a byte: macuahuitl (UI con cgo/WebKitGTK)"; } > BUILD-INFO.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
