name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # checkout y setup-go fijados por SHA: corren antes del paso que ve MPACK_SIGNING_KEY.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # el tag anterior, para exigir versión nueva en un paquete que cambió
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: versión
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: paquetes de contenido, reglas del repo (sin el secret)
        run: |
          go test ./internal/pack/ -run 'TestPacksDelRepoSonValidos|TestSegmentosOficialesEstanReservados|TestBuildEsDeterminista'
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          [ -z "$prev" ] && exit 0
          for d in packs/*/; do
            git diff --quiet "$prev" -- "$d" && continue
            old=$(git show "$prev:${d}manifest.yaml" 2>/dev/null | grep '^version:' || true)
            new=$(grep '^version:' "${d}manifest.yaml")
            [ "$old" != "$new" ] || { echo "::error::${d} cambió desde $prev sin subir version ($new)"; exit 1; }
          done
      # Antes de Node y npm ci: el secret solo vive en el entorno de este paso y ningún script de npm lo ve.
      - name: paquetes de contenido firmados (.mpack)
        env:
          MPACK_SIGNING_KEY: ${{ secrets.MPACK_SIGNING_KEY }}
        run: |
          go run ./tools/packaging/mpack-sign -packs packs -out dist -core "$VERSION"
          (cd dist && sha256sum *.mpack *.README.md) > "$RUNNER_TEMP/mpack.sha256"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: dependencias de la UI
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config rpm
      - name: núcleo y CLI (reproducibles)
        run: |
          build() { rm -rf "$1" && CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -buildid= -X github.com/oom-netsec/MACUAHUITL/internal/version.Version=${GITHUB_REF_NAME}" -o "$1/" ./cmd/macuahuitld ./cmd/mctl && (cd "$1" && sha256sum macuahuitld mctl); }
          diff <(build /tmp/a) <(build /tmp/b)
          build bin
      - name: UI
        run: |
          cd ui/frontend && npm ci && npm run build && cd ../..
          CGO_ENABLED=1 go build -tags 'wails gtk3' -trimpath -ldflags "-s -w -X github.com/oom-netsec/MACUAHUITL/internal/version.Version=${GITHUB_REF_NAME}" -o bin/macuahuitl ./ui
      - name: paquetes
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          mkdir -p dist
          nfpm package -p deb -f deploy/packaging/nfpm.yaml -t dist/
          nfpm package -p rpm -f deploy/packaging/nfpm.yaml -t dist/
          cp bin/macuahuitld bin/mctl bin/macuahuitl LICENSE NOTICE THIRD_PARTY_LICENSES dist/
      - name: SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/macuahuitl-${{ env.VERSION }}.sbom.spdx.json
          upload-artifact: false
      - name: sumas
        run: |
          (cd dist && sha256sum -c --quiet "$RUNNER_TEMP/mpack.sha256") # nada tocó los .mpack desde que se firmaron
          cd dist && sha256sum * > SHA256SUMS
          { echo "go: $(go version)"; echo "tag: ${GITHUB_REF_NAME}"; echo "commit: ${GITHUB_SHA}"; echo "reproducible: macuahuitld, mctl (CGO_ENABLED=0 -trimpath -ldflags '-s -w -buildid=')"; echo "no reproducible byte a byte: macuahuitl (UI con cgo/WebKitGTK)"; } > BUILD-INFO.txt
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
