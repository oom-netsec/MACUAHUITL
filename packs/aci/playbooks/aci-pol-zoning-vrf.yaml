# Propósito: Reglas de zoning acotadas al VNID de una VRF, con sus filtros.
# Cuándo usarlo: Hay que revisar solo las reglas de un tenant y VRF. Pide el VNID como número (p. ej. 2850817).
# Fuente: https://www.cisco.com/c/en/us/support/cloud-systems-management/application-policy-infrastructure-controller-apic/products-troubleshooting-guides-list.html
# Sin validar en laboratorio: leaf/spine ACI, comandos tomados de la documentación de Cisco
id: aci-pol-zoning-vrf
platform: nx-os
name: ACI · Contratos · Zoning de una VRF (scope)
name_en: ACI · Contracts · VRF zoning (scope)
params:
  - name: vnid
    kind: ap
commands:
  - cmd: show zoning-rule scope {vnid}
  - cmd: show zoning-filter
  - cmd: show vrf
  - cmd: show ip interface brief vrf all
  - cmd: show vlan extended
  - cmd: show vrf all detail
    timeout: 180s
