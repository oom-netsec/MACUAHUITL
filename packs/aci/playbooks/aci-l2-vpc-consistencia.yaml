# Propósito: Parámetros de consistencia del vPC y su estado.
# Cuándo usarlo: Un vPC reporta tipo 1 o 2 inconsistente.
# Fuente: https://www.cisco.com/c/en/us/support/cloud-systems-management/application-policy-infrastructure-controller-apic/products-troubleshooting-guides-list.html
# Sin validar en laboratorio: leaf/spine ACI, comandos tomados de la documentación de Cisco
id: aci-l2-vpc-consistencia
platform: nx-os
name: ACI · L2 · Consistencia de vPC
name_en: ACI · L2 · vPC consistency
commands:
  - cmd: show vpc brief
  - cmd: show vpc consistency-parameters global
  - cmd: show vpc role
  - cmd: show lacp neighbor
  - cmd: show port-channel summary
  - cmd: show logging logfile | include VPC
    timeout: 180s
