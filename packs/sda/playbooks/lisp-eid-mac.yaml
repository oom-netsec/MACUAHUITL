# Propósito: Sigue una MAC por la tabla MAC, device-tracking y LISP.
# Cuándo usarlo: Un endpoint de capa 2 no se alcanza.
# Fuente: https://www.cisco.com/c/en/us/solutions/enterprise-networks/software-defined-access/index.html
# Validado en laboratorio: no (sin equipo; pendiente sandbox SD-Access de DevNet)
id: lisp-eid-mac
platform: sda
name: SD-Access · LISP · Un EID por MAC
name_en: SD-Access · LISP · One EID by MAC
params:
  - name: mac
    kind: mac
commands:
  - cmd: show clock
  - cmd: show mac address-table address {mac}
  - cmd: show device-tracking database mac {mac}
  - cmd: show lisp all instance-id * ethernet database
    timeout: 180s
  - cmd: show lisp all instance-id * ethernet map-cache
    timeout: 180s
  - cmd: show lisp all instance-id * ethernet server
    timeout: 180s
