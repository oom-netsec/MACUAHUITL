# Propósito: Recolecta LISP, BGP y rutas por VRF cuando el border no tiene rutas.
# Cuándo usarlo: Destinos externos o del tránsito inalcanzables.
# Fuente: https://www.cisco.com/c/en/us/solutions/enterprise-networks/software-defined-access/index.html
# Validado en laboratorio: no (sin equipo; pendiente sandbox SD-Access de DevNet)
id: tac-border-sin-rutas
platform: sda
name: SD-Access · TAC · Border sin rutas
name_en: SD-Access · TAC · Border with no routes
commands:
  - cmd: show clock
  - cmd: show lisp session
  - cmd: show lisp all instance-id * ipv4 map-cache
    timeout: 180s
  - cmd: show lisp all instance-id * ipv4 server summary
  - cmd: show ip bgp summary
  - cmd: show ip route vrf * summary
  - cmd: show access-tunnel summary
  - cmd: show cts environment-data
  - cmd: show logging | include BGP|LISP
    timeout: 180s
