# Propósito: Lista los registros del servidor de mapeos por tipo de EID.
# Cuándo usarlo: Un endpoint no se registra o desaparece del control plane.
# Fuente: https://www.cisco.com/c/en/us/solutions/enterprise-networks/software-defined-access/index.html
# Validado en laboratorio: no (sin equipo; pendiente sandbox SD-Access de DevNet)
id: lisp-sitios
platform: sda
name: SD-Access · LISP · Sitios y registros del control plane
name_en: SD-Access · LISP · Sites and control-plane registrations
commands:
  - cmd: show clock
  - cmd: show lisp session
  - cmd: show lisp all instance-id * ipv4 server
  - cmd: show lisp all instance-id * ethernet server
    timeout: 180s
  - cmd: show lisp all instance-id * ipv6 server
  - cmd: show lisp all instance-id * ipv4 server summary
  - cmd: show lisp all instance-id * ethernet server summary
