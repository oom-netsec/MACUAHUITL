# Propósito: Sigue una IP por ruta, CEF y las tablas LISP.
# Cuándo usarlo: Una IP no se alcanza dentro del fabric.
# Fuente: https://www.cisco.com/c/en/us/solutions/enterprise-networks/software-defined-access/index.html
# Validado en laboratorio: no (sin equipo; pendiente sandbox SD-Access de DevNet)
id: lisp-eid-ip
platform: sda
name: SD-Access · LISP · Un EID por IP
name_en: SD-Access · LISP · One EID by IP
params:
  - name: ip
    kind: ip
commands:
  - cmd: show clock
  - cmd: show ip route {ip}
  - cmd: show ip cef {ip} detail
  - cmd: show ip arp {ip}
  - cmd: show lisp all instance-id * ipv4 map-cache
    timeout: 180s
  - cmd: show lisp all instance-id * ipv4 database
    timeout: 180s
  - cmd: show lisp all instance-id * ipv4 server
    timeout: 180s
