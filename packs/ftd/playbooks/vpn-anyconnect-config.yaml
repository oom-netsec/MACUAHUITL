# Propósito: Configuración de webvpn, grupos, políticas y pool de direcciones.
# Cuándo usarlo: Un cliente no recibe la política esperada.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: vpn-anyconnect-config
platform: ftd
name: FTD · VPN · Configuración de AnyConnect
name_en: FTD · VPN · AnyConnect configuration
commands:
  - cmd: show clock
  - cmd: show running-config webvpn
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config tunnel-group
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config group-policy
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config ssl
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config ip local pool
    timeout: 120s
    may_contain_secrets: true
