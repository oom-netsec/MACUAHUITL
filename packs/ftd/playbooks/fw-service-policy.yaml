# Propósito: Políticas de servicio, inspecciones y sus contadores.
# Cuándo usarlo: Una inspección de protocolo descarta o modifica tráfico.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: fw-service-policy
platform: ftd
name: FTD · Firewall · Service-policy e inspección
name_en: FTD · Firewall · Service-policy and inspection
commands:
  - cmd: show clock
  - cmd: show service-policy
  - cmd: show service-policy | include drop
  - cmd: show running-config policy-map
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config class-map
    timeout: 120s
    may_contain_secrets: true
  - cmd: show conn count
