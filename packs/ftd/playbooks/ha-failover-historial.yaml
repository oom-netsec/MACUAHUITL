# Propósito: Historial de cambios de estado de failover y mensajes relacionados.
# Cuándo usarlo: Hubo un failover y se busca la causa.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: ha-failover-historial
platform: ftd
name: FTD · Alta disponibilidad · Historial de failover
name_en: FTD · High availability · Failover history
commands:
  - cmd: show clock
  - cmd: show failover history
  - cmd: show failover state
  - cmd: show failover
  - cmd: show logging | include ailover
    timeout: 180s
  - cmd: show interface ip brief
