# Propósito: Vecinos, topología e interfaces de EIGRP.
# Cuándo usarlo: Un vecino EIGRP no sube o hay rutas inestables.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: l3-eigrp
platform: ftd
name: FTD · Capa 3 · EIGRP
name_en: FTD · Layer 3 · EIGRP
commands:
  - cmd: show clock
  - cmd: show eigrp neighbors
  - cmd: show eigrp topology
  - cmd: show eigrp interfaces
  - cmd: show route eigrp
  - cmd: show running-config router eigrp
    timeout: 120s
    may_contain_secrets: true
