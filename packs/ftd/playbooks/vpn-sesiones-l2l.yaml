# Propósito: Sesiones L2L activas con sus SAs.
# Cuándo usarlo: Se necesita el estado de los túneles sitio a sitio.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: vpn-sesiones-l2l
platform: ftd
name: FTD · VPN · Sesiones sitio a sitio
name_en: FTD · VPN · Site-to-site sessions
commands:
  - cmd: show clock
  - cmd: show vpn-sessiondb summary
  - cmd: show vpn-sessiondb l2l
  - cmd: show vpn-sessiondb detail l2l
    timeout: 120s
  - cmd: show crypto ikev2 sa
  - cmd: show crypto ipsec sa
    timeout: 120s
