# Propósito: Dirección de gestión, DNS, hora y estado de la interfaz de gestión.
# Cuándo usarlo: No se alcanza la gestión del FTD o se cambió su red.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: mgmt-red
platform: ftd
name: FTD · Gestión · Red de gestión
name_en: FTD · Management · Management network
commands:
  - cmd: show clock
  - cmd: show network
    may_contain_secrets: true
  - cmd: show managers
    may_contain_secrets: true
  - cmd: show dns
  - cmd: show ntp
  - cmd: show interface ip brief
