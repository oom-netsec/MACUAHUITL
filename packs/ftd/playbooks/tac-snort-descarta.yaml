# Propósito: Estado de Snort, política de acceso y conexiones de la IP indicada.
# Cuándo usarlo: Se sospecha que la inspección de Snort bloquea un flujo legítimo.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: tac-snort-descarta
platform: ftd
name: FTD · TAC · Snort descarta tráfico
name_en: FTD · TAC · Snort dropping traffic
params:
  - name: ip
    kind: ip
commands:
  - cmd: show clock
  - cmd: show snort statistics
  - cmd: show snort3 status
  - cmd: show snort instances
  - cmd: show access-control-config
    timeout: 120s
  - cmd: show conn address {ip} detail
    timeout: 120s
  - cmd: show asp drop
    timeout: 120s
  - cmd: show logging | include {ip}
    timeout: 180s
