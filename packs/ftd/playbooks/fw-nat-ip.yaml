# Propósito: Reglas NAT, xlates y ruta relacionados con la IP indicada.
# Cuándo usarlo: Una IP no se traduce como se espera.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: fw-nat-ip
platform: ftd
name: FTD · Firewall · NAT de una IP
name_en: FTD · Firewall · NAT of one IP
params:
  - name: ip
    kind: ip
commands:
  - cmd: show clock
  - cmd: show nat detail | include {ip}
    timeout: 120s
  - cmd: show xlate local {ip}
  - cmd: show xlate global {ip}
  - cmd: show running-config nat | include {ip}
    timeout: 120s
    may_contain_secrets: true
  - cmd: show route {ip}
  - cmd: show arp | include {ip}
