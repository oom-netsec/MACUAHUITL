# Propósito: Simulación con packet-tracer (TCP 443, TCP 80 e ICMP) más NAT, ACL, política de acceso, rutas y descartes. Ojo: packet-tracer sube los contadores hitcnt de las ACL que toca.
# Cuándo usarlo: Un flujo entre dos hosts no pasa por el FTD y se necesita ver qué fase lo descarta.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: tac-trafico-no-pasa
platform: ftd
name: FTD · TAC · Tráfico que no pasa (packet-tracer)
name_en: FTD · TAC · Traffic not passing (packet-tracer)
params:
  - name: interface
    kind: interface
  - name: src
    kind: ip
  - name: dst
    kind: ip
commands:
  - cmd: show clock
  - cmd: packet-tracer input {interface} tcp {src} 12345 {dst} 443 detailed
  - cmd: packet-tracer input {interface} tcp {src} 12345 {dst} 80 detailed
  - cmd: packet-tracer input {interface} icmp {src} 8 0 {dst} detailed
  - cmd: show route {dst}
  - cmd: show nat detail
    timeout: 120s
  - cmd: show running-config access-group
    timeout: 120s
    may_contain_secrets: true
  - cmd: show access-control-config
    timeout: 120s
  - cmd: show conn address {src}
    timeout: 120s
  - cmd: show asp drop
    timeout: 120s
  - cmd: show snort statistics
  - cmd: show logging | include {src}
    timeout: 180s
