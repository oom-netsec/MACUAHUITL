# Propósito: Configuración de lina y datos de gestión (FMC, red de gestión).
# Cuándo usarlo: Se necesita la configuración de lina para revisar o comparar con TAC (puede traer claves).
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: plat-configuracion
platform: ftd
name: FTD · Plataforma · Configuración y modo de gestión
name_en: FTD · Platform · Configuration and management mode
commands:
  - cmd: show clock
  - cmd: show version
  - cmd: show managers
    may_contain_secrets: true
  - cmd: show network
    may_contain_secrets: true
  - cmd: show nameif
  - cmd: show running-config
    timeout: 120s
    may_contain_secrets: true
