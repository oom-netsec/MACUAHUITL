# Propósito: Contadores de Snort junto con descartes de ASP y de interfaz.
# Cuándo usarlo: El tráfico se pierde tras la inspección de Snort.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: snort-descartes
platform: ftd
name: FTD · Snort · Descartes de Snort
name_en: FTD · Snort · Snort drops
commands:
  - cmd: show clock
  - cmd: show snort statistics
  - cmd: show asp drop
    timeout: 120s
  - cmd: show conn count
  - cmd: show traffic
  - cmd: show interface ip brief
  - cmd: show blocks
