# Propósito: CPU de lina, procesos, Snort, conexiones y descartes.
# Cuándo usarlo: La CPU del FTD está alta.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: tac-cpu-alta
platform: ftd
name: FTD · TAC · CPU alta
name_en: FTD · TAC · High CPU
commands:
  - cmd: show clock
  - cmd: show cpu usage
  - cmd: show processes cpu-usage non-zero
  - cmd: show snort statistics
  - cmd: show snort3 status
  - cmd: show conn count
  - cmd: show traffic
  - cmd: show perfmon
  - cmd: show memory
  - cmd: show asp drop
    timeout: 120s
