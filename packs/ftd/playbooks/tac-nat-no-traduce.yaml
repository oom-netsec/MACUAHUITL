# Propósito: Reglas NAT, xlates, ruta y descartes de la IP indicada.
# Cuándo usarlo: Un host no se traduce o sale con una IP equivocada.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: tac-nat-no-traduce
platform: ftd
name: FTD · TAC · NAT que no traduce
name_en: FTD · TAC · NAT not translating
params:
  - name: ip
    kind: ip
commands:
  - cmd: show clock
  - cmd: show nat detail
    timeout: 120s
  - cmd: show xlate local {ip}
  - cmd: show xlate global {ip}
  - cmd: show running-config nat
    timeout: 120s
    may_contain_secrets: true
  - cmd: show route {ip}
  - cmd: show conn address {ip}
    timeout: 120s
  - cmd: show asp drop
    timeout: 120s
