# Propósito: Vecinos, rutas, configuración y logs de BGP.
# Cuándo usarlo: Un vecino BGP no llega a Established.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: tac-bgp-sin-vecino
platform: ftd
name: FTD · TAC · BGP sin vecino
name_en: FTD · TAC · BGP without neighbor
commands:
  - cmd: show clock
  - cmd: show bgp summary
  - cmd: show bgp neighbors
    timeout: 120s
  - cmd: show route bgp
  - cmd: show running-config router bgp
    timeout: 120s
    may_contain_secrets: true
  - cmd: show interface ip brief
  - cmd: show arp
  - cmd: show logging | include BGP
    timeout: 180s
