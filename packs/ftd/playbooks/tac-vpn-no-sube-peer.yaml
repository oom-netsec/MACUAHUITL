# Propósito: Alcance, SAs, mapas y logs del peer indicado.
# Cuándo usarlo: Un túnel sitio a sitio hacia un peer concreto no sube.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: tac-vpn-no-sube-peer
platform: ftd
name: FTD · TAC · Túnel VPN que no sube con un peer
name_en: FTD · TAC · VPN tunnel to one peer not coming up
params:
  - name: peer
    kind: ip
commands:
  - cmd: show clock
  - cmd: ping {peer}
  - cmd: show route {peer}
  - cmd: show crypto ikev2 sa | include {peer}
  - cmd: show crypto ikev1 sa | include {peer}
  - cmd: show crypto ipsec sa peer {peer}
  - cmd: show crypto ikev2 stats
  - cmd: show running-config crypto map | include {peer}
    timeout: 120s
    may_contain_secrets: true
  - cmd: show asp drop
    timeout: 120s
  - cmd: show logging | include {peer}
    timeout: 180s
