# Propósito: Asociaciones IPsec, contadores y mapas criptográficos.
# Cuándo usarlo: El túnel IKE sube pero el tráfico no cifra o no descifra.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: vpn-ipsec
platform: ftd
name: FTD · VPN · IPsec
name_en: FTD · VPN · IPsec
commands:
  - cmd: show clock
  - cmd: show crypto ipsec sa
    timeout: 120s
  - cmd: show crypto ipsec sa detail
    timeout: 120s
  - cmd: show crypto ipsec stats
  - cmd: show running-config crypto ipsec
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config crypto map
    timeout: 120s
    may_contain_secrets: true
  - cmd: show vpn-sessiondb summary
