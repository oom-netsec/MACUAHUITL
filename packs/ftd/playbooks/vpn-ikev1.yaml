# Propósito: Asociaciones IKEv1, detalle, estadísticas y configuración de políticas.
# Cuándo usarlo: Un túnel IKEv1 no sube o cae en la fase 1.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: vpn-ikev1
platform: ftd
name: FTD · VPN · IKEv1
name_en: FTD · VPN · IKEv1
commands:
  - cmd: show clock
  - cmd: show crypto ikev1 sa
  - cmd: show crypto ikev1 sa detail
  - cmd: show crypto ikev1 stats
  - cmd: show running-config crypto ikev1
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config crypto map
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config tunnel-group
    timeout: 120s
    may_contain_secrets: true
