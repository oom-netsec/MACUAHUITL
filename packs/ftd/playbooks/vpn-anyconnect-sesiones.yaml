# Propósito: Sesiones de acceso remoto, detalle y distribución por protocolo.
# Cuándo usarlo: Se revisa quién está conectado y con qué protocolo.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: vpn-anyconnect-sesiones
platform: ftd
name: FTD · VPN · Sesiones de AnyConnect
name_en: FTD · VPN · AnyConnect sessions
commands:
  - cmd: show clock
  - cmd: show vpn-sessiondb summary
  - cmd: show vpn-sessiondb anyconnect
  - cmd: show vpn-sessiondb detail anyconnect
    timeout: 120s
  - cmd: show vpn-sessiondb ratio protocol
  - cmd: show vpn-sessiondb ratio encryption
