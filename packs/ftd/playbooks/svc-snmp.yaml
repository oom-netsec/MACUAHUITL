# Propósito: Configuración de SNMP, grupos, usuarios y contadores.
# Cuándo usarlo: El monitoreo SNMP no responde o falla la autenticación.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: svc-snmp
platform: ftd
name: FTD · Servicios · SNMP
name_en: FTD · Services · SNMP
commands:
  - cmd: show clock
  - cmd: show running-config snmp-server
    timeout: 120s
    may_contain_secrets: true
  - cmd: show snmp-server statistics
  - cmd: show snmp-server group
  - cmd: show snmp-server user
  - cmd: show version
