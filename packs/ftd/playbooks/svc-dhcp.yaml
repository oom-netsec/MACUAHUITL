# Propósito: Servidor y relevo DHCP: estado, asignaciones y estadísticas.
# Cuándo usarlo: Los clientes no obtienen dirección por el FTD.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: svc-dhcp
platform: ftd
name: FTD · Servicios · DHCP
name_en: FTD · Services · DHCP
commands:
  - cmd: show clock
  - cmd: show dhcpd state
  - cmd: show dhcpd binding
  - cmd: show dhcpd statistics
  - cmd: show running-config dhcpd
    timeout: 120s
    may_contain_secrets: true
  - cmd: show dhcprelay state
  - cmd: show dhcprelay statistics
