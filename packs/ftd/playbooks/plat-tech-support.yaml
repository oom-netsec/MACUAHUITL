# Propósito: Recolección completa para un caso de TAC con show tech-support.
# Cuándo usarlo: TAC pide el show tech-support (salida muy grande; puede traer claves).
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: plat-tech-support
platform: ftd
name: FTD · Plataforma · Tech-support
name_en: FTD · Platform · Tech-support
commands:
  - cmd: show clock
  - cmd: show version
  - cmd: show managers
    may_contain_secrets: true
  - cmd: show network
    may_contain_secrets: true
  - cmd: show running-config
    timeout: 120s
    may_contain_secrets: true
  - cmd: show tech-support
    timeout: 300s
    may_contain_secrets: true
