# Propósito: SAs, estadísticas y configuración criptográfica.
# Cuándo usarlo: Un túnel sitio a sitio no sube y no se conoce el peer.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: tac-vpn-no-sube
platform: ftd
name: FTD · TAC · Túnel VPN que no sube
name_en: FTD · TAC · VPN tunnel not coming up
commands:
  - cmd: show clock
  - cmd: show crypto ikev2 sa
  - cmd: show crypto ikev1 sa
  - cmd: show crypto ipsec sa
    timeout: 120s
  - cmd: show crypto ikev2 stats
  - cmd: show crypto ikev1 stats
  - cmd: show vpn-sessiondb summary
  - cmd: show running-config crypto map
    timeout: 120s
    may_contain_secrets: true
  - cmd: show asp drop
    timeout: 120s
  - cmd: show logging | include %FTD-[0-3]-
    timeout: 180s
