# Propósito: ACL de lina con contadores hitcnt y su aplicación a interfaces.
# Cuándo usarlo: Se revisa qué ACL aplica y cuáles tienen hits.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: fw-acl
platform: ftd
name: FTD · Firewall · ACL de lina
name_en: FTD · Firewall · Lina ACLs
commands:
  - cmd: show clock
  - cmd: show access-list
    timeout: 120s
  - cmd: show access-list brief
    timeout: 120s
  - cmd: show running-config access-group
    timeout: 120s
    may_contain_secrets: true
  - cmd: show access-control-config
    timeout: 120s
  - cmd: show asp drop
    timeout: 120s
