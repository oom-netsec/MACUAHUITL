# Propósito: Administrador (FMC) registrado, red de gestión, DNS y hora.
# Cuándo usarlo: El FTD no aparece o se desconecta del FMC.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: mgmt-managers
platform: ftd
name: FTD · Gestión · Registro con el FMC
name_en: FTD · Management · Registration with the FMC
commands:
  - cmd: show clock
  - cmd: show managers
    may_contain_secrets: true
  - cmd: show network
    may_contain_secrets: true
  - cmd: show dns
  - cmd: show ntp
  - cmd: show version
