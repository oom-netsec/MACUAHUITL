# Propósito: Conteo y detalle de conexiones, xlates y descartes.
# Cuándo usarlo: Se revisa la carga de conexiones o se busca una conexión anómala.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: fw-conexiones
platform: ftd
name: FTD · Firewall · Conexiones
name_en: FTD · Firewall · Connections
commands:
  - cmd: show clock
  - cmd: show conn count
  - cmd: show xlate count
  - cmd: show perfmon
  - cmd: show asp drop
    timeout: 120s
  - cmd: show conn detail
    timeout: 120s
