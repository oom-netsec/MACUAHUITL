# Propósito: Vecinos, rutas y configuración de BGP.
# Cuándo usarlo: Un vecino BGP no sube o no recibe prefijos.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: l3-bgp
platform: ftd
name: FTD · Capa 3 · BGP
name_en: FTD · Layer 3 · BGP
commands:
  - cmd: show clock
  - cmd: show bgp summary
  - cmd: show bgp neighbors
    timeout: 120s
  - cmd: show bgp
    timeout: 120s
  - cmd: show route bgp
  - cmd: show running-config router bgp
    timeout: 120s
    may_contain_secrets: true
