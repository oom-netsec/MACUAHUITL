# Propósito: Conexiones, NAT, ruta, descartes y Snort de la IP indicada.
# Cuándo usarlo: El tráfico de un host no pasa y se necesita ver dónde se detiene.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: tac-trafico-no-pasa-ip
platform: ftd
name: FTD · TAC · Tráfico que no pasa (una IP)
name_en: FTD · TAC · Traffic not passing (one IP)
params:
  - name: ip
    kind: ip
commands:
  - cmd: show clock
  - cmd: show conn address {ip} detail
    timeout: 120s
  - cmd: show xlate local {ip}
  - cmd: show route {ip}
  - cmd: show arp | include {ip}
  - cmd: show asp drop
    timeout: 120s
  - cmd: show snort statistics
  - cmd: show access-control-config | include {ip}
    timeout: 120s
  - cmd: show logging | include {ip}
    timeout: 180s
