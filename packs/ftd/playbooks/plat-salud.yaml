# Propósito: Foto rápida de CPU, memoria, disco, failover y mensajes de error recientes.
# Cuándo usarlo: Primer vistazo a un FTD que se reporta lento o inestable.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: plat-salud
platform: ftd
name: FTD · Plataforma · Salud general
name_en: FTD · Platform · General health
commands:
  - cmd: show clock
  - cmd: show version
  - cmd: show cpu usage
  - cmd: show memory
  - cmd: show disk
  - cmd: show disk-manager
  - cmd: show failover state
  - cmd: show interface ip brief
  - cmd: show conn count
  - cmd: show logging | include %ASA-[0-3]-
    timeout: 180s
