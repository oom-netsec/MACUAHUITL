# Propósito: Configuración de SSH, HTTP y AAA de lina y sesiones activas.
# Cuándo usarlo: No se logra entrar por SSH o HTTPS a los servicios de lina.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: mgmt-acceso
platform: ftd
name: FTD · Gestión · Acceso de gestión
name_en: FTD · Management · Management access
commands:
  - cmd: show clock
  - cmd: show running-config ssh
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config http
    timeout: 120s
    may_contain_secrets: true
  - cmd: show ssh sessions
  - cmd: show running-config aaa
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config username
    timeout: 120s
    may_contain_secrets: true
