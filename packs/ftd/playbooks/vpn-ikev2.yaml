# Propósito: Asociaciones IKEv2, detalle, estadísticas y configuración de políticas.
# Cuándo usarlo: Un túnel IKEv2 no sube, rekeyea mal o cae.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: vpn-ikev2
platform: ftd
name: FTD · VPN · IKEv2
name_en: FTD · VPN · IKEv2
commands:
  - cmd: show clock
  - cmd: show crypto ikev2 sa
  - cmd: show crypto ikev2 sa detail
  - cmd: show crypto ikev2 stats
  - cmd: show running-config crypto ikev2
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config crypto map
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config tunnel-group
    timeout: 120s
    may_contain_secrets: true
