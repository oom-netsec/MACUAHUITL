# Propósito: Sesiones, configuración de webvpn, certificados y logs.
# Cuándo usarlo: Los clientes AnyConnect no logran conectarse.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: tac-anyconnect-no-conecta
platform: ftd
name: FTD · TAC · AnyConnect no conecta
name_en: FTD · TAC · AnyConnect cannot connect
commands:
  - cmd: show clock
  - cmd: show vpn-sessiondb summary
  - cmd: show vpn-sessiondb anyconnect
  - cmd: show running-config webvpn
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config tunnel-group
    timeout: 120s
    may_contain_secrets: true
  - cmd: show crypto ca certificates
  - cmd: show asp drop
    timeout: 120s
  - cmd: show logging | include webvpn|SSL|ikev2
    timeout: 180s
