# Propósito: Estado de alta disponibilidad, interfaces monitoreadas y configuración.
# Cuándo usarlo: Se revisa qué unidad está activa y si el par está sincronizado.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: ha-failover-estado
platform: ftd
name: FTD · Alta disponibilidad · Estado de failover
name_en: FTD · High availability · Failover status
commands:
  - cmd: show clock
  - cmd: show failover
  - cmd: show failover state
  - cmd: show high-availability config
  - cmd: show running-config failover
    timeout: 120s
    may_contain_secrets: true
  - cmd: show interface ip brief
  - cmd: show version
