# Propósito: Vecinos, interfaces, configuración y logs de OSPF.
# Cuándo usarlo: Un vecino OSPF no llega a Full.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: tac-ospf-sin-vecino
platform: ftd
name: FTD · TAC · OSPF sin vecino
name_en: FTD · TAC · OSPF without neighbor
commands:
  - cmd: show clock
  - cmd: show ospf neighbor
  - cmd: show ospf interface
  - cmd: show ospf
  - cmd: show interface ip brief
  - cmd: show running-config router ospf
    timeout: 120s
    may_contain_secrets: true
  - cmd: show route ospf
  - cmd: show logging | include OSPF
    timeout: 180s
