# Propósito: Descartes de ASP junto con bloques, interfaces y Snort.
# Cuándo usarlo: Se pierden paquetes y se necesita el motivo del descarte.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: tac-descartes-asp
platform: ftd
name: FTD · TAC · Descartes de ASP
name_en: FTD · TAC · ASP drops
commands:
  - cmd: show clock
  - cmd: show asp drop
    timeout: 120s
  - cmd: show conn count
  - cmd: show interface | include Interface .* is|input errors|CRC|overrun
    timeout: 120s
  - cmd: show blocks
  - cmd: show traffic
  - cmd: show snort statistics
  - cmd: show cpu usage
