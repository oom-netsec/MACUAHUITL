# Propósito: Política de control de acceso desplegada y su efecto en Snort.
# Cuándo usarlo: Se revisa qué política está desplegada en el FTD.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: fw-politica-acceso
platform: ftd
name: FTD · Firewall · Política de control de acceso
name_en: FTD · Firewall · Access control policy
commands:
  - cmd: show clock
  - cmd: show access-control-config
    timeout: 120s
  - cmd: show managers
    may_contain_secrets: true
  - cmd: show running-config access-group
    timeout: 120s
    may_contain_secrets: true
  - cmd: show snort statistics
  - cmd: show conn count
  - cmd: show asp drop
    timeout: 120s
