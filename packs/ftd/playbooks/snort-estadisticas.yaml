# Propósito: Contadores de Snort, instancias, estado y descartes.
# Cuándo usarlo: Se sospecha que Snort descarta, reinicia o se retrasa.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: snort-estadisticas
platform: ftd
name: FTD · Snort · Estadísticas de Snort
name_en: FTD · Snort · Snort statistics
commands:
  - cmd: show clock
  - cmd: show snort statistics
  - cmd: show snort instances
  - cmd: show snort3 status
  - cmd: show asp drop
    timeout: 120s
  - cmd: show cpu usage
  - cmd: show memory
