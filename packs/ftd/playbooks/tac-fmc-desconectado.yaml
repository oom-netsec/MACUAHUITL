# Propósito: Registro con el FMC, red de gestión, DNS y hora.
# Cuándo usarlo: El FMC muestra el FTD desconectado o no se puede registrar.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: tac-fmc-desconectado
platform: ftd
name: FTD · TAC · FMC desconectado
name_en: FTD · TAC · FMC disconnected
commands:
  - cmd: show clock
  - cmd: show managers
    may_contain_secrets: true
  - cmd: show network
    may_contain_secrets: true
  - cmd: show dns
  - cmd: show ntp
  - cmd: show interface ip brief
  - cmd: show version
