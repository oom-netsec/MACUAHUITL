# Propósito: Conexiones, xlates, ruta y logs del host indicado.
# Cuándo usarlo: Un host concreto no pasa tráfico o abre demasiadas conexiones.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: fw-conexion-ip
platform: ftd
name: FTD · Firewall · Conexiones de una IP
name_en: FTD · Firewall · Connections of one IP
params:
  - name: ip
    kind: ip
commands:
  - cmd: show clock
  - cmd: show conn address {ip}
    timeout: 120s
  - cmd: show conn address {ip} detail
    timeout: 120s
  - cmd: show local-host {ip}
  - cmd: show xlate local {ip}
  - cmd: show xlate global {ip}
  - cmd: show arp | include {ip}
  - cmd: show route {ip}
  - cmd: show logging | include {ip}
    timeout: 180s
