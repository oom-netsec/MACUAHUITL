# Propósito: Mensajes de error y advertencia del búfer de logging.
# Cuándo usarlo: Se busca la causa de un evento en los mensajes recientes.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/firepower/command_ref/b_Command_Reference_for_Firepower_Threat_Defense.html
# Sin validar en laboratorio (no hay FTD en el laboratorio; comandos de la documentación de Cisco).
id: plat-logs
platform: ftd
name: FTD · Plataforma · Registros
name_en: FTD · Platform · Logs
commands:
  - cmd: show clock
  - cmd: show logging setting
  - cmd: show logging queue
  - cmd: show logging | include %ASA-[0-3]-
    timeout: 180s
  - cmd: show logging | include %ASA-4-
    timeout: 180s
  - cmd: show logging
    timeout: 180s
