# Propósito: Revisa los miembros del stack, sus puertos y roles, y los eventos del administrador de stack.
# Cuándo usarlo: Un miembro del stack no se une o cambia de rol, puertos de stack caídos o sospecha de doble activo.
# Fuente: https://www.cisco.com/c/en/us/support/switches/catalyst-3560-series-switches/products-command-reference-list.html
# Sin validar en laboratorio.
id: plat-stack
platform: ios
name: Plataforma · Stack (IOS)
name_en: Platform · Stack (IOS)
commands:
  - cmd: show clock
  - cmd: show switch
  - cmd: show switch detail
  - cmd: show switch stack-ports
  - cmd: show switch stack-ports summary
  - cmd: show switch neighbors
  - cmd: show inventory
  - cmd: show module
  - cmd: show logging | include STACKMGR|STACK|SWITCH|RPS|DUAL
