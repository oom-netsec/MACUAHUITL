# Propósito: Obtiene el estado de CDP y LLDP, los vecinos descubiertos y los contadores de tramas.
# Cuándo usarlo: Documentar la topología física, confirmar con quién se conecta un puerto o diagnosticar vecinos que no aparecen.
# Fuente: https://www.cisco.com/c/en/us/support/switches/catalyst-3560-series-switches/products-command-reference-list.html
# Validado en laboratorio: WS-C3560CX-12PC-S con IOS 15.2(7)E4 (2026-11-13).
id: l2-cdp-lldp
platform: ios
name: L2 · CDP y LLDP (IOS)
name_en: L2 · CDP and LLDP (IOS)
commands:
  - cmd: show clock
  - cmd: show cdp
  - cmd: show cdp interface
  - cmd: show cdp traffic
  - cmd: show cdp neighbors
  - cmd: show lldp
  - cmd: show lldp traffic
  - cmd: show lldp neighbors
  - cmd: show cdp neighbors detail
  - cmd: show lldp neighbors detail
