# Propósito: Revisa estadísticas, traducciones y ACL de NAT.
# Cuándo usarlo: Usuarios sin salida a Internet por NAT, pool agotado o traducciones que no se crean.
# Fuente: https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipaddr/command/ipaddr-cr-book.html
# Validado en laboratorio: WS-C3560CX-12PC-S con IOS 15.2(7)E4 (2026-11-13), salvo los marcados «no existe en 3560CX».
id: l3-nat
platform: ios
name: L3 · NAT (IOS)
name_en: L3 · NAT (IOS)
commands:
  - cmd: show clock
  - cmd: show ip nat statistics
  - cmd: show ip interface brief
  - cmd: show access-lists
  - cmd: show ip access-lists
  - cmd: show logging | include NAT
  - cmd: show ip nat translations total  # no existe en 3560CX
  - cmd: show running-config | include ip nat|access-list
    may_contain_secrets: true
  - cmd: show ip nat translations verbose
    timeout: 120s
