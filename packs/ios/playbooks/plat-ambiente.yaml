# Propósito: Revisa temperatura, ventiladores y fuentes de poder, y los eventos ambientales del log.
# Cuándo usarlo: Alarmas de temperatura o ventilador, fuente de poder caída o equipo que se reinicia por calor.
# Fuente: https://www.cisco.com/c/en/us/support/switches/catalyst-3560-series-switches/products-command-reference-list.html
# Validado en laboratorio: WS-C3560CX-12PC-S con IOS 15.2(7)E4 (2026-11-13), salvo los marcados «no existe en 3560CX».
id: plat-ambiente
platform: ios
name: Plataforma · Ambiente (IOS)
name_en: Platform · Environment (IOS)
commands:
  - cmd: show clock
  # En Catalyst clásico la palabra es «env» (el 3560CX rechazó «environment» en la «i» el 2026-11-14); en ISR G2 «env»
  # abrevia «environment». all trae temperatura, ventiladores y fuentes. Sin validar todavía en laboratorio.
  - cmd: show env all
  - cmd: show inventory
  - cmd: show power inline  # presupuesto de PoE: solo en switches con PoE (no existe en ISR sin módulo PoE)
  - cmd: show version | include uptime|System returned|System restarted|Last reload|reason
  - cmd: show logging | include ENVIRONMENT|FAN|TEMP|POWER|PWR|SUPPLY|THERMAL|RPS
