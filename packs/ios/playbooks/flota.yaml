# Comandos de la documentación pública de Cisco para IOS clásico. Sin validar en laboratorio.
id: flota
platform: ios
name: Flota · Día a día (ARP, CAM, rutas, NTP, flash) (IOS)
name_en: Fleet · Day-to-day (ARP, CAM, routes, NTP, flash) (IOS)
commands:
  - cmd: show version
  - cmd: show ip arp
  - cmd: show mac address-table
    timeout: 120s
  - cmd: show ip dhcp snooping binding
  - cmd: show cdp neighbors detail
  - cmd: show lldp neighbors detail
  - cmd: show etherchannel summary
  - cmd: show ip route
    timeout: 300s
  - cmd: show ip cef
    timeout: 120s
  - cmd: show ip interface brief
  - cmd: show interfaces
    timeout: 120s
  - cmd: show interfaces status
  - cmd: show processes cpu
  - cmd: show processes memory
  - cmd: show ntp status
  - cmd: show inventory
  - cmd: "dir flash:"
