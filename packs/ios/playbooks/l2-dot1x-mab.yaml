# Propósito: Revisa las sesiones de autenticación 802.1X y MAB, los servidores RADIUS y los fallos recientes.
# Cuándo usarlo: Un usuario o dispositivo no autentica, cae a VLAN de invitados o hay tiempos de espera con RADIUS.
# Fuente: https://www.cisco.com/c/en/us/support/switches/catalyst-3560-series-switches/products-command-reference-list.html
# Sin validar en laboratorio.
id: l2-dot1x-mab
platform: ios
name: L2 · 802.1X y MAB (IOS)
name_en: L2 · 802.1X and MAB (IOS)
commands:
  - cmd: show clock
  - cmd: show authentication sessions
  - cmd: show dot1x all summary
  - cmd: show mab all
  - cmd: show aaa servers
  - cmd: show radius statistics
  - cmd: show logging | include DOT1X|MAB|AUTHMGR|RADIUS
  - cmd: show dot1x all details
  - cmd: show running-config | section aaa|dot1x|radius
    may_contain_secrets: true
