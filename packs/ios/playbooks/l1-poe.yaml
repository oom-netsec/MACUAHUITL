# Propósito: Reúne el estado de alimentación PoE por puerto, el presupuesto de potencia y los eventos ILPOWER.
# Cuándo usarlo: Un teléfono, AP o cámara no enciende o se reinicia; sospecha de presupuesto PoE agotado.
# Fuente: https://www.cisco.com/c/en/us/support/switches/catalyst-3560-series-switches/products-command-reference-list.html
# Validado en laboratorio: WS-C3560CX-12PC-S con IOS 15.2(7)E4 (2026-11-13).
id: l1-poe
platform: ios
name: L1 · PoE (IOS)
name_en: L1 · PoE (IOS)
commands:
  - cmd: show clock
  - cmd: show power inline
  - cmd: show power inline police
  - cmd: show interfaces status
  - cmd: show cdp neighbors
  - cmd: show logging | include ILPOWER|POWER_GRANTED|POWER_DENY|POE
