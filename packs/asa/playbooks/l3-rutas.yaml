# Propósito: Tabla de rutas por origen y rutas estáticas configuradas.
# Cuándo usarlo: Falta una ruta, hay una ruta equivocada o se sospecha de ruteo asimétrico.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: l3-rutas
platform: asa
name: ASA · Capa 3 · Rutas
name_en: ASA · Layer 3 · Routes
commands:
  - cmd: show clock
  - cmd: show route summary
  - cmd: show route connected
  - cmd: show route static
  - cmd: show route ospf
  - cmd: show route bgp
  - cmd: show running-config route
    may_contain_secrets: true
  - cmd: show route
    timeout: 120s
