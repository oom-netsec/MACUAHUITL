# Propósito: Ruta, ARP, ping y traceroute hacia la IP indicada.
# Cuándo usarlo: Se verifica cómo llega el ASA a una IP concreta.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: l3-ruta-ip
platform: asa
name: ASA · Capa 3 · Ruta y alcance a una IP
name_en: ASA · Layer 3 · Route and reachability to one IP
params:
  - name: ip
    kind: ip
commands:
  - cmd: show clock
  - cmd: show route {ip}
  - cmd: show arp | include {ip}
  - cmd: show conn address {ip}
    timeout: 120s
  - cmd: show access-list | include {ip}
    timeout: 120s
  - cmd: ping {ip} repeat 5
  - cmd: traceroute {ip} numeric
    timeout: 120s
