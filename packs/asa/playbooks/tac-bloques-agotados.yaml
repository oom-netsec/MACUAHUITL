# Propósito: Bloques, memoria, interfaces con falta de buffers y tráfico.
# Cuándo usarlo: Los bloques (256, 1550, 9344) llegan a cero y el ASA pierde paquetes.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-troubleshooting-guides-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: tac-bloques-agotados
platform: asa
name: ASA · TAC · Bloques agotados
name_en: ASA · TAC · Blocks exhausted
commands:
  - cmd: show clock
  - cmd: show blocks
  - cmd: show blocks old
  - cmd: show blocks queue history
  - cmd: show memory
  - cmd: show interface | include Interface|no buffer|overrun
  - cmd: show traffic
  - cmd: show asp drop
    timeout: 120s
  - cmd: show cpu usage
