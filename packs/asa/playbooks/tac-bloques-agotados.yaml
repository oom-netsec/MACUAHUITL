# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-troubleshooting-guides-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: tac-bloques-agotados
platform: asa
name: ASA · TAC · Bloques agotados
name_en: ASA · TAC · Blocks exhausted
commands:
  - cmd: show clock
  - cmd: show blocks
  - cmd: show blocks old
  - cmd: show blocks queue history
  - cmd: show memory
  - cmd: show interface | include Interface|no buffer|overrun
  - cmd: show traffic
  - cmd: show asp drop
  - cmd: show cpu usage
