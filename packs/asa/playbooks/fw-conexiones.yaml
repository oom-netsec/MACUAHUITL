# Propósito: Conteo de conexiones, tabla de conexiones y hosts locales.
# Cuándo usarlo: Se revisa cuántas conexiones hay, quién las abre o si el ASA llega a su límite.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: fw-conexiones
platform: asa
name: ASA · Firewall · Conexiones activas
name_en: ASA · Firewall · Active connections
commands:
  - cmd: show clock
  - cmd: show conn count
  - cmd: show resource usage resource conns
  - cmd: show perfmon
  - cmd: show local-host
    timeout: 120s
  - cmd: show conn
    timeout: 120s
