# Propósito: Configuración de syslog, cola, destinos y búfer.
# Cuándo usarlo: Los syslogs no llegan al servidor o se descartan mensajes.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: svc-logging
platform: asa
name: ASA · Servicios · Logging y syslog
name_en: ASA · Services · Logging and syslog
commands:
  - cmd: show clock
  - cmd: show logging setting
  - cmd: show logging queue
  - cmd: show running-config logging
    may_contain_secrets: true
  - cmd: show running-config logging | include host
    may_contain_secrets: true
  - cmd: show logging
    timeout: 180s
