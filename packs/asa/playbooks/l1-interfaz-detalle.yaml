# Propósito: Estado físico, contadores y configuración de la interfaz indicada.
# Cuándo usarlo: Una interfaz concreta pierde paquetes, no sube o negocia mal.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: l1-interfaz-detalle
platform: asa
name: ASA · Capa 1 · Detalle de una interfaz
name_en: ASA · Layer 1 · Single interface detail
params:
  - name: interface
    kind: interface
commands:
  - cmd: show clock
  - cmd: show interface {interface}
  - cmd: show interface {interface} detail
  - cmd: show ip address
  - cmd: show service-policy interface {interface}
  - cmd: show running-config access-group | include {interface}
    timeout: 120s
    may_contain_secrets: true
  - cmd: show nameif
