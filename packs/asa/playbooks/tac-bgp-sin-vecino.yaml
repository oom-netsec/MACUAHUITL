# Propósito: Alcance, ruta, estado del vecino y configuración BGP.
# Cuándo usarlo: Una sesión BGP no llega a Established.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-troubleshooting-guides-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: tac-bgp-sin-vecino
platform: asa
name: ASA · TAC · BGP sin sesión con un vecino
name_en: ASA · TAC · BGP session not up with a neighbor
params:
  - name: ip
    kind: ip
commands:
  - cmd: show clock
  - cmd: ping {ip} repeat 5
  - cmd: show route {ip}
  - cmd: show arp | include {ip}
  - cmd: show bgp summary
  - cmd: show bgp neighbors {ip}
  - cmd: show conn address {ip}
  - cmd: show running-config router bgp
    may_contain_secrets: true
  - cmd: show asp drop
  - cmd: show logging | include BGP
    timeout: 180s
