# Propósito: Descartes del acelerador de rutas rápidas (ASP) y eventos de plano de datos.
# Cuándo usarlo: Se necesita saber por qué el ASA descarta paquetes (acl-drop, no-route, tcp-not-syn, etc.).
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: l1-descartes-asp
platform: asa
name: ASA · Capa 1 · Descartes de ASP
name_en: ASA · Layer 1 · ASP drops
commands:
  - cmd: show clock
  - cmd: show asp drop
    timeout: 120s
  - cmd: show asp drop frame
    timeout: 120s
  - cmd: show asp drop flow
    timeout: 120s
  - cmd: show asp event dp-cp
  - cmd: show asp load-balance
  - cmd: show conn count
  - cmd: show access-list | include hitcnt=
    timeout: 120s
