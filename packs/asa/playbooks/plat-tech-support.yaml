# Propósito: Recolección completa para un caso de TAC con tech-support.
# Cuándo usarlo: TAC pide el show tech-support (salida muy grande; puede traer claves).
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: plat-tech-support
platform: asa
name: ASA · Plataforma · Tech-support
name_en: ASA · Platform · Tech-support
commands:
  - cmd: show clock
  - cmd: show version
  - cmd: show failover state
  - cmd: show context detail  # solo multicontexto (espacio del sistema)
  - cmd: show running-config
    timeout: 120s
    may_contain_secrets: true
  - cmd: show tech-support
    timeout: 300s
    may_contain_secrets: true
