# Propósito: Cambios de estado y razones de las conmutaciones, con syslogs relacionados.
# Cuándo usarlo: El par conmutó y hay que saber cuándo y por qué.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: ha-failover-historial
platform: asa
name: ASA · Alta disponibilidad · Historial de failover
name_en: ASA · High availability · Failover history
commands:
  - cmd: show clock
  - cmd: show failover history
  - cmd: show failover state
  - cmd: show failover
  - cmd: show interface ip brief
  - cmd: "show logging | include ASA-[0-9]-(104|105)"
    timeout: 180s
