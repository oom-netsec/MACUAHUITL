# Propósito: Configuración activa, inicial y modo de operación del equipo.
# Cuándo usarlo: Se necesita la configuración completa para revisar o comparar contra TAC (puede traer claves).
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: plat-configuracion
platform: asa
name: ASA · Plataforma · Configuración activa e inicial
name_en: ASA · Platform · Running and startup config
commands:
  - cmd: show clock
  - cmd: show version
  - cmd: show mode
  - cmd: show firewall
  - cmd: show checksum
  - cmd: show running-config
    may_contain_secrets: true
  - cmd: show startup-config
    may_contain_secrets: true
