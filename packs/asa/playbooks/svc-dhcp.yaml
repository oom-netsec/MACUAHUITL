# Propósito: Estado, asignaciones y estadísticas del servidor y del relay DHCP.
# Cuándo usarlo: Los clientes no obtienen dirección del ASA o del relay.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: svc-dhcp
platform: asa
name: ASA · Servicios · DHCP servidor y relay
name_en: ASA · Services · DHCP server and relay
commands:
  - cmd: show clock
  - cmd: show dhcpd state
  - cmd: show dhcpd binding
  - cmd: show dhcpd statistics
  - cmd: show dhcprelay state
  - cmd: show dhcprelay statistics
  - cmd: show ip address dhcp
  - cmd: show running-config dhcpd
    may_contain_secrets: true
