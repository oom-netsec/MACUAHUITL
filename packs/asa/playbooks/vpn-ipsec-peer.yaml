# Propósito: SAs, sesiones y configuración relacionadas con el peer indicado.
# Cuándo usarlo: Un túnel site-to-site concreto no sube o no pasa tráfico.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: vpn-ipsec-peer
platform: asa
name: ASA · VPN · IPsec con un peer
name_en: ASA · VPN · IPsec with one peer
params:
  - name: peer
    kind: ip
commands:
  - cmd: show clock
  - cmd: ping {peer}
  - cmd: show route {peer}
  - cmd: show crypto ikev2 sa | include {peer}
  - cmd: show crypto ikev1 sa | include {peer}
  - cmd: show crypto ipsec sa peer {peer}
  - cmd: show crypto ipsec sa peer {peer} detail
  - cmd: show running-config crypto map | include {peer}
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config tunnel-group {peer}
    timeout: 120s
    may_contain_secrets: true
  - cmd: show conn address {peer}
    timeout: 120s
  - cmd: show logging | include {peer}
    timeout: 180s
