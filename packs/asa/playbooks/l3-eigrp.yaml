# Propósito: Vecinos, topología, interfaces y tráfico de EIGRP.
# Cuándo usarlo: Un vecino EIGRP cae o la topología no converge.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: l3-eigrp
platform: asa
name: ASA · Capa 3 · EIGRP
name_en: ASA · Layer 3 · EIGRP
commands:
  - cmd: show clock
  - cmd: show eigrp neighbors
  - cmd: show eigrp topology
  - cmd: show eigrp interfaces
  - cmd: show eigrp traffic
  - cmd: show eigrp events
  - cmd: show route eigrp
  - cmd: show running-config router eigrp
    timeout: 120s
    may_contain_secrets: true
