# Propósito: Tabla ARP, estadísticas y tabla de MAC en modo transparente.
# Cuándo usarlo: Un host no responde ARP o hay MAC duplicadas.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: l3-arp
platform: asa
name: ASA · Capa 3 · ARP y vecinos
name_en: ASA · Layer 3 · ARP and neighbors
commands:
  - cmd: show clock
  - cmd: show arp
  - cmd: show arp statistics
  - cmd: show running-config arp
    may_contain_secrets: true
  - cmd: show mac-address-table
  - cmd: show interface ip brief
