# Propósito: Archivos de crash, espacio en disco y últimos reinicios del equipo.
# Cuándo usarlo: El ASA se reinició sin aviso o TAC pide el crashinfo.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: plat-crashinfo
platform: asa
name: ASA · Plataforma · Crashinfo y archivos
name_en: ASA · Platform · Crashinfo and files
commands:
  - cmd: show clock
  - cmd: show version
  - cmd: show crashinfo
  - cmd: dir
  - cmd: "dir disk0:"
  - cmd: show bootvar
