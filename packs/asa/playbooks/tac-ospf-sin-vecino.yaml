# Propósito: Alcance, ARP, ruta, interfaces y contadores OSPF hacia el vecino.
# Cuándo usarlo: Un vecino OSPF no llega a FULL.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-troubleshooting-guides-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: tac-ospf-sin-vecino
platform: asa
name: ASA · TAC · OSPF sin adyacencia
name_en: ASA · TAC · OSPF no adjacency
params:
  - name: ip
    kind: ip
commands:
  - cmd: show clock
  - cmd: ping {ip} repeat 5
  - cmd: show arp | include {ip}
  - cmd: show route {ip}
  - cmd: show ospf neighbor
  - cmd: show ospf interface
  - cmd: show ospf traffic
  - cmd: show ospf
  - cmd: show running-config router ospf
    timeout: 120s
    may_contain_secrets: true
  - cmd: show access-list | include ospf
    timeout: 120s
  - cmd: show asp drop
    timeout: 120s
  - cmd: show logging | include OSPF
    timeout: 180s
