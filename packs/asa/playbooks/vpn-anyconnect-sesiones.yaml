# Propósito: Sesiones AnyConnect activas, licencias y distribución por protocolo.
# Cuándo usarlo: Se revisa quién está conectado por AnyConnect o si se agotó la licencia.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: vpn-anyconnect-sesiones
platform: asa
name: ASA · VPN · Sesiones AnyConnect
name_en: ASA · VPN · AnyConnect sessions
commands:
  - cmd: show clock
  - cmd: show vpn-sessiondb summary
  - cmd: show vpn-sessiondb license-summary
  - cmd: show vpn-sessiondb ratio protocol
  - cmd: show vpn-sessiondb anyconnect
  - cmd: show vpn-sessiondb detail anyconnect
    timeout: 120s
