# Propósito: Resumen de vecinos, detalle por vecino y rutas BGP.
# Cuándo usarlo: Una sesión BGP no sube o no se anuncian/reciben prefijos.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: l3-bgp
platform: asa
name: ASA · Capa 3 · BGP
name_en: ASA · Layer 3 · BGP
commands:
  - cmd: show clock
  - cmd: show bgp summary
  - cmd: show bgp neighbors
  - cmd: show route bgp
  - cmd: show running-config router bgp
    may_contain_secrets: true
  - cmd: show bgp
    timeout: 120s
