# Propósito: Conexiones, xlates, rutas, ARP, ACL y descartes de la IP indicada.
# Cuándo usarlo: Un host no logra comunicarse a través del ASA y no se conoce el destino.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-troubleshooting-guides-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: tac-trafico-no-pasa-ip
platform: asa
name: ASA · TAC · Tráfico de una IP que no pasa
name_en: ASA · TAC · One IP not passing traffic
params:
  - name: ip
    kind: ip
commands:
  - cmd: show clock
  - cmd: show conn address {ip}
    timeout: 120s
  - cmd: show local-host {ip}
  - cmd: show xlate local {ip}
  - cmd: show arp | include {ip}
  - cmd: show route {ip}
  - cmd: show access-list | include {ip}
    timeout: 120s
  - cmd: show asp drop
    timeout: 120s
  - cmd: ping {ip} repeat 5
  - cmd: show logging | include {ip}
    timeout: 180s
