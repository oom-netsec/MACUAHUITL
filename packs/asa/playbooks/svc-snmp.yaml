# Propósito: Estadísticas, grupos, usuarios y configuración de SNMP.
# Cuándo usarlo: El NMS no sondea el ASA o no llegan traps.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: svc-snmp
platform: asa
name: ASA · Servicios · SNMP
name_en: ASA · Services · SNMP
commands:
  - cmd: show clock
  - cmd: show snmp-server statistics
  - cmd: show snmp-server group
  - cmd: show snmp-server user
  - cmd: show snmp-server engineID
  - cmd: show running-config snmp-server
    timeout: 120s
    may_contain_secrets: true
