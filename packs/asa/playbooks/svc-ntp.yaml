# Propósito: Estado y asociaciones de NTP y configuración del reloj.
# Cuándo usarlo: El reloj está desfasado, falla un certificado o la sincronización NTP.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: svc-ntp
platform: asa
name: ASA · Servicios · NTP y reloj
name_en: ASA · Services · NTP and clock
commands:
  - cmd: show clock
  - cmd: show clock detail
  - cmd: show ntp status
  - cmd: show ntp associations
  - cmd: show ntp associations detail
  - cmd: show running-config ntp
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config clock
    timeout: 120s
    may_contain_secrets: true
