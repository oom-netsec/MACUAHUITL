# Propósito: Estado, nameif, nivel de seguridad y direcciones de las interfaces.
# Cuándo usarlo: Se revisa qué interfaces están arriba y con qué nombre y dirección.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: l1-resumen-interfaces
platform: asa
name: ASA · Capa 1 · Resumen de interfaces
name_en: ASA · Layer 1 · Interface summary
commands:
  - cmd: show clock
  - cmd: show interface ip brief
  - cmd: show nameif
  - cmd: show ip address
  - cmd: show running-config interface
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config mtu
    timeout: 120s
    may_contain_secrets: true
