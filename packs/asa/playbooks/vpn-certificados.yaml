# Propósito: Trustpoints, certificados, CRL y llaves públicas.
# Cuándo usarlo: Un certificado venció, no valida o el cliente muestra advertencia.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: vpn-certificados
platform: asa
name: ASA · VPN · Certificados y trustpoints
name_en: ASA · VPN · Certificates and trustpoints
commands:
  - cmd: show clock
  - cmd: show crypto ca trustpoints
  - cmd: show crypto ca certificates
  - cmd: show crypto ca crls
  - cmd: show crypto ca trustpool
  - cmd: show crypto key mypubkey rsa
  - cmd: show running-config ssl
    timeout: 120s
    may_contain_secrets: true
