# Propósito: Simulación con packet-tracer (TCP 443, TCP 80 e ICMP) más NAT, ACL, rutas y descartes. Ojo: packet-tracer sube los contadores hitcnt de las ACL y, con tráfico interesante para un crypto map, puede iniciar la negociación IKE.
# Cuándo usarlo: Un flujo entre dos hosts no pasa por el ASA y se necesita ver qué fase lo descarta.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-troubleshooting-guides-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: tac-trafico-no-pasa
platform: asa
name: ASA · TAC · Tráfico que no pasa (packet-tracer)
name_en: ASA · TAC · Traffic not passing (packet-tracer)
params:
  - name: interface
    kind: interface
  - name: src
    kind: ip
  - name: dst
    kind: ip
commands:
  - cmd: show clock
  - cmd: packet-tracer input {interface} tcp {src} 12345 {dst} 443 detailed
  - cmd: packet-tracer input {interface} tcp {src} 12345 {dst} 80 detailed
  - cmd: packet-tracer input {interface} icmp {src} 8 0 {dst} detailed
  - cmd: show route {dst}
  - cmd: show nat detail
    timeout: 120s
  - cmd: show running-config access-group
    timeout: 120s
    may_contain_secrets: true
  - cmd: show conn address {src}
    timeout: 120s
  - cmd: show asp drop
    timeout: 120s
  - cmd: show capture
  - cmd: show access-list | include {dst}
    timeout: 120s
  - cmd: show logging | include {src}
    timeout: 180s
