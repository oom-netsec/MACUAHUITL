# Propósito: Webvpn, grupos, túneles, pools y paquetes del cliente instalados.
# Cuándo usarlo: Los clientes AnyConnect no conectan o reciben una política equivocada.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: vpn-anyconnect-config
platform: asa
name: ASA · VPN · Configuración de AnyConnect
name_en: ASA · VPN · AnyConnect configuration
commands:
  - cmd: show clock
  - cmd: show webvpn anyconnect
  - cmd: show running-config webvpn
    may_contain_secrets: true
  - cmd: show running-config tunnel-group
    may_contain_secrets: true
  - cmd: show running-config group-policy
    may_contain_secrets: true
  - cmd: show running-config ip local pool
    may_contain_secrets: true
  - cmd: show ip local pool
  - cmd: show ssl
  - cmd: show ssl cipher
