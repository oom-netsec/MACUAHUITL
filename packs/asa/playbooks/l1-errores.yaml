# Propósito: Contadores de error, overruns, CRC y colisiones de todas las interfaces.
# Cuándo usarlo: Hay paquetes perdidos en el enlace, sospecha de cable, dúplex o falta de buffers.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: l1-errores
platform: asa
name: ASA · Capa 1 · Errores y descartes de interfaz
name_en: ASA · Layer 1 · Interface errors and drops
commands:
  - cmd: show clock
  - cmd: show interface | include Interface|line protocol|input errors|CRC|overrun|underrun|no buffer|collisions
  - cmd: show interface detail | include Interface|drops|overrun|no buffer|underruns|late collisions
  - cmd: show traffic
  - cmd: show blocks
  - cmd: show asp drop
    timeout: 120s
