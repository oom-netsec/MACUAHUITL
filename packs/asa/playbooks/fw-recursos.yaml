# Propósito: Uso de conexiones, xlates, hosts y syslogs contra los límites del equipo y del contexto.
# Cuándo usarlo: El ASA o un contexto topa con sus límites de conexiones, xlates o inspecciones.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: fw-recursos
platform: asa
name: ASA · Firewall · Recursos y límites de conexión
name_en: ASA · Firewall · Resource and connection limits
commands:
  - cmd: show clock
  - cmd: show resource usage
  - cmd: show resource usage resource conns
  - cmd: show resource usage resource xlates
  - cmd: show resource usage resource inspects  # solo multicontexto (espacio del sistema)
  - cmd: show resource allocation  # solo multicontexto (espacio del sistema)
  - cmd: show conn count
  - cmd: show xlate count
