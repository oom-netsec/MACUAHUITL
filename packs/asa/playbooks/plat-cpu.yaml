# Propósito: Uso de CPU global y por proceso, con los procesos que más consumen.
# Cuándo usarlo: La CPU del ASA está alta o con picos y hay que saber qué proceso la consume.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: plat-cpu
platform: asa
name: ASA · Plataforma · CPU por proceso
name_en: ASA · Platform · CPU by process
commands:
  - cmd: show clock
  - cmd: show cpu usage
  - cmd: show processes cpu-usage sorted non-zero
  - cmd: show processes cpu-hog
  - cmd: show perfmon
  - cmd: show traffic
  - cmd: show asp load-balance
  - cmd: show conn count
