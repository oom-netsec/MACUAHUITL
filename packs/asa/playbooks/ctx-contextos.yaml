# Propósito: Modo de contextos, lista, detalle y configuración de clases de recursos.
# Cuándo usarlo: Se revisa qué contextos existen, sus interfaces y su archivo de configuración.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: ctx-contextos
platform: asa
name: ASA · Contextos · Contextos
name_en: ASA · Contexts · Contexts
commands:
  - cmd: show clock
  - cmd: show mode
  - cmd: show context  # solo multicontexto (espacio del sistema)
  - cmd: show context detail  # solo multicontexto (espacio del sistema)
  - cmd: show admin-context  # solo multicontexto (espacio del sistema)
  - cmd: show running-config context  # solo multicontexto (espacio del sistema)
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config class
    timeout: 120s
    may_contain_secrets: true
