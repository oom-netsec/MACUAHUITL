# Propósito: Configuración, certificados, AAA, pools y mensajes de syslog de AnyConnect.
# Cuándo usarlo: Los usuarios de AnyConnect no logran conectar.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-troubleshooting-guides-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: tac-anyconnect-no-conecta
platform: asa
name: ASA · TAC · AnyConnect no conecta
name_en: ASA · TAC · AnyConnect not connecting
commands:
  - cmd: show clock
  - cmd: show vpn-sessiondb summary
  - cmd: show vpn-sessiondb license-summary
  - cmd: show webvpn anyconnect
  - cmd: show running-config webvpn
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config tunnel-group
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config group-policy
    timeout: 120s
    may_contain_secrets: true
  - cmd: show ip local pool
  - cmd: show crypto ca certificates
  - cmd: show ssl cipher
  - cmd: show aaa-server
  - cmd: "show logging | include ASA-[0-9]-(716|113|722)"
    timeout: 180s
