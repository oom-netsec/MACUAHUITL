# Propósito: Alcance, SAs, mapas y logs del peer indicado.
# Cuándo usarlo: Un túnel site-to-site hacia un peer concreto no sube.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-troubleshooting-guides-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: tac-tunel-no-sube-peer
platform: asa
name: ASA · TAC · Túnel VPN que no sube con un peer
name_en: ASA · TAC · VPN tunnel to one peer not coming up
params:
  - name: peer
    kind: ip
commands:
  - cmd: show clock
  - cmd: ping {peer}
  - cmd: show route {peer}
  - cmd: show crypto ikev2 sa | include {peer}
  - cmd: show crypto ikev1 sa | include {peer}
  - cmd: show crypto ipsec sa peer {peer}
  - cmd: show crypto ikev2 stats
  - cmd: show crypto ikev1 stats
  - cmd: show running-config crypto map | include {peer}
    may_contain_secrets: true
  - cmd: show running-config tunnel-group {peer}
    may_contain_secrets: true
  - cmd: show asp drop
  - cmd: show logging | include {peer}
    timeout: 180s
