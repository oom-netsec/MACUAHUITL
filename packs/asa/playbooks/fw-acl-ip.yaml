# Propósito: Reglas de ACL, objetos y grupos que mencionan la IP indicada.
# Cuándo usarlo: Se busca qué regla afecta a un host o red concreta.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: fw-acl-ip
platform: asa
name: ASA · Firewall · ACL de una IP
name_en: ASA · Firewall · ACLs mentioning one IP
params:
  - name: ip
    kind: ip
commands:
  - cmd: show clock
  - cmd: show access-list | include {ip}
    timeout: 120s
  - cmd: show running-config access-list | include {ip}
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config object | include {ip}
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config object-group | include {ip}
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config access-group
    timeout: 120s
    may_contain_secrets: true
