# Propósito: Hosts bloqueados con shun, estadísticas y threat-detection relacionado.
# Cuándo usarlo: Un host quedó bloqueado por shun o por threat-detection y hay que identificarlo.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: sec-shun
platform: asa
name: ASA · Seguridad · Shun y bloqueos
name_en: ASA · Security · Shun and blocks
commands:
  - cmd: show clock
  - cmd: show shun
  - cmd: show shun statistics
  - cmd: show threat-detection shun
  - cmd: show threat-detection scanning-threat attackers
  - cmd: show running-config threat-detection
    may_contain_secrets: true
