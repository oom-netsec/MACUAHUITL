# Propósito: Asociaciones IPsec, estadísticas de cifrado y mapas criptográficos.
# Cuándo usarlo: La fase 2 no sube o el tráfico cifrado no cuenta (encaps/decaps en cero).
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: vpn-ipsec
platform: asa
name: ASA · VPN · IPsec
name_en: ASA · VPN · IPsec
commands:
  - cmd: show clock
  - cmd: show crypto ipsec stats
  - cmd: show crypto ipsec sa detail
  - cmd: show running-config crypto ipsec
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config crypto map
    timeout: 120s
    may_contain_secrets: true
  - cmd: show crypto accelerator statistics
  - cmd: show crypto ipsec sa
    timeout: 120s
