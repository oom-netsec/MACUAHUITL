# Propósito: Asociaciones IKEv1 (fase 1), estadísticas y configuración de políticas.
# Cuándo usarlo: Un túnel IKEv1 no negocia la fase 1 o el modo agresivo falla.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: vpn-ikev1
platform: asa
name: ASA · VPN · IKEv1
name_en: ASA · VPN · IKEv1
commands:
  - cmd: show clock
  - cmd: show crypto ikev1 sa
  - cmd: show crypto ikev1 sa detail
  - cmd: show crypto ikev1 stats
  - cmd: show running-config crypto ikev1
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config crypto isakmp
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config tunnel-group
    timeout: 120s
    may_contain_secrets: true
