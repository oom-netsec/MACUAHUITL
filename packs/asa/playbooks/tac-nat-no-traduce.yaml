# Propósito: packet-tracer más reglas NAT, pools, xlates y conflictos.
# Cuándo usarlo: Un host no se traduce, sale con otra IP o el PAT se agota.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-troubleshooting-guides-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: tac-nat-no-traduce
platform: asa
name: ASA · TAC · NAT que no traduce
name_en: ASA · TAC · NAT not translating
params:
  - name: interface
    kind: interface
  - name: src
    kind: ip
  - name: dst
    kind: ip
commands:
  - cmd: show clock
  - cmd: packet-tracer input {interface} tcp {src} 12345 {dst} 443 detailed
  - cmd: show nat detail
  - cmd: show nat pool
  - cmd: show xlate local {src}
  - cmd: show xlate count
  - cmd: show running-config nat
    may_contain_secrets: true
  - cmd: show running-config object
    may_contain_secrets: true
  - cmd: show conn address {src}
  - cmd: show asp drop
