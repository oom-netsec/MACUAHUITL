# Propósito: packet-tracer más reglas NAT, pools, xlates y conflictos. Ojo: packet-tracer sube los contadores hitcnt de las ACL y, con tráfico interesante para un crypto map, puede iniciar la negociación IKE.
# Cuándo usarlo: Un host no se traduce, sale con otra IP o el PAT se agota.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-troubleshooting-guides-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: tac-nat-no-traduce
platform: asa
name: ASA · TAC · NAT que no traduce
name_en: ASA · TAC · NAT not translating
params:
  - name: interface
    kind: interface
  - name: src
    kind: ip
  - name: dst
    kind: ip
commands:
  - cmd: show clock
  - cmd: packet-tracer input {interface} tcp {src} 12345 {dst} 443 detailed
  - cmd: show nat detail
    timeout: 120s
  - cmd: show nat pool
  - cmd: show xlate local {src}
  - cmd: show xlate count
  - cmd: show running-config nat
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config object
    timeout: 120s
    may_contain_secrets: true
  - cmd: show conn address {src}
    timeout: 120s
  - cmd: show asp drop
    timeout: 120s
