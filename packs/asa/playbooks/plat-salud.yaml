# Propósito: Foto rápida de uptime, versión, CPU, memoria, bloques e interfaces del ASA.
# Cuándo usarlo: Primer vistazo a un ASA que se reporta lento, inestable o recién reiniciado.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: plat-salud
platform: asa
name: ASA · Plataforma · Salud general
name_en: ASA · Platform · General health
commands:
  - cmd: show clock
  - cmd: show version
  - cmd: show cpu usage
  - cmd: show memory
  - cmd: show blocks
  - cmd: show interface ip brief
  - cmd: show failover state
  - cmd: show environment  # no existe en ASAv
  - cmd: show resource usage summary
