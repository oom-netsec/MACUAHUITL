# Propósito: Estado, historial, enlace de control, port-channels y syslogs del cluster.
# Cuándo usarlo: Un miembro sale del cluster o cambia de rol sin motivo.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-troubleshooting-guides-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: tac-cluster-miembro
platform: asa
name: "ASA · TAC · Cluster: miembro fuera o inestable"
name_en: ASA · TAC · Cluster member out or unstable
commands:
  - cmd: show clock
  - cmd: show cluster info
  - cmd: show cluster history
  - cmd: show cluster info transport cp
  - cmd: show cluster info incompatible-config
  - cmd: show cluster info load-monitor
  - cmd: show port-channel summary  # no existe en ASAv
  - cmd: show interface ip brief
  - cmd: show asp cluster counter
  - cmd: show running-config cluster
    timeout: 120s
    may_contain_secrets: true
  - cmd: "show logging | include ASA-[0-9]-747"
    timeout: 180s
