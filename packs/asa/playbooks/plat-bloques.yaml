# Propósito: Contadores de bloques de 256, 1550 y 9344 bytes, bloques viejos e histórico de la cola.
# Cuándo usarlo: Los bloques bajan a cero, hay descartes por falta de buffers o ráfagas en las interfaces.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: plat-bloques
platform: asa
name: ASA · Plataforma · Bloques de memoria (blocks)
name_en: ASA · Platform · Memory blocks
commands:
  - cmd: show clock
  - cmd: show blocks
  - cmd: show blocks old
  - cmd: show blocks queue history
  - cmd: show interface | include Interface|no buffer|overrun|underrun
  - cmd: show traffic
  - cmd: show asp drop
