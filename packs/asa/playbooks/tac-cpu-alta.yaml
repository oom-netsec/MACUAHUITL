# Propósito: CPU por proceso, tráfico, descartes ASP y syslogs relacionados.
# Cuándo usarlo: La CPU del ASA está alta y hay que ver el proceso o el flujo que la causa.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-troubleshooting-guides-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: tac-cpu-alta
platform: asa
name: ASA · TAC · CPU alta
name_en: ASA · TAC · High CPU
commands:
  - cmd: show clock
  - cmd: show cpu usage
  - cmd: show processes cpu-usage sorted non-zero
  - cmd: show processes cpu-hog
  - cmd: show perfmon
  - cmd: show traffic
  - cmd: show asp drop
  - cmd: show asp load-balance
  - cmd: show conn count
  - cmd: show threat-detection statistics
  - cmd: "show logging | include ASA-[0-9]-(733|4)"
    timeout: 180s
