# Propósito: Versión de software, hardware, llave de activación y estado de licencias (clásicas y Smart).
# Cuándo usarlo: Se valida una versión, un límite de licencia o un registro Smart Licensing que falla.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: plat-version-licencias
platform: asa
name: ASA · Plataforma · Versión y licencias
name_en: ASA · Platform · Version and licensing
commands:
  - cmd: show version
  - cmd: show activation-key
  - cmd: show license summary
  - cmd: show license status
  - cmd: show license usage
