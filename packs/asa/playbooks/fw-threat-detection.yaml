# Propósito: Estadísticas básicas y avanzadas, escaneos y hosts bloqueados.
# Cuándo usarlo: Se sospecha de escaneos, ataques o descartes por threat-detection.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: fw-threat-detection
platform: asa
name: ASA · Firewall · Threat-detection
name_en: ASA · Firewall · Threat detection
commands:
  - cmd: show clock
  - cmd: show threat-detection rate
  - cmd: show threat-detection statistics
  - cmd: show threat-detection scanning-threat attacker
  - cmd: show threat-detection scanning-threat target
  - cmd: show threat-detection shun
  - cmd: show running-config threat-detection
    timeout: 120s
    may_contain_secrets: true
