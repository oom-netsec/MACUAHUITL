# Propósito: Sesión, conexiones y logs del cliente con la IP indicada.
# Cuándo usarlo: Un cliente AnyConnect concreto cae, no conecta o va lento.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-troubleshooting-guides-list.html
# Sin validar en laboratorio (no hay ASA en el laboratorio; comandos de la documentación de Cisco).
id: tac-anyconnect-no-conecta-ip
platform: asa
name: ASA · TAC · AnyConnect de un cliente (IP)
name_en: ASA · TAC · One AnyConnect client (IP)
params:
  - name: ip
    kind: ip
commands:
  - cmd: show clock
  - cmd: show vpn-sessiondb detail anyconnect filter p-ipaddress {ip}
    timeout: 120s
  - cmd: show vpn-sessiondb detail anyconnect filter a-ipaddress {ip}
    timeout: 120s
  - cmd: show conn address {ip}
    timeout: 120s
  - cmd: show route {ip}
  - cmd: show asp drop
    timeout: 120s
  - cmd: show vpn-sessiondb license-summary
  - cmd: show logging | include {ip}
    timeout: 180s
