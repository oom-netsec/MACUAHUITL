# Propósito: Reglas NAT, orden, hitcounts, pools y tabla de traducciones.
# Cuándo usarlo: El NAT no traduce, se agotó un pool de PAT o hay conflicto entre reglas.
# Fuente: https://www.cisco.com/c/en/us/support/security/adaptive-security-appliance-asa-software/products-command-reference-list.html
# Validado en laboratorio: ASAv 9.x en CML, un solo contexto (2026-11-14), salvo los marcados «no existe en ASAv» o «solo multicontexto».
id: fw-xlate-nat
platform: asa
name: ASA · Firewall · NAT y tabla de xlate
name_en: ASA · Firewall · NAT and xlate table
commands:
  - cmd: show clock
  - cmd: show nat
  - cmd: show nat detail
    timeout: 120s
  - cmd: show nat pool
  - cmd: show xlate count
  - cmd: show running-config nat
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config object
    timeout: 120s
    may_contain_secrets: true
  - cmd: show xlate
    timeout: 120s
