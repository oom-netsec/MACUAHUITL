id: oom/asa
version: 1.0.1
min_core: 0.4.3
name: Cisco ASA, diagnóstico TAC
name_en: Cisco ASA, TAC diagnostics
description: Playbooks de solo lectura para Cisco ASA 9.x (ASAv, 5500-X, Firepower con imagen ASA), en modo simple y multicontexto - plataforma, interfaces, firewall (conexiones, NAT, ACL, inspección), VPN, failover y cluster, contextos, ruteo, seguridad, servicios y casos TAC; los de una interfaz, una IP o un peer piden ese dato.
description_en: Read-only playbooks for Cisco ASA 9.x (ASAv, 5500-X, Firepower with ASA image), in single and multiple context mode - platform, interfaces, firewall (connections, NAT, ACLs, inspection), VPN, failover and cluster, contexts, routing, security, services and TAC cases; the per-interface, per-IP and per-peer ones ask for that datum.
platforms: [asa]
author: oom-netsec
