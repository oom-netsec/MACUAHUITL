# Propósito: Tiempo activo, uniones, archivos de fallo y mensajes recientes.
# Cuándo usarlo: APs que se reinician o se desconectan.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: ap-eventos
platform: wlc-aireos
name: AireOS · AP · Eventos y reinicios
name_en: AireOS · AP · Events and reboots
commands:
  - cmd: show time
  - cmd: show ap uptime
    timeout: 120s
  - cmd: show ap join stats summary all
    timeout: 120s
  - cmd: show ap crash-file
  - cmd: show msglog
    timeout: 120s
  - cmd: show traplog
    timeout: 120s
