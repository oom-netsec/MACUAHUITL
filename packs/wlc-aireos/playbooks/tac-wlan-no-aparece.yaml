# Propósito: WLAN, grupos de AP y FlexConnect de una WLAN por número.
# Cuándo usarlo: Una WLAN no aparece en los APs.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: tac-wlan-no-aparece
platform: wlc-aireos
name: AireOS · TAC · WLAN no se anuncia
name_en: AireOS · TAC · WLAN not broadcast
params:
  - name: wlan
    kind: wlan
commands:
  - cmd: show time
  - cmd: show wlan {wlan}
    may_contain_secrets: true
  - cmd: show wlan summary
  - cmd: show wlan apgroups
  - cmd: show ap summary
    timeout: 120s
  - cmd: show flexconnect group summary
  - cmd: show client wlan {wlan}
