# Propósito: Errores, críticos y avisos del msglog y los traps de rogues, filtrados con grep.
# Cuándo usarlo: Hay demasiado registro y se buscan solo los errores.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: plat-logs-filtrados
platform: wlc-aireos
name: AireOS · Plataforma · Logs filtrados
name_en: AireOS · Platform · Filtered logs
commands:
  - cmd: show time
  - cmd: show sysinfo
  - cmd: grep include "ERROR" "show msglog"
    timeout: 120s
  - cmd: grep include "CRITICAL" "show msglog"
    timeout: 120s
  - cmd: grep include "WARNING" "show msglog"
    timeout: 120s
  - cmd: grep include "Rogue" "show traplog"
    timeout: 120s
