# Propósito: CPU, memoria, procesos, volcados y mensajes.
# Cuándo usarlo: CPU o memoria altas en el controlador.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: tac-cpu-memoria
platform: wlc-aireos
name: AireOS · TAC · CPU y memoria
name_en: AireOS · TAC · CPU and memory
commands:
  - cmd: show time
  - cmd: show sysinfo
  - cmd: show cpu
  - cmd: show memory statistics
  - cmd: show process cpu
  - cmd: show process memory
  - cmd: show coredump summary
  - cmd: show msglog
    timeout: 120s
