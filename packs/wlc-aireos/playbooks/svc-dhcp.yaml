# Propósito: Proxy DHCP, interfaces y clientes.
# Cuándo usarlo: Clientes sin IP por DHCP.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: svc-dhcp
platform: wlc-aireos
name: AireOS · Servicios · DHCP
name_en: AireOS · Services · DHCP
commands:
  - cmd: show time
  - cmd: show sysinfo
  - cmd: show dhcp proxy
  - cmd: show interface summary
  - cmd: show wlan summary
  - cmd: show client summary
    timeout: 120s
