# Propósito: Arranque, volcados, traps, mensajes y APs tras un reinicio.
# Cuándo usarlo: El controlador se reinició sin explicación.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: tac-reinicio-controlador
platform: wlc-aireos
name: AireOS · TAC · Reinicio del controlador
name_en: AireOS · TAC · Controller reboot
commands:
  - cmd: show time
  - cmd: show sysinfo
  - cmd: show boot
  - cmd: show coredump summary
  - cmd: show traplog
    timeout: 120s
  - cmd: show msglog
    timeout: 120s
  - cmd: show redundancy summary
  - cmd: show ap uptime
    timeout: 120s
