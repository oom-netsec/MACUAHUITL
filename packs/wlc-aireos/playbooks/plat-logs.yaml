# Propósito: Registro de mensajes, traps, banderas de traps y volcados.
# Cuándo usarlo: Buscar eventos recientes del controlador.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: plat-logs
platform: wlc-aireos
name: AireOS · Plataforma · Logs y traps
name_en: AireOS · Platform · Logs and traps
commands:
  - cmd: show time
  - cmd: show sysinfo
  - cmd: show logging
    timeout: 120s
  - cmd: show msglog
    timeout: 120s
  - cmd: show traplog
    timeout: 120s
  - cmd: show trapflags
  - cmd: show coredump summary
