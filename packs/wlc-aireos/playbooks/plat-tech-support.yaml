# Propósito: Recolección completa para un caso de TAC con show tech-support.
# Cuándo usarlo: TAC pide el show tech-support (salida muy grande; puede traer claves).
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: plat-tech-support
platform: wlc-aireos
name: AireOS · Plataforma · Tech-support
name_en: AireOS · Platform · Tech-support
commands:
  - cmd: show time
  - cmd: show sysinfo
  - cmd: show inventory
  - cmd: show msglog
    timeout: 120s
  - cmd: show traplog
    timeout: 120s
  - cmd: show tech-support
    timeout: 300s
    may_contain_secrets: true
