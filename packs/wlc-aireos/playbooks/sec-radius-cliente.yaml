# Propósito: Cliente, estadísticas RADIUS y PMK de un cliente por MAC.
# Cuándo usarlo: Un cliente 802.1X no autentica.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: sec-radius-cliente
platform: wlc-aireos
name: AireOS · Seguridad · RADIUS de un cliente
name_en: AireOS · Security · RADIUS of a client
params:
  - name: mac
    kind: mac
commands:
  - cmd: show time
  - cmd: show client detail {mac}
  - cmd: show radius auth statistics
  - cmd: show radius summary
    may_contain_secrets: true
  - cmd: show exclusionlist
  - cmd: show pmk-cache all
    timeout: 120s
