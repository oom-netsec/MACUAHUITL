# Propósito: Configuración completa de una WLAN por número y sus clientes.
# Cuándo usarlo: Revisar la configuración de una WLAN.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: wlan-detalle
platform: wlc-aireos
name: AireOS · WLAN · Detalle de una WLAN
name_en: AireOS · WLAN · One WLAN in detail
params:
  - name: wlan
    kind: ap
commands:
  - cmd: show time
  - cmd: show wlan {wlan}
    may_contain_secrets: true
  - cmd: show client wlan {wlan}
  - cmd: show wlan summary
  - cmd: show wlan apgroups
  - cmd: show acl summary
