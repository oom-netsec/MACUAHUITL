# Propósito: Clientes de una WLAN y su configuración.
# Cuándo usarlo: Una WLAN concreta da problemas a sus usuarios.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: cli-por-wlan
platform: wlc-aireos
name: AireOS · Clientes · Clientes de una WLAN
name_en: AireOS · Clients · Clients of a WLAN
params:
  - name: wlan
    kind: ap
commands:
  - cmd: show time
  - cmd: show client wlan {wlan}
  - cmd: show wlan {wlan}
    may_contain_secrets: true
  - cmd: show wlan summary
  - cmd: show client summary
    timeout: 120s
  - cmd: show exclusionlist
