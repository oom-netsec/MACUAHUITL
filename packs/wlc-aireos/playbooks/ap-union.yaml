# Propósito: Estadísticas de unión CAPWAP, máximo de APs y certificados.
# Cuándo usarlo: Hay APs que no se unen o se unen y se caen.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: ap-union
platform: wlc-aireos
name: AireOS · AP · Unión de APs (join)
name_en: AireOS · AP · AP join
commands:
  - cmd: show time
  - cmd: show ap summary
    timeout: 120s
  - cmd: show ap join stats summary all
    timeout: 120s
  - cmd: show ap config global
  - cmd: show ap max-count summary
  - cmd: show certificate summary
  - cmd: show msglog
    timeout: 120s
