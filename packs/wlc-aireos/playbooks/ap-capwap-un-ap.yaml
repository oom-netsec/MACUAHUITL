# Propósito: Unión, tiempo activo y eventos de un AP en el controlador.
# Cuándo usarlo: Un AP se une y se cae, o tarda en unirse.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: ap-capwap-un-ap
platform: wlc-aireos
name: AireOS · AP · CAPWAP de un AP
name_en: AireOS · AP · CAPWAP of an AP
params:
  - name: ap
    kind: ap
commands:
  - cmd: show time
  - cmd: show ap config general {ap}
  - cmd: show ap eventlog {ap}
    timeout: 120s
  - cmd: grep include "{ap}" "show ap join stats summary all"
    timeout: 120s
  - cmd: grep include "{ap}" "show ap uptime"
    timeout: 120s
  - cmd: grep include "{ap}" "show ap summary"
    timeout: 120s
