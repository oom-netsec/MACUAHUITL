# Propósito: APs y clientes rogue, reglas y lista de ignorados.
# Cuándo usarlo: Hay APs ajenos o rogue detectados.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: sec-rogues
platform: wlc-aireos
name: AireOS · Seguridad · Rogues
name_en: AireOS · Security · Rogues
commands:
  - cmd: show time
  - cmd: show rogue ap summary
    timeout: 120s
  - cmd: show rogue ap friendly summary
    timeout: 120s
  - cmd: show rogue ap malicious summary
    timeout: 120s
  - cmd: show rogue ap unclassified summary
    timeout: 120s
  - cmd: show rogue client summary
    timeout: 120s
  - cmd: show rogue rule summary
  - cmd: show rogue ignore-list
