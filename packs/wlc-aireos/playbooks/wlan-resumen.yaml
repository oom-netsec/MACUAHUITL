# Propósito: WLANs, grupos de AP, clientes y perfiles RF.
# Cuándo usarlo: Panorama de las WLANs configuradas.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: wlan-resumen
platform: wlc-aireos
name: AireOS · WLAN · Resumen de WLANs
name_en: AireOS · WLAN · WLAN summary
commands:
  - cmd: show time
  - cmd: show sysinfo
  - cmd: show wlan summary
  - cmd: show wlan apgroups
  - cmd: show client summary
    timeout: 120s
  - cmd: show rf-profile summary
