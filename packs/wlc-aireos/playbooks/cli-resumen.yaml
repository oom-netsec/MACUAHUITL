# Propósito: Clientes asociados, WLANs, APs y lista de exclusión.
# Cuándo usarlo: Panorama de clientes del controlador.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: cli-resumen
platform: wlc-aireos
name: AireOS · Clientes · Resumen de clientes
name_en: AireOS · Clients · Client summary
commands:
  - cmd: show time
  - cmd: show sysinfo
  - cmd: show client summary
    timeout: 120s
  - cmd: show wlan summary
  - cmd: show ap summary
    timeout: 120s
  - cmd: show exclusionlist
