# Propósito: WLANs, RF, exclusión y APs para clientes que no asocian.
# Cuándo usarlo: Los clientes no logran asociarse.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: tac-asociacion-general
platform: wlc-aireos
name: AireOS · TAC · Clientes no asocian
name_en: AireOS · TAC · Clients do not associate
commands:
  - cmd: show time
  - cmd: show client summary
    timeout: 120s
  - cmd: show wlan summary
  - cmd: show exclusionlist
  - cmd: show advanced eap
  - cmd: show ap summary
    timeout: 120s
  - cmd: show 802.11a
  - cmd: show 802.11b
