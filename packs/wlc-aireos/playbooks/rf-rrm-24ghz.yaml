# Propósito: Canal, potencia, cobertura, monitoreo, logs y grupo RRM en 2,4 GHz.
# Cuándo usarlo: Canales o potencias cambian o no son los esperados en 2,4 GHz.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: rf-rrm-24ghz
platform: wlc-aireos
name: AireOS · RF · RRM en 2,4 GHz
name_en: AireOS · RF · RRM on 2.4 GHz
commands:
  - cmd: show time
  - cmd: show advanced 802.11b summary
  - cmd: show advanced 802.11b channel
  - cmd: show advanced 802.11b txpower
  - cmd: show advanced 802.11b coverage
  - cmd: show advanced 802.11b monitor
  - cmd: show advanced 802.11b logging
  - cmd: show advanced 802.11b group
