# Propósito: Estado, autenticación y movilidad de un cliente por MAC.
# Cuándo usarlo: Un cliente concreto tiene problemas.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: cli-detalle
platform: wlc-aireos
name: AireOS · Clientes · Detalle de un cliente
name_en: AireOS · Clients · One client in detail
params:
  - name: mac
    kind: mac
commands:
  - cmd: show time
  - cmd: show client detail {mac}
  - cmd: grep include "{mac}" "show client summary"
    timeout: 120s
  - cmd: show exclusionlist
  - cmd: show pmk-cache all
    timeout: 120s
  - cmd: show wlan summary
