# Propósito: Movilidad, handoff y clientes del controlador.
# Cuándo usarlo: Varios clientes tienen roaming lento.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: tac-roaming-general
platform: wlc-aireos
name: AireOS · TAC · Roaming general
name_en: AireOS · TAC · General roaming
commands:
