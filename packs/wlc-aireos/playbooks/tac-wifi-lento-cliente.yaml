# Propósito: Cliente, RF, CPU y WLANs ante lentitud de un cliente.
# Cuándo usarlo: Un cliente reporta WiFi lento.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: tac-wifi-lento-cliente
platform: wlc-aireos
name: AireOS · TAC · WiFi lento de un cliente
name_en: AireOS · TAC · Slow WiFi for a client
params:
  - name: mac
    kind: mac
commands:
  - cmd: show time
  - cmd: show client detail {mac}
  - cmd: show wlan summary
  - cmd: show 802.11a
  - cmd: show 802.11b
  - cmd: show advanced 802.11a txpower
  - cmd: show cpu
