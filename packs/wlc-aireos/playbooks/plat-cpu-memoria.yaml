# Propósito: Uso de CPU y memoria global y por proceso.
# Cuándo usarlo: El controlador va lento o la CPU o memoria están altas.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: plat-cpu-memoria
platform: wlc-aireos
name: AireOS · Plataforma · CPU y memoria
name_en: AireOS · Platform · CPU and memory
commands:
  - cmd: show time
  - cmd: show sysinfo
  - cmd: show cpu
  - cmd: show memory statistics
  - cmd: show process cpu
  - cmd: show process memory
  - cmd: grep include "System Up Time" "show sysinfo"
