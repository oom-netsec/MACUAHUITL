# Propósito: Configuración, calidad de aire y dispositivos de interferencia por banda.
# Cuándo usarlo: Se sospecha interferencia no WiFi.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: rf-cleanair
platform: wlc-aireos
name: AireOS · RF · CleanAir
name_en: AireOS · RF · CleanAir
commands:
  - cmd: show time
  - cmd: show 802.11a cleanair config
  - cmd: show 802.11b cleanair config
  - cmd: show 802.11a cleanair air-quality summary
  - cmd: show 802.11b cleanair air-quality summary
  - cmd: show 802.11a cleanair device type all
  - cmd: show 802.11b cleanair device type all
