# Propósito: Anchors configurados por WLAN y estado de los túneles.
# Cuándo usarlo: Una WLAN de invitados con anchor no funciona.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/command-reference/b_cr810.html
# Sin validar en laboratorio (no hay AireOS en el laboratorio; comandos de la documentación de Cisco).
id: mob-anchor
platform: wlc-aireos
name: AireOS · Movilidad · Anchors
name_en: AireOS · Mobility · Anchors
commands:
  - cmd: show time
  - cmd: show mobility anchor
  - cmd: show mobility summary
  - cmd: show wlan summary
  - cmd: show mobility statistics
  - cmd: show interface summary
  - cmd: show msglog
    timeout: 120s
