# Propósito: Cruza carga del controlador, utilización de canal, interferencia y causas de desconexión.
# Cuándo usarlo: Quejas generalizadas de lentitud o intermitencia en el WiFi.
# Fuente: https://www.cisco.com/c/en/us/support/docs/wireless/catalyst-9800-series-wireless-controllers/218395-troubleshoot-catalyst-9800-client-connec.html
# Sin validar en laboratorio.
id: tac-wifi-lento
platform: wlc-9800
name: TAC · WiFi lento (general)
name_en: TAC · Slow WiFi (general)
commands:
  - cmd: show clock
  - cmd: show ap summary
  - cmd: show wireless client summary
  - cmd: show ap dot11 24ghz summary
  - cmd: show ap dot11 5ghz summary
  - cmd: show ap dot11 24ghz cleanair air-quality worst
  - cmd: show ap dot11 5ghz cleanair air-quality worst
  - cmd: show wireless stats client delete reasons
  - cmd: show wireless stats client detail
  - cmd: show platform resources
  - cmd: show processes cpu platform sorted
  - cmd: show logging | include DOT11|CAPWAP|CPUHOG|RADIUS
  - cmd: show wireless load-balancing
  - cmd: show ap dot11 5ghz receiver
