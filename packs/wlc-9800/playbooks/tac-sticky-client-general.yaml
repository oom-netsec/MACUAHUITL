# Propósito: Revisa en general steering, band select, tasas y perfiles RF que influyen en el roaming.
# Cuándo usarlo: Varios clientes se quedan pegados a APs lejanos.
# Fuente: https://www.cisco.com/c/en/us/support/docs/wireless/catalyst-9800-series-wireless-controllers/218395-troubleshoot-catalyst-9800-client-connec.html
# Sin validar en laboratorio.
id: tac-sticky-client-general
platform: wlc-9800
name: TAC · Sticky client (general)
name_en: TAC · Sticky client (general)
commands:
  - cmd: show clock
  - cmd: show wireless client summary
    timeout: 180s
  - cmd: show wireless band-select
  - cmd: show wlan all
  - cmd: show ap rf-profile summary
  - cmd: show ap dot11 5ghz network
  - cmd: show ap dot11 24ghz network
  - cmd: show ap dot11 5ghz coverage
  - cmd: show ap dot11 24ghz coverage
  - cmd: show wireless stats client detail
