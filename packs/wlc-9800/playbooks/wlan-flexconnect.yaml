# Propósito: Perfiles flex, tags de sitio y APs en modo local o FlexConnect.
# Cuándo usarlo: Los APs de sucursal pierden servicio al caer el WAN o se comportan distinto en modo flex.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/9800/command-reference/b_wireless_cr/show-commands.html
# Sin validar en laboratorio.
id: wlan-flexconnect
platform: wlc-9800
name: WLAN · FlexConnect y sitios
name_en: WLAN · FlexConnect and sites
commands:
  - cmd: show clock
  - cmd: show wireless profile flex summary
  - cmd: show wireless tag site summary
  - cmd: show ap tag summary
  - cmd: show ap summary
    timeout: 180s
  - cmd: show wlan summary
  - cmd: show wireless profile policy summary
  - cmd: show running-config | section wireless profile flex
    may_contain_secrets: true
