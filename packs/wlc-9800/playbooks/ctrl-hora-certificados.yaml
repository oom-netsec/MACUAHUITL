# Propósito: Verifica hora, NTP y certificados/trustpoints que usa el controlador para unir APs.
# Cuándo usarlo: AP no se une con error de certificado o DTLS, o el reloj del controlador está desfasado.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/9800/command-reference/b_wireless_cr/show-commands.html
# Validado en laboratorio: C9120AXI-A (EWC) con IOS-XE 17.12.6a (2026-11-13).
id: ctrl-hora-certificados
platform: wlc-9800
name: Controlador · Hora y certificados
name_en: Controller · Clock and certificates
commands:
  - cmd: show clock
  - cmd: show ntp status
  - cmd: show ntp associations
  - cmd: show crypto pki trustpoints
  - cmd: show crypto pki certificates
  - cmd: show ap summary
    timeout: 180s
  - cmd: show logging | include PKI|CERT|DTLS|NTP
