# Propósito: Estado de la redundancia SSO, el enlace RMI y los switchovers del par de 9800.
# Cuándo usarlo: Un failover no esperado, el par standby no sincroniza o los APs se reinician tras un switchover.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/9800/command-reference/b_wireless_cr/show-commands.html
# Validado en laboratorio: C9120AXI-A (EWC) con IOS-XE 17.12.6a (2026-11-13), salvo los marcados «no existe en EWC».
id: ctrl-ha-sso
platform: wlc-9800
name: Controlador · Alta disponibilidad (SSO)
name_en: Controller · High availability (SSO)
commands:
  - cmd: show clock
  - cmd: show redundancy
  - cmd: show redundancy states
  - cmd: show redundancy switchover history
  - cmd: show chassis
  - cmd: show chassis rmi  # no existe en EWC
  - cmd: show ap summary
    timeout: 180s
  - cmd: show wireless client summary
    timeout: 180s
  - cmd: show logging | include REDUNDANCY|RMI|HA_|SSO|SWITCHOVER|STANDBY
