# Propósito: Estado RF, canal, potencia y WLANs de las radios de un AP.
# Cuándo usarlo: Un AP concreto tiene cobertura o interferencia distintas al resto.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/9800/command-reference/b_wireless_cr/show-commands.html
# Sin validar en laboratorio.
id: rf-un-ap
platform: wlc-9800
name: RF · Radios de un AP
name_en: RF · Radios of an AP
params:
  - name: ap
    kind: ap
commands:
  - cmd: show clock
  - cmd: show ap name {ap} config general
  - cmd: show ap name {ap} auto-rf dot11 24ghz
  - cmd: show ap name {ap} auto-rf dot11 5ghz
  - cmd: show ap name {ap} wlan dot11 24ghz
  - cmd: show ap name {ap} wlan dot11 5ghz
  - cmd: show ap name {ap} config ethernet
  - cmd: show ap name {ap} neighbor summary
