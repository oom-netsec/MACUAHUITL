# Propósito: Como el caso general más lo que el controlador sabe de ese AP por nombre.
# Cuándo usarlo: Se conoce el nombre del AP que falla o que se desune.
# Fuente: https://www.cisco.com/c/en/us/support/docs/wireless/catalyst-9800-series-wireless-controllers/218396-troubleshoot-catalyst-9800-ap-join-or-di.html
# Validado en laboratorio: C9120AXI-A (EWC) con IOS-XE 17.12.6a (2026-11-13).
id: tac-ap-no-se-une-ap
platform: wlc-9800
name: TAC · AP no se une (un AP)
name_en: TAC · AP does not join (one AP)
params:
  - name: ap
    kind: ap
commands:
  - cmd: show clock
  - cmd: show ap summary
    timeout: 180s
  - cmd: show ap name {ap} config general
  - cmd: show wireless stats ap join summary
  - cmd: show wireless stats ap discovery
  - cmd: show ntp status
  - cmd: show wireless country configured
  - cmd: show logging | include CAPWAP|DTLS|AP_JOIN|APMGR|PKI|DISJOIN|AP_DISCONNECT
  - cmd: show wireless stats ap history
  - cmd: show wireless dtls connections
