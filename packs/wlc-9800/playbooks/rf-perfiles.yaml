# Propósito: Perfiles RF, tags RF, parámetros de red por banda y dominio regulatorio.
# Cuándo usarlo: Tasas, RSSI mínimo o potencias distintas a las esperadas; dudas de dominio regulatorio.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/9800/command-reference/b_wireless_cr/show-commands.html
# Validado en laboratorio: C9120AXI-A (EWC) con IOS-XE 17.12.6a (2026-11-13).
id: rf-perfiles
platform: wlc-9800
name: RF · Perfiles RF y país
name_en: RF · RF profiles and country
commands:
  - cmd: show clock
  - cmd: show ap rf-profile summary
  - cmd: show wireless tag rf summary
  - cmd: show ap tag summary
  - cmd: show ap dot11 24ghz network
  - cmd: show ap dot11 5ghz network
  - cmd: show wireless country configured
  - cmd: show ap summary
    timeout: 180s
  - cmd: show ap dot11 dual-band summary
