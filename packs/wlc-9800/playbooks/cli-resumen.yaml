# Propósito: Cuenta clientes por AP/WLAN/estado y las causas de desconexión acumuladas.
# Cuándo usarlo: Visión general de los clientes; primer paso ante quejas generalizadas.
# Fuente: https://www.cisco.com/c/en/us/support/docs/wireless/catalyst-9800-series-wireless-controllers/218395-troubleshoot-catalyst-9800-client-connec.html
# Sin validar en laboratorio.
id: cli-resumen
platform: wlc-9800
name: Clientes · Resumen y estadísticas
name_en: Clients · Summary and statistics
commands:
  - cmd: show clock
  - cmd: show wireless summary
  - cmd: show wireless client summary
    timeout: 180s
  - cmd: show wireless stats client delete reasons
  - cmd: show wireless stats client detail
  - cmd: show wireless exclusionlist
  - cmd: show wireless client timers
  - cmd: show wlan summary
  - cmd: show ap summary
    timeout: 180s
  - cmd: show wireless client device summary
  - cmd: show wireless vlan details
