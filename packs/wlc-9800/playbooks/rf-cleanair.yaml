# Propósito: Calidad de aire e interferentes detectados en 2.4 y 5 GHz.
# Cuándo usarlo: Interferencia no WiFi (microondas, Bluetooth), mala calidad de aire o reintentos altos.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/9800/command-reference/b_wireless_cr/show-commands.html
# Validado en laboratorio: C9120AXI-A (EWC) con IOS-XE 17.12.6a (2026-11-13).
id: rf-cleanair
platform: wlc-9800
name: RF · CleanAir e interferencia
name_en: RF · CleanAir and interference
commands:
  - cmd: show clock
  - cmd: show ap summary
    timeout: 180s
  - cmd: show ap dot11 24ghz cleanair config
  - cmd: show ap dot11 5ghz cleanair config
  - cmd: show ap dot11 24ghz cleanair air-quality summary
  - cmd: show ap dot11 5ghz cleanair air-quality summary
  - cmd: show ap dot11 24ghz cleanair air-quality worst
  - cmd: show ap dot11 5ghz cleanair air-quality worst
