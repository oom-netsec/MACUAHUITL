# Propósito: Estado del grupo de movilidad, pares y APs conocidos.
# Cuándo usarlo: Los clientes no hacen roaming entre controladores o un par aparece caído.
# Fuente: https://www.cisco.com/c/en/us/td/docs/wireless/controller/9800/command-reference/b_wireless_cr/show-commands.html
# Validado en laboratorio: C9120AXI-A (EWC) con IOS-XE 17.12.6a (2026-11-13), salvo los marcados «no existe en EWC».
id: mob-resumen
platform: wlc-9800
name: Movilidad · Grupo y estado
name_en: Mobility · Group and status
commands:
  - cmd: show clock
  - cmd: show wireless mobility summary  # no existe en EWC
  - cmd: show wireless stats mobility  # no existe en EWC
  - cmd: show wireless client summary
    timeout: 180s
  - cmd: show ip interface brief
  - cmd: show running-config | section wireless mobility
    may_contain_secrets: true
