# Propósito: Mapeo VLAN a VNI, VNIs por modo de replicación y estado.
# Cuándo usarlo: Un VNI está abajo o la VLAN no está asociada al VNI esperado.
# Fuente: https://www.cisco.com/c/en/us/td/docs/dcn/nx-os/nexus9000/103x/configuration/vxlan/cisco-nexus-9000-series-nx-os-vxlan-configuration-guide-103x.html
# Validado en laboratorio: no (pendiente Nexus 9000v DevNet)
id: vxlan-vni
platform: nx-os
name: NX-OS · VXLAN · VNIs y VLANs
name_en: NX-OS · VXLAN · VNIs and VLANs
commands:
  - cmd: show nve vni
  - cmd: show nve vni summary
  - cmd: show nve vni ingress-replication
  - cmd: show vxlan interface
  - cmd: show vlan brief
    timeout: 120s
  - cmd: show vlan all-ports
    timeout: 120s
