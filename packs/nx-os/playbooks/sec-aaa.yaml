# Propósito: Métodos AAA, servidores TACACS+ y RADIUS, usuarios y estado de SSH.
# Cuándo usarlo: No se puede iniciar sesión con credenciales remotas o hay dudas del acceso al equipo.
# Fuente: https://www.cisco.com/c/en/us/support/switches/nexus-9000-series-switches/products-command-reference-list.html
# Validado en laboratorio: no (pendiente Nexus 9000v DevNet)
id: sec-aaa
platform: nx-os
name: NX-OS · Seguridad · AAA, usuarios y SSH
name_en: NX-OS · Security · AAA, users and SSH
commands:
  - cmd: show aaa authentication
  - cmd: show aaa authorization
  - cmd: show aaa accounting
  - cmd: show aaa groups
  - cmd: show tacacs-server
    timeout: 60s
    may_contain_secrets: true
  - cmd: show tacacs-server groups
    may_contain_secrets: true
  - cmd: show radius-server
    timeout: 60s
    may_contain_secrets: true
  - cmd: show radius-server groups
    may_contain_secrets: true
  - cmd: show users
  - cmd: show ssh server
