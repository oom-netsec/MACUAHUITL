# Propósito: Política de protección del plano de control y descartes por clase.
# Cuándo usarlo: El plano de control pierde paquetes de protocolos o la CPU está alta por tráfico al CPU.
# Fuente: https://www.cisco.com/c/en/us/support/switches/nexus-9000-series-switches/products-command-reference-list.html
# Validado en laboratorio: no (pendiente Nexus 9000v DevNet)
id: sec-copp
platform: nx-os
name: Seguridad · CoPP y rate-limiters
name_en: Security · CoPP and rate-limiters
commands:
  - cmd: show copp status
  - cmd: show policy-map interface control-plane
    timeout: 180s
  - cmd: show policy-map interface control-plane | include violate|drop
    timeout: 180s
  - cmd: show hardware rate-limiter
  - cmd: show processes cpu sort | head lines 15
  - cmd: show system resources
