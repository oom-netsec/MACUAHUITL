# Propósito: Estado y estadísticas de HSRP y VRRP por interfaz.
# Cuándo usarlo: Ambos pares creen ser activos, o hay cambios de estado del gateway.
# Fuente: https://www.cisco.com/c/en/us/support/switches/nexus-9000-series-switches/products-command-reference-list.html
# Validado en laboratorio: no (pendiente Nexus 9000v DevNet)
id: l3-hsrp-vrrp
platform: nx-os
name: L3 · HSRP y VRRP
name_en: L3 · HSRP and VRRP
commands:
  - cmd: show hsrp brief
  - cmd: show hsrp
  - cmd: show hsrp detail
    timeout: 120s
  - cmd: show hsrp statistics
  - cmd: show vrrp
  - cmd: show ip interface brief
  - cmd: show logging last 200 | include HSRP|VRRP
    timeout: 180s
