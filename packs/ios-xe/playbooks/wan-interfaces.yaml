# Propósito: Revisa el estado, errores, descartes y carga de las interfaces WAN y del plano de reenvío (QFP) del router.
# Cuándo usarlo: Un enlace WAN reporta errores, caídas o descartes, o el router parece saturado en el reenvío.
# Fuente: https://www.cisco.com/c/en/us/support/docs/routers/asr-1000-series-ios-xe-sd-wan/224129-troubleshoot-interface-packet-drops-in.html
# Sin validar en laboratorio.
id: wan-interfaces
platform: ios-xe
name: WAN · Interfaces y salud
name_en: WAN · Interfaces and health
commands:
  - cmd: show clock
  - cmd: show interfaces summary
  - cmd: show ip interface brief
  - cmd: show interfaces description
  - cmd: show logging | include UPDOWN|LINK|LINEPROTO
  - cmd: show ip traffic
  - cmd: show platform hardware qfp active statistics drop
  - cmd: show platform hardware qfp active datapath utilization summary
  - cmd: show platform hardware throughput level # no existe en ASR 1000 ni C8500
  - cmd: show platform hardware qfp active feature lic-bw oversubscription # no existe en ASR 1000 ni C8500
  - cmd: show interfaces | include line protocol|input errors|CRC|output drops|Total output drops|rate
    timeout: 120s
  - cmd: show platform hardware qfp active infrastructure bqs queue output default all
    timeout: 120s
