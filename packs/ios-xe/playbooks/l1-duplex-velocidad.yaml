# Propósito: Detecta desajustes de duplex o velocidad y los errores que dejan en los contadores.
# Cuándo usarlo: Lentitud en un puerto de acceso, colisiones o CRC; tras conectar equipos antiguos o sin autonegociación.
# Fuente: https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/interface/command/ir-cr-book.html
# Sin validar en laboratorio.
id: l1-duplex-velocidad
platform: ios-xe
name: L1 · Duplex y velocidad
name_en: L1 · Duplex and speed
commands:
  - cmd: show clock
  - cmd: show interfaces status
  - cmd: show interfaces description
  - cmd: show interfaces counters errors
  - cmd: show interfaces counters
  - cmd: show cdp neighbors
  - cmd: show logging | include DUPLEX|MISMATCH|SPEED
  - cmd: show interfaces | include line protocol|duplex|input errors|CRC|collisions
    timeout: 120s
