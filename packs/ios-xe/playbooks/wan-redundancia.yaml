# Propósito: Revisa la redundancia de salida: vecinos de ruteo, BFD, track, HSRP y las rutas activas por cada enlace.
# Cuándo usarlo: Hay dos o más enlaces WAN y no está claro cuál está activo o por qué el tráfico no cambia.
# Fuente: https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/iproute_pi/command/iri-cr-book/iri-cr-s1.html
# Sin validar en laboratorio.
id: wan-redundancia
platform: ios-xe
name: WAN · Redundancia WAN
name_en: WAN · WAN redundancy
commands:
  - cmd: show clock
  - cmd: show interfaces summary
  - cmd: show ip route summary
  - cmd: show ip route static
  - cmd: show ip protocols
  - cmd: show ip ospf neighbor
  - cmd: show ip eigrp neighbors
  - cmd: show ip bgp summary
  - cmd: show bgp all summary
  - cmd: show bfd neighbors
  - cmd: show track brief
  - cmd: show ip route track-table
  - cmd: show ip sla summary
  - cmd: show standby brief
  - cmd: show vrrp brief
  - cmd: show logging | include TRACK|SLA|STANDBY|BFD|BGP|OSPF|EIGRP|LINEPROTO
