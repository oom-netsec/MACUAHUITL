# Propósito: Revisa los miembros del stack, sus puertos y roles, y los eventos del administrador de stack.
# Cuándo usarlo: Un miembro del stack no se une o cambia de rol, puertos de stack caídos o sospecha de doble activo.
# Fuente: https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/software/release/17-9/command_reference/b_179_9300_cr.html
# Sin validar en laboratorio.
id: plat-stack
platform: ios-xe
name: Plataforma · Stack
name_en: Platform · Stack
commands:
  - cmd: show clock
  - cmd: show switch  # no existe en routers IOS-XE (solo switches)
  - cmd: show switch detail  # falla en Cat9000v virtual (sin stack, SVL ni PoE)
  - cmd: show switch stack-ports  # falla en Cat9000v virtual (sin stack, SVL ni PoE)
  - cmd: show switch stack-ports summary  # falla en Cat9000v virtual (sin stack, SVL ni PoE)
  - cmd: show switch neighbors  # falla en Cat9000v virtual (sin stack, SVL ni PoE)
  - cmd: show inventory
  - cmd: show module  # falla en Cat8000v virtual
  - cmd: show redundancy
  - cmd: show logging | include STACKMGR|STACK|SWITCH|RPS|DUAL
