# Propósito: Recorre un sitio remoto aislado: interfaces, vecinos de ruteo, BFD, túneles, tracking y descartes.
# Cuándo usarlo: Un sitio remoto reporta que no tiene servicio; primera recolección desde el router del sitio o del hub.
# Fuente: https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/iproute_pi/command/iri-cr-book/iri-cr-s1.html
# Sin validar en laboratorio.
id: tac-sitio-remoto-sin-servicio
platform: ios-xe
name: TAC · Sitio remoto sin servicio
name_en: TAC · Remote site with no service
commands:
  - cmd: show clock
  - cmd: show ip interface brief
  - cmd: show interfaces summary
  - cmd: show ip route summary
  - cmd: show ip protocols
  - cmd: show ip ospf neighbor
  - cmd: show ip eigrp neighbors
  - cmd: show ip bgp summary
  - cmd: show bfd neighbors
  - cmd: show crypto session
  - cmd: show dmvpn
  - cmd: show track brief
  - cmd: show ip sla summary
  - cmd: show platform hardware qfp active statistics drop
  - cmd: show logging | include UPDOWN|ADJCHG|BFD|TRACK|BGP|OSPF|EIGRP|CRYPTO
