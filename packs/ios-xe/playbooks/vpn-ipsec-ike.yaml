# Propósito: Revisa las asociaciones de seguridad IKEv1/IKEv2 e IPsec, sus contadores y la configuración criptográfica.
# Cuándo usarlo: Un túnel no levanta o no pasa tráfico, rekeys fallidos o diferencias de propuesta entre ambos extremos.
# Fuente: https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/security/s1/sec-s1-cr-book.html
# Sin validar en laboratorio.
id: vpn-ipsec-ike
platform: ios-xe
name: VPN · IPsec/IKE
name_en: VPN · IPsec/IKE
commands:
  - cmd: show clock
  - cmd: show crypto session  # requiere nivel de licencia (en Cat8000v sin licencia no existe)
  - cmd: show crypto isakmp sa  # requiere nivel de licencia (en Cat8000v sin licencia no existe)
  - cmd: show crypto ikev2 sa  # requiere nivel de licencia (en Cat8000v sin licencia no existe)
  - cmd: show crypto ikev2 sa detail  # requiere nivel de licencia (en Cat8000v sin licencia no existe)
  - cmd: show crypto session detail  # requiere nivel de licencia (en Cat8000v sin licencia no existe)
  - cmd: show crypto ipsec sa  # requiere nivel de licencia (en Cat8000v sin licencia no existe)
  - cmd: show crypto isakmp policy  # requiere nivel de licencia (en Cat8000v sin licencia no existe)
  - cmd: show crypto ikev2 proposal  # requiere nivel de licencia (en Cat8000v sin licencia no existe)
  - cmd: show crypto ikev2 policy  # requiere nivel de licencia (en Cat8000v sin licencia no existe)
  - cmd: show crypto ikev2 profile  # requiere nivel de licencia (en Cat8000v sin licencia no existe)
  - cmd: show crypto ikev2 stats  # requiere nivel de licencia (en Cat8000v sin licencia no existe)
  - cmd: show crypto ipsec transform-set  # requiere nivel de licencia (en Cat8000v sin licencia no existe)
  - cmd: show crypto map  # requiere nivel de licencia (en Cat8000v sin licencia no existe)
  - cmd: show ip interface brief | include Tunnel
  - cmd: show logging | include CRYPTO|IKE|IPSEC|ISAKMP
  - cmd: show crypto engine connections active  # no existe en Cat9k (solo routers)
  - cmd: show running-config | section crypto|tunnel
    may_contain_secrets: true
