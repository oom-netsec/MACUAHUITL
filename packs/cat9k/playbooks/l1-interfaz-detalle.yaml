# Propósito: Detalla estado, contadores, controlador y transceptor de una interfaz.
# Cuándo usarlo: Un puerto con errores, velocidad o dúplex raros.
# Fuente: https://www.cisco.com/c/en/us/support/switches/catalyst-9300-series-switches/products-command-reference-list.html
# Validado en laboratorio: no (sin equipo; pendiente sandbox SD-Access de DevNet)
id: l1-interfaz-detalle
platform: cat9k
name: Catalyst 9K · L1 · Detalle de una interfaz
name_en: Catalyst 9K · L1 · Single interface detail
params:
  - name: interface
    kind: interface
commands:
  - cmd: show clock
  - cmd: show interfaces {interface}
  - cmd: show interfaces {interface} status
  - cmd: show interfaces {interface} counters errors
  - cmd: show interfaces {interface} transceiver detail
  - cmd: show controllers ethernet-controller {interface}
  - cmd: show running-config interface {interface}
    may_contain_secrets: true
