# Propósito: Lista los puertos err-disabled con su causa y recuperación.
# Cuándo usarlo: Un puerto se apaga por BPDU guard, port-security, UDLD o flap.
# Fuente: https://www.cisco.com/c/en/us/support/switches/catalyst-9300-series-switches/products-command-reference-list.html
# Validado en laboratorio: no (sin equipo)
id: l1-err-disabled
platform: cat9k
name: Catalyst 9K · L1 · Puertos err-disabled
name_en: Catalyst 9K · L1 · Err-disabled ports
commands:
  - cmd: show clock
  - cmd: show interfaces status err-disabled
  - cmd: show errdisable detect
  - cmd: show errdisable recovery
  - cmd: show spanning-tree summary
  - cmd: show etherchannel summary
  - cmd: show logging | include ERR_DISABLE|BPDU|PSECURE|UDLD
    timeout: 180s
