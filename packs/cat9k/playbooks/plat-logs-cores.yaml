# Propósito: Reúne el motivo del último reinicio, el log y los archivos de falla.
# Cuándo usarlo: Reinicio inesperado, tracebacks o mensajes de plataforma en el log.
# Fuente: https://www.cisco.com/c/en/us/support/switches/catalyst-9300-series-switches/products-command-reference-list.html
# Validado en laboratorio: no (sin equipo; pendiente sandbox SD-Access de DevNet)
id: plat-logs-cores
platform: cat9k
name: Catalyst 9K · Plataforma · Logs, reinicios y crashinfo
name_en: Catalyst 9K · Platform · Logs, reloads and crashinfo
commands:
  - cmd: show clock
  - cmd: show version | include restarted|reason|uptime
  - cmd: show logging onboard switch active uptime
  - cmd: "dir crashinfo:"
  - cmd: "dir flash:"
  - cmd: show platform software status control-processor brief
  - cmd: show logging
    timeout: 300s
