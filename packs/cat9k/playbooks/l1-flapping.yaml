# Propósito: Busca puertos que suben y bajan y sus causas.
# Cuándo usarlo: Enlaces intermitentes o reconvergencia frecuente.
# Fuente: https://www.cisco.com/c/en/us/support/switches/catalyst-9300-series-switches/products-command-reference-list.html
# Validado en laboratorio: no (sin equipo)
id: l1-flapping
platform: cat9k
name: Catalyst 9K · L1 · Interfaces con flapping
name_en: Catalyst 9K · L1 · Flapping interfaces
commands:
  - cmd: show clock
  - cmd: show interfaces status
  - cmd: show interfaces counters errors
  - cmd: show udld neighbors
  - cmd: show errdisable detect
  - cmd: show spanning-tree detail | include executing|Number of topology|from
    timeout: 120s
  - cmd: show logging | include UPDOWN|LINK|FLAP
    timeout: 180s
