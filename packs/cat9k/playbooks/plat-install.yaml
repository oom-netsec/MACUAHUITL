# Propósito: Muestra los paquetes activos, inactivos y confirmados del modo install y el arranque.
# Cuándo usarlo: Antes y después de actualizar, o si un miembro arranca con otra versión.
# Fuente: https://www.cisco.com/c/en/us/support/switches/catalyst-9300-series-switches/products-command-reference-list.html
# Validado en laboratorio: no (sin equipo; pendiente sandbox SD-Access de DevNet)
id: plat-install
platform: cat9k
name: Catalyst 9K · Plataforma · Modo install y versiones
name_en: Catalyst 9K · Platform · Install mode and images
commands:
  - cmd: show clock
  - cmd: show install summary
  - cmd: show install active
  - cmd: show install inactive
  - cmd: show install committed
  - cmd: show boot
  - cmd: show version | include image|Installation mode
  - cmd: "dir flash:"
    timeout: 120s
