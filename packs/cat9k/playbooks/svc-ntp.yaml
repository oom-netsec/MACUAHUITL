# Propósito: Compara el reloj con las asociaciones NTP.
# Cuándo usarlo: Hora desfasada, certificados que fallan o logs sin orden.
# Fuente: https://www.cisco.com/c/en/us/support/switches/catalyst-9300-series-switches/products-command-reference-list.html
# Validado en laboratorio: no (sin equipo)
id: svc-ntp
platform: cat9k
name: Catalyst 9K · Servicios · NTP y reloj
name_en: Catalyst 9K · Services · NTP and clock
commands:
  - cmd: show clock
  - cmd: show clock detail
  - cmd: show ntp status
  - cmd: show ntp associations
  - cmd: show ntp associations detail
  - cmd: show logging | include NTP
    timeout: 180s
