# Propósito: Lee potencia, temperatura y datos de los transceptores.
# Cuándo usarlo: Pérdida de señal, fibra sucia o un módulo no soportado.
# Fuente: https://www.cisco.com/c/en/us/support/switches/catalyst-9300-series-switches/products-command-reference-list.html
# Validado en laboratorio: no (sin equipo; pendiente sandbox SD-Access de DevNet)
id: l1-transceptores
platform: cat9k
name: Catalyst 9K · L1 · Transceptores DOM
name_en: Catalyst 9K · L1 · DOM transceivers
commands:
  - cmd: show clock
  - cmd: show interfaces transceiver
  - cmd: show interfaces transceiver detail
    timeout: 180s
  - cmd: show interfaces transceiver properties
  - cmd: show inventory
  - cmd: show interfaces status
  - cmd: show logging | include XCVR|TRANSCEIVER|SFP
    timeout: 180s
