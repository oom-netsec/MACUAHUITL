# Propósito: Compara la plantilla SDM con la ocupación del TCAM y las tablas.
# Cuándo usarlo: Tablas llenas, ACL que no se aplican o rutas que no se programan.
# Fuente: https://www.cisco.com/c/en/us/support/switches/catalyst-9300-series-switches/products-command-reference-list.html
# Validado en laboratorio: no (sin equipo; pendiente sandbox SD-Access de DevNet)
id: plat-tcam-sdm
platform: cat9k
name: Catalyst 9K · Plataforma · TCAM y plantilla SDM
name_en: Catalyst 9K · Platform · TCAM and SDM template
commands:
  - cmd: show clock
  - cmd: show sdm prefer
  - cmd: show platform hardware fed switch active fwd-asic resource tcam utilization
  - cmd: show platform resources
  - cmd: show ip route summary
  - cmd: show mac address-table count
  - cmd: show logging | include TCAM|SDM|FED|ACL
    timeout: 180s
