# Propósito: Revisa la detección dual-active por PAgP, el canal y el log.
# Cuándo usarlo: Sospecha de dual-active tras perder los enlaces SVL.
# Fuente: https://www.cisco.com/c/en/us/support/switches/catalyst-9300-series-switches/products-command-reference-list.html
# Validado en laboratorio: no (sin equipo; pendiente sandbox SD-Access de DevNet)
id: svl-dual-active
platform: cat9k
name: Catalyst 9K · SVL · Detección dual-active
name_en: Catalyst 9K · SVL · Dual-active detection
commands:
  - cmd: show clock
  - cmd: show stackwise-virtual dual-active-detection
  - cmd: show stackwise-virtual dual-active-detection pagp
  - cmd: show stackwise-virtual link
  - cmd: show etherchannel summary
  - cmd: show pagp neighbor
  - cmd: show redundancy
  - cmd: show logging | include SVL|STACKWISE|DAD
    timeout: 180s
