# Propósito: Revisa VLAN, troncales, raíz de STP y puertos bloqueados.
# Cuándo usarlo: Una VLAN no pasa, el árbol cambia o hay puertos inconsistentes.
# Fuente: https://www.cisco.com/c/en/us/support/switches/catalyst-9300-series-switches/products-command-reference-list.html
# Validado en laboratorio: no (sin equipo; pendiente sandbox SD-Access de DevNet)
id: l2-vlans-stp
platform: cat9k
name: Catalyst 9K · L2 · VLAN, troncales y STP
name_en: Catalyst 9K · L2 · VLANs, trunks and STP
commands:
  - cmd: show clock
  - cmd: show vlan brief
  - cmd: show interfaces trunk
  - cmd: show spanning-tree summary
  - cmd: show spanning-tree root
  - cmd: show spanning-tree blockedports
  - cmd: show spanning-tree inconsistentports
  - cmd: show vtp status
  - cmd: show logging | include SPANTREE
    timeout: 180s
