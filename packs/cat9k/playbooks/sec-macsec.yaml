# Propósito: Muestra las sesiones MKA, las políticas y los contadores de MACsec.
# Cuándo usarlo: El enlace cifrado no sube o descarta tramas.
# Fuente: https://www.cisco.com/c/en/us/support/switches/catalyst-9300-series-switches/products-command-reference-list.html
# Validado en laboratorio: no (sin equipo; pendiente sandbox SD-Access de DevNet)
id: sec-macsec
platform: cat9k
name: Catalyst 9K · Seguridad · MACsec y MKA
name_en: Catalyst 9K · Security · MACsec and MKA
commands:
  - cmd: show clock
  - cmd: show macsec summary
  - cmd: show mka summary
  - cmd: show mka sessions
  - cmd: show mka sessions detail
  - cmd: show mka policy
  - cmd: show logging | include MACSEC|MKA
    timeout: 180s
