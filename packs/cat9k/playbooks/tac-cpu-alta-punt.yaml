# Propósito: Identifica el proceso y el tráfico punteado que consumen CPU.
# Cuándo usarlo: La CPU sube y los protocolos pierden vecinos.
# Fuente: https://www.cisco.com/c/en/us/support/switches/catalyst-9300-series-switches/products-command-reference-list.html
# Validado en laboratorio: no (sin equipo; pendiente sandbox SD-Access de DevNet)
id: tac-cpu-alta-punt
platform: cat9k
name: Catalyst 9K · TAC · CPU alta por punt
name_en: Catalyst 9K · TAC · High CPU from punted traffic
commands:
  - cmd: show clock
  - cmd: show processes cpu sorted 5sec | exclude 0.00% 0.00% 0.00%
  - cmd: show processes cpu platform sorted
  - cmd: show platform software status control-processor brief
  - cmd: show platform software fed switch active punt cause summary
  - cmd: show platform software fed switch active inject cause summary
  - cmd: show platform hardware fed switch active qos queue stats internal cpu policer
  - cmd: show policy-map control-plane
  - cmd: show ip traffic
  - cmd: show processes cpu history
  - cmd: show logging
    timeout: 180s
