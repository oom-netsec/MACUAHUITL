# Propósito: Revisa los puertos de stack, los vecinos y el anillo.
# Cuándo usarlo: Un cable o puerto de stack falla o la pila trabaja como anillo abierto.
# Fuente: https://www.cisco.com/c/en/us/support/switches/catalyst-9300-series-switches/products-command-reference-list.html
# Validado en laboratorio: no (sin equipo; pendiente sandbox SD-Access de DevNet)
id: stack-anillo
platform: cat9k
name: Catalyst 9K · Stack · Puertos y anillo de stack
name_en: Catalyst 9K · Stack · Stack ports and ring
commands:
  - cmd: show clock
  - cmd: show switch stack-ports
  - cmd: show switch stack-ports summary
  - cmd: show switch neighbors
  - cmd: show switch detail
  - cmd: show environment all
  - cmd: show logging | include STACKMGR|STACK|SWITCH
    timeout: 180s
