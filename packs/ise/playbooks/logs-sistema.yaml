# Propósito: Últimas líneas del log del sistema y sus errores.
# Cuándo usarlo: Buscar la causa de un reinicio o de un fallo del nodo.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: logs-sistema
platform: ise
name: ISE · Logs · Log del sistema
name_en: ISE · Logs · System log
commands:
  - cmd: show clock
  - cmd: show logging system | last 100
    timeout: 120s
  - cmd: show logging system | include error
    timeout: 120s
  - cmd: show logging system | include fail
    timeout: 120s
  - cmd: show logging system | include warn
    timeout: 120s
  - cmd: show uptime
  - cmd: show application status ise
