# Propósito: Lista de logs de la aplicación y las últimas líneas de los principales.
# Cuándo usarlo: Ver qué logs tiene el nodo y sus últimas líneas.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: logs-aplicacion
platform: ise
name: ISE · Logs · Logs de la aplicación
name_en: ISE · Logs · Application logs
commands:
  - cmd: show clock
  - cmd: show logging application
    timeout: 120s
  - cmd: show logging application ise-psc.log | last 200
    timeout: 120s
  - cmd: show logging application catalina.out | last 100
    timeout: 120s
  - cmd: show logging application replication.log | last 100
    timeout: 120s
  - cmd: show application status ise
