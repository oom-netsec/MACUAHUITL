# Propósito: Uso de disco y último respaldo.
# Cuándo usarlo: El disco se llena y hay que ver respaldos y logs recientes.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: plat-discos
platform: ise
name: ISE · Plataforma · Discos y respaldos
name_en: ISE · Platform · Disks and backups
commands:
  - cmd: show clock
  - cmd: show disks
  - cmd: show backup history
  - cmd: show backup status
  - cmd: show application status ise
  - cmd: show logging system | last 50
    timeout: 120s
  - cmd: show uptime
