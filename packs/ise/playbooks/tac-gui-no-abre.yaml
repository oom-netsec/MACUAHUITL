# Propósito: Proceso, puerto 443, recursos y log de la interfaz web.
# Cuándo usarlo: La interfaz web del nodo no abre.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: tac-gui-no-abre
platform: ise
name: ISE · TAC · Interfaz web no abre
name_en: ISE · TAC · Web interface not opening
commands:
  - cmd: show clock
  - cmd: show application status ise
  - cmd: show ports | include 443
    timeout: 120s
  - cmd: show disks
  - cmd: show memory
  - cmd: show ntp
  - cmd: show logging application catalina.out | last 100
    timeout: 120s
