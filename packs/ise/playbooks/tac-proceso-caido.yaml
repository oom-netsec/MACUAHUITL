# Propósito: Estado de procesos con sus recursos y logs recientes.
# Cuándo usarlo: Un proceso de ISE aparece detenido o en inicialización.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: tac-proceso-caido
platform: ise
name: ISE · TAC · Proceso de ISE caído
name_en: ISE · TAC · ISE process down
commands:
  - cmd: show clock
  - cmd: show uptime
  - cmd: show application status ise
  - cmd: show version
  - cmd: show cpu
  - cmd: show memory
  - cmd: show disks
  - cmd: show logging system | last 100
    timeout: 120s
  - cmd: show logging application ise-psc.log | include ERROR
    timeout: 120s
