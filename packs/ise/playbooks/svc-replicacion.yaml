# Propósito: Estado de procesos y log de replicación.
# Cuándo usarlo: Un nodo no replica con el PAN.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: svc-replicacion
platform: ise
name: ISE · Servicios · Replicación entre nodos
name_en: ISE · Services · Node replication
commands:
  - cmd: show clock
  - cmd: show application status ise
  - cmd: show logging application replication.log | last 100
    timeout: 120s
  - cmd: show ntp
  - cmd: show interface | include inet
  - cmd: show disks
  - cmd: show uptime
