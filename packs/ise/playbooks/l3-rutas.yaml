# Propósito: Tabla de rutas y gateway configurado.
# Cuándo usarlo: El nodo no llega a una red o a su gateway.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: l3-rutas
platform: ise
name: ISE · L3 · Rutas y gateway
name_en: ISE · L3 · Routes and gateway
commands:
  - cmd: show clock
  - cmd: show ip route
    timeout: 120s
  - cmd: show interface
  - cmd: show running-config | include ip route
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config | include ip default-gateway
    timeout: 120s
    may_contain_secrets: true
  - cmd: show ports
    timeout: 120s
  - cmd: show application status ise
