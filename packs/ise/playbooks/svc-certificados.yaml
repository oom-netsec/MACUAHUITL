# Propósito: Menciones de certificados vencidos o inválidos en el log de la aplicación.
# Cuándo usarlo: Un certificado venció o un servicio rechaza el certificado de ISE.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: svc-certificados
platform: ise
name: ISE · Servicios · Certificados en el log
name_en: ISE · Services · Certificates in the log
commands:
  - cmd: show clock
  - cmd: show ntp
  - cmd: show application status ise
  - cmd: show version
  - cmd: show logging application ise-psc.log | include certificate
    timeout: 120s
  - cmd: show logging application ise-psc.log | include expired
    timeout: 120s
