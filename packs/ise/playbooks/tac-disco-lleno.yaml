# Propósito: Uso de disco, respaldos y logs recientes.
# Cuándo usarlo: El disco del nodo está lleno o casi.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: tac-disco-lleno
platform: ise
name: ISE · TAC · Disco lleno
name_en: ISE · TAC · Full disk
commands:
  - cmd: show clock
  - cmd: show disks
  - cmd: show application status ise
  - cmd: show backup history
  - cmd: show uptime
  - cmd: show memory
  - cmd: show version
  - cmd: show logging system | include disk
    timeout: 120s
