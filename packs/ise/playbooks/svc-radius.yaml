# Propósito: Servicio RADIUS: proceso, puertos y log.
# Cuándo usarlo: Los NAD no obtienen respuesta RADIUS del nodo.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: svc-radius
platform: ise
name: ISE · Servicios · RADIUS
name_en: ISE · Services · RADIUS
commands:
  - cmd: show clock
  - cmd: show application status ise
  - cmd: show ports | include 1812
    timeout: 120s
  - cmd: show ports | include 1813
    timeout: 120s
  - cmd: show ports | include 1700
    timeout: 120s
  - cmd: show ntp
  - cmd: show logging application ise-psc.log | include ERROR
    timeout: 120s
