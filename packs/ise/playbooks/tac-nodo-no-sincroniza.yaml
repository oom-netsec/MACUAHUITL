# Propósito: Estado, red, hora y log de replicación del nodo.
# Cuándo usarlo: Un nodo secundario no sincroniza con el PAN.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: tac-nodo-no-sincroniza
platform: ise
name: ISE · TAC · Nodo que no sincroniza
name_en: ISE · TAC · Node not synchronizing
commands:
  - cmd: show clock
  - cmd: show application status ise
  - cmd: show ntp
  - cmd: show interface
  - cmd: show ip route
    timeout: 120s
  - cmd: show running-config | include name-server
    timeout: 120s
    may_contain_secrets: true
  - cmd: show logging application replication.log | last 100
    timeout: 120s
  - cmd: show logging application ise-psc.log | include ERROR
    timeout: 120s
  - cmd: show ports
    timeout: 120s
