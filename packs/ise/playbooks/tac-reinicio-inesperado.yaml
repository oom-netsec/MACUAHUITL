# Propósito: Tiempo activo, log del sistema y recursos.
# Cuándo usarlo: El nodo se reinició sin explicación.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: tac-reinicio-inesperado
platform: ise
name: ISE · TAC · Reinicio inesperado
name_en: ISE · TAC · Unexpected restart
commands:
  - cmd: show clock
  - cmd: show uptime
  - cmd: show logging system | last 100
    timeout: 120s
  - cmd: show logging system | include restart
    timeout: 120s
  - cmd: show application status ise
  - cmd: show version
  - cmd: show disks
  - cmd: show memory
  - cmd: show cpu
