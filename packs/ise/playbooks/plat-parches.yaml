# Propósito: Parches instalados y mensajes de instalación en el log.
# Cuándo usarlo: Un parche o actualización no quedó bien aplicado.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: plat-parches
platform: ise
name: ISE · Plataforma · Parches e instalaciones
name_en: ISE · Platform · Patches and installs
commands:
  - cmd: show clock
  - cmd: show version
  - cmd: show application
  - cmd: show application version ise
  - cmd: show uptime
  - cmd: show logging system | include patch
    timeout: 120s
