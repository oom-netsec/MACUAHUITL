# Propósito: Puertos de ISE escuchando (HTTPS, RADIUS, ERS, pxGrid).
# Cuándo usarlo: Un servicio no atiende en su puerto.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: l3-puertos
platform: ise
name: ISE · L3 · Puertos en escucha
name_en: ISE · L3 · Listening ports
commands:
  - cmd: show clock
  - cmd: show ports
    timeout: 120s
  - cmd: show ports | include 443
    timeout: 120s
  - cmd: show ports | include 1812
    timeout: 120s
  - cmd: show ports | include 1813
    timeout: 120s
  - cmd: show ports | include 8905
    timeout: 120s
  - cmd: show ports | include 9060
    timeout: 120s
  - cmd: show application status ise
