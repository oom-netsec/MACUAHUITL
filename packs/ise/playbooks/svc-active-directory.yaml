# Propósito: Hora, DNS y log del agente de AD.
# Cuándo usarlo: La unión o la autenticación con Active Directory falla.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: svc-active-directory
platform: ise
name: ISE · Servicios · Active Directory
name_en: ISE · Services · Active Directory
commands:
  - cmd: show clock
  - cmd: show application status ise
  - cmd: show ntp
  - cmd: show running-config | include name-server
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config | include domain
    timeout: 120s
    may_contain_secrets: true
  - cmd: show logging application ad_agent.log | last 100
    timeout: 120s
  - cmd: show logging application ise-psc.log | last 100
    timeout: 120s
