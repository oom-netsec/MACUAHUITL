# Propósito: Servidores DNS, dominio y nombre del nodo en la configuración.
# Cuándo usarlo: Fallan resoluciones de nombre, la unión a AD o el registro de nodos.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: l3-dns
platform: ise
name: ISE · L3 · DNS y dominio
name_en: ISE · L3 · DNS and domain
commands:
  - cmd: show clock
  - cmd: show running-config | include name-server
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config | include domain
    timeout: 120s
    may_contain_secrets: true
  - cmd: show running-config | include hostname
    timeout: 120s
    may_contain_secrets: true
  - cmd: show interface
  - cmd: show ip route
    timeout: 120s
  - cmd: show application status ise
