# Propósito: Últimas líneas y errores del log de la interfaz web.
# Cuándo usarlo: La interfaz web no abre o responde lento.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: logs-catalina
platform: ise
name: ISE · Logs · Catalina (interfaz web)
name_en: ISE · Logs · Catalina (web interface)
commands:
  - cmd: show clock
  - cmd: show logging application catalina.out | last 200
    timeout: 120s
  - cmd: show logging application catalina.out | include ERROR
    timeout: 120s
  - cmd: show logging application catalina.out | include SEVERE
    timeout: 120s
  - cmd: show application status ise
  - cmd: show ports | include 443
    timeout: 120s
