# Propósito: Interfaces del nodo, direcciones y ruta.
# Cuándo usarlo: El nodo no llega a la red o a otros nodos.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: l1-interfaces
platform: ise
name: ISE · Interfaces · Interfaces y red
name_en: ISE · Interfaces · Interfaces and network
commands:
  - cmd: show clock
  - cmd: show interface
  - cmd: show interface GigabitEthernet 0
  - cmd: show interface GigabitEthernet 1
  - cmd: show ip route
    timeout: 120s
  - cmd: show ports
    timeout: 120s
  - cmd: show application status ise
