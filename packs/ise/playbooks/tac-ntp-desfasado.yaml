# Propósito: Hora, NTP, zona horaria y menciones en el log.
# Cuándo usarlo: La hora del nodo está desfasada o no sincroniza.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: tac-ntp-desfasado
platform: ise
name: ISE · TAC · NTP desfasado
name_en: ISE · TAC · NTP out of sync
commands:
  - cmd: show clock
  - cmd: show ntp
  - cmd: show timezone
  - cmd: show running-config | include ntp
    timeout: 120s
    may_contain_secrets: true
  - cmd: show logging system | include ntp
    timeout: 120s
  - cmd: show uptime
  - cmd: show application status ise
  - cmd: show version
