# Propósito: Servicio pxGrid: proceso, puerto y log.
# Cuándo usarlo: Un cliente pxGrid no se conecta o no recibe sesiones.
# Fuente: https://www.cisco.com/c/en/us/td/docs/security/ise/3-1/cli_ref_guide/b_ise_CLI_Reference_Guide_31.html
# Sin validar en laboratorio (no hay ISE en el laboratorio; comandos de la documentación de Cisco).
id: svc-pxgrid
platform: ise
name: ISE · Servicios · pxGrid
name_en: ISE · Services · pxGrid
commands:
  - cmd: show clock
  - cmd: show application status ise
  - cmd: show ports | include 8910
    timeout: 120s
  - cmd: show ntp
  - cmd: show running-config | include name-server
    timeout: 120s
    may_contain_secrets: true
  - cmd: show logging application ise-psc.log | include pxgrid
    timeout: 120s
  - cmd: show logging application ise-psc.log | last 100
    timeout: 120s
