version: "3"

tasks:
  build:
    cmds:
      - CGO_ENABLED=0 go build -trimpath -o bin/ ./cmd/...
  test:
    cmds:
      - go test -race ./...
  lint:
    cmds:
      - go vet ./...
      - go run ./tools/noegress/cmd/noegress ./...
      - go run ./tools/archcheck/cmd/archcheck ./...
      - go run honnef.co/go/tools/cmd/staticcheck@{{.STATICCHECK_VERSION}} ./...
  proto-lint:
    cmds:
      - go run github.com/bufbuild/buf/cmd/buf@{{.BUF_VERSION}} lint
  ui-test:
    dir: ui/frontend
    cmds:
      - npm ci
      - npm test
      - npm run typecheck
  ui-build:
    # Requiere WebKitGTK y GTK de desarrollo (ver deploy/packaging/README.md).
    cmds:
      - cd ui/frontend && npm ci && npm run build
      # gtk3: Wails 3.1 usa GTK4/WebKitGTK 6.0 por defecto; Ubuntu/Debian traen webkit2gtk-4.1.
      - CGO_ENABLED=1 go build -tags 'wails gtk3' -trimpath -o bin/macuahuitl ./ui
  release-build:
    # Núcleo y CLI reproducibles (dos compilaciones dan la misma suma). VERSION=vX.Y.Z
    cmds:
      - CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "-s -w -buildid= -X github.com/oom-netsec/MACUAHUITL/internal/version.Version={{.VERSION}}" -o bin/ ./cmd/macuahuitld ./cmd/mctl
      - cd bin && sha256sum macuahuitld mctl > SHA256SUMS
  package:
    # Requiere nfpm (go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0), bin/ completo (release-build + ui-build) y VERSION
    cmds:
      - mkdir -p dist
      - VERSION={{trimPrefix "v" .VERSION}} nfpm package -p deb -f deploy/packaging/nfpm.yaml -t dist/
      - VERSION={{trimPrefix "v" .VERSION}} nfpm package -p rpm -f deploy/packaging/nfpm.yaml -t dist/
  proto-tools:
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@{{.PROTOC_GEN_GO_GRPC_VERSION}}
  proto-gen:
    cmds:
      - go run github.com/bufbuild/buf/cmd/buf@{{.BUF_VERSION}} generate

vars:
  VERSION: '{{default "dev" .VERSION}}'
  STATICCHECK_VERSION: v0.8.2
  BUF_VERSION: v1.75.0
  PROTOC_GEN_GO_VERSION: v1.36.12
  PROTOC_GEN_GO_GRPC_VERSION: v1.6.2
