syntax = "proto3";

package macuahuitl.v1;

option go_package = "github.com/oom-netsec/MACUAHUITL/gen/macuahuitl/v1;macuahuitlv1";

// Bóveda local (spec §10). Los secretos solo viajan del cliente al núcleo, nunca de vuelta.
service VaultService {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc Unlock(UnlockRequest) returns (UnlockResponse);
  rpc Lock(LockRequest) returns (LockResponse);
  rpc ChangeMasterPassword(ChangeMasterPasswordRequest) returns (ChangeMasterPasswordResponse);
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  rpc PutCredential(PutCredentialRequest) returns (PutCredentialResponse);
  rpc DeleteCredential(DeleteCredentialRequest) returns (DeleteCredentialResponse);
  // Respaldo cifrado (fase 29d): un archivo de bóveda nuevo con su propia frase; se importa en dos pasos.
  rpc ExportBackup(ExportBackupRequest) returns (ExportBackupResponse);
  rpc PreviewBackupImport(PreviewBackupImportRequest) returns (PreviewBackupImportResponse);
  rpc ApplyBackupImport(ApplyBackupImportRequest) returns (ApplyBackupImportResponse);
  // Fase 44 (ADR 0013): llave SSH ed25519 generada en el núcleo con crypto/rand. La privada vive en la bóveda y solo
  // viaja dentro del respaldo cifrado (.mcvault); ninguna RPC la devuelve y no se importa una de fuera. Solo sale la
  // pública. Una credencial "key" vale solo para el terminal de hosts linux y windows.
  rpc GenerateKeyCredential(GenerateKeyCredentialRequest) returns (GenerateKeyCredentialResponse);
  rpc GetCredentialPublicKey(GetCredentialPublicKeyRequest) returns (GetCredentialPublicKeyResponse);
  // Fase 47: importa una llave SSH privada existente (ADR 0013 §1b).
  rpc ImportKeyCredential(ImportKeyCredentialRequest) returns (ImportKeyCredentialResponse);
  // Genera una llave nueva para una credencial "key" conservando su id; la vieja se destruye.
  rpc RegenerateKeyCredential(RegenerateKeyCredentialRequest) returns (RegenerateKeyCredentialResponse);
}

enum VaultState {
  VAULT_STATE_UNSPECIFIED = 0;
  VAULT_STATE_ABSENT = 1;
  VAULT_STATE_LOCKED = 2;
  VAULT_STATE_UNLOCKED = 3;
}

message StatusRequest {}
message StatusResponse {
  VaultState state = 1;
  // IDs de trabajos con ventana armada que mantienen la DEK en memoria (spec §10.4).
  repeated string armed_job_ids = 2;
}

message CreateRequest {
  bytes master_password = 1;
}
message CreateResponse {}

message UnlockRequest {
  bytes master_password = 1;
}
message UnlockResponse {}

message LockRequest {}
message LockResponse {}

message ChangeMasterPasswordRequest {
  bytes current_master_password = 1;
  bytes new_master_password = 2;
}
message ChangeMasterPasswordResponse {}

// Vista pública de una credencial: nunca incluye el secreto.
message CredentialInfo {
  string id = 1;
  string label = 2;
  string username = 3;
  bool has_enable_secret = 4;
  bool has_ssh_key = 5;
  // Fase 44: "key" = solo llave SSH (sin contraseña ni enable; autentica solo por publickey y solo sirve para el terminal
  // de hosts linux y windows: Patrol, el cambio asistido y las demás herramientas la rechazan); "password" = el resto.
  string kind = 6;
  // Fase 47: origen de una credencial "key": "generated" (ed25519 nacida en el núcleo) o "imported" (cualquier otra: las de
  // ImportKeyCredential y las de solo llave anteriores a la fase 44). Vacío en las de contraseña. Se deriva de la llave
  // guardada. Es informativo, no un control de seguridad: un .mcvault armado a mano puede decir cualquiera de los dos.
  string origin = 7;
}

message ListCredentialsRequest {}
message ListCredentialsResponse {
  repeated CredentialInfo credentials = 1;
}

message PutCredentialRequest {
  // Vacío crea una nueva; con valor la reemplaza.
  string id = 1;
  string label = 2;
  string username = 3;
  bytes password = 4;
  bytes enable_secret = 5;
  // Obsoleto desde la fase 44 (ADR 0013): el núcleo rechaza una llave privada con InvalidArgument. Una llave se genera
  // con GenerateKeyCredential. Tampoco se puede reemplazar por aquí una credencial de tipo "key" (FailedPrecondition).
  bytes ssh_private_key = 6;
}
message PutCredentialResponse {
  string id = 1;
}

message GenerateKeyCredentialRequest {
  string label = 1;                    // mismas reglas que PutCredential; no puede ser reservada
  string username = 2;
}
message GenerateKeyCredentialResponse {
  string id = 1;
  string public_key = 2;               // una línea authorized_keys: "ssh-ed25519 AAAA… macuahuitl@<hostname local>"
}

message GetCredentialPublicKeyRequest {
  string id = 1;                       // credencial con llave SSH (has_ssh_key); si no tiene, FailedPrecondition
}
message GetCredentialPublicKeyResponse {
  string public_key = 1;               // igual que en GenerateKeyCredentialResponse; el comentario lleva el hostname de hoy
  string fingerprint = 2;              // fase 47: "SHA256:…" de la pública
}

// Fase 47 (ADR 0013 §1b). Errores (ErrorInfo.reason = código i18n): vault.err.key_passphrase_required (FailedPrecondition:
// la llave está cifrada y falta la frase); InvalidArgument: vault.err.key_passphrase_wrong, vault.err.key_import_invalid
// (metadata format), vault.err.key_import_unsupported (DSA, sk-*, P-224, RSA fuera de 1024..16384, PKCS#8 cifrada;
// metadata type o format) y vault.err.field_too_long (más de 64 KiB; metadata max).
message ImportKeyCredentialRequest {
  string label = 1;                    // mismas reglas que GenerateKeyCredential; no puede ser reservada
  string username = 2;
  bytes private_key = 3;               // el CONTENIDO (OpenSSH, PKCS#1, PKCS#8 sin cifrar, SEC1, PEM legado), nunca una ruta; tope 64 KiB
  bytes passphrase = 4;                // vacía si la llave no está cifrada; se usa una vez y no se guarda
}
message ImportKeyCredentialResponse {
  string id = 1;
  string public_key = 2;               // línea authorized_keys, igual que GetCredentialPublicKey (comentario macuahuitl@<hostname>)
  string fingerprint = 3;              // "SHA256:…"
  string algorithm = 4;                // ssh-ed25519, ecdsa-sha2-nistp256|384|521, ssh-rsa
  uint32 bits = 5;                     // ed25519 = 256, ECDSA = tamaño de la curva, RSA = largo del módulo
  bool weak = 6;                       // RSA de menos de 3072 bits: aviso, no error (algunos servidores exigen 2048)
}

message RegenerateKeyCredentialRequest {
  string id = 1;                       // credencial de tipo "key"; de otro tipo, FailedPrecondition
  bool confirm = 2;                    // obligatoria: la pública vieja deja de servir en cada authorized_keys donde esté
}
message RegenerateKeyCredentialResponse {
  string public_key = 1;               // la nueva, en el mismo formato que GenerateKeyCredentialResponse
  string previous_origin = 2;          // fase 47: origen de la llave reemplazada ("imported" → la UI y mctl avisan)
}

message DeleteCredentialRequest {
  string id = 1;
}
message DeleteCredentialResponse {}

// ---- Respaldo cifrado ----

message ExportBackupRequest {
  string path = 1;                     // absoluta; extensión sugerida .mcvault
  bytes passphrase = 2;                // frase del respaldo: al menos 12 caracteres y distinta de la maestra; se borra al terminar
  bool overwrite = 3;                  // sin ella no pisa un archivo existente
  bool confirm = 4;                    // obligatoria: el respaldo contiene todas las credenciales
}
message ExportBackupResponse {
  int32 count = 1;                     // credenciales guardadas (las reservadas del sistema no viajan)
  bool no_permissions = 2;             // el sistema de archivos (p. ej. vfat) no admitió los permisos 0600: el archivo va cifrado igual
  // Fase 44: de count, cuántas llevan llave privada SSH (viajan cifradas en el respaldo, ADR 0013). La UI lo avisa antes
  // (con has_ssh_key de ListCredentials) y después de exportar.
  int32 ssh_keys_included = 3;
}

message PreviewBackupImportRequest {
  string path = 1;                     // absoluta; respaldo .mcvault
  bytes passphrase = 2;                // frase del respaldo; se borra al terminar
}
message VaultBackupItem {
  string id = 1;                       // ID de la credencial dentro del respaldo (las decisiones van por él)
  string label = 2;
  string username = 3;
  string state = 4;                    // nueva | igual | conflicto_etiqueta | reservada (se omite)
}
message PreviewBackupImportResponse {
  string token = 1;                    // vale 10 minutos, se gasta al aplicar y se descarta si la bóveda se cierra
  int64 expires_ms = 2;
  repeated VaultBackupItem items = 3;  // sin secretos
}

message VaultBackupDecision {
  string id = 1;                       // ID del item en la vista previa
  string action = 2;                   // cable histórico: renombrar | reemplazar | omitir (obligatoria en conflicto_etiqueta); el núcleo acepta también rename | replace | skip
}
message ApplyBackupImportRequest {
  string token = 1;
  repeated VaultBackupDecision decisions = 2;
}
message ApplyBackupImportResponse {
  int32 created = 1;
  int32 replaced = 2;
  int32 renamed = 3;
  int32 skipped = 4;                   // omitidas por decisión o por reservadas
  int32 same = 5;                      // ya estaban idénticas
}
