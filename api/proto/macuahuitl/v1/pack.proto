syntax = "proto3";

package macuahuitl.v1;

option go_package = "github.com/oom-netsec/MACUAHUITL/gen/macuahuitl/v1;macuahuitlv1";

// Paquetes de contenido (.mpack, fase 32, ADR 0010). Se instalan a mano desde un archivo local; el núcleo nunca
// descarga nada. Un paquete solo trae contenido de lectura. Los errores llevan reason pack.err.* (ver
// docs/plans/contratos-front.md); texto, README y nombres son texto plano.
service PackService {
  // Valida e instala el .mpack de path (lectura única, tope de 20 MB). Un paquete sin firma oficial exige allow_unsigned.
  rpc Install(PackServiceInstallRequest) returns (PackServiceInstallResponse);
  // Paquetes instalados, ordenados por id.
  rpc List(PackServiceListRequest) returns (PackServiceListResponse);
  // Manifiesto, README y contenido de un paquete instalado.
  rpc Show(PackServiceShowRequest) returns (PackServiceShowResponse);
  // Quita el paquete id y los favoritos de sus scripts.
  rpc Remove(PackServiceRemoveRequest) returns (PackServiceRemoveResponse);
  // Oculta o muestra playbooks y scripts de un paquete instalado (fase 32b). Ocultar solo quita de las listas: el ID se sigue resolviendo.
  rpc SetItems(PackServiceSetItemsRequest) returns (PackServiceSetItemsResponse);
  // Vista previa de Install (fase 32b): valida el .mpack igual y con los mismos errores, pero no instala, no toca el almacén ni audita.
  rpc Inspect(PackServiceInspectRequest) returns (PackServiceInspectResponse);
  // Fase 32c. Arma un paquete personal sin firma con scripts del usuario y, si se pide, sus playbooks.
  rpc Export(PackServiceExportRequest) returns (PackServiceExportResponse);
  // Fase 32c. Importa un .mpack sin firma a «Mis scripts» y a <config>/playbooks. Sin confirm es solo la vista previa.
  rpc Import(PackServiceImportRequest) returns (PackServiceImportResponse);
}

message PackServiceInstallRequest {
  string path = 1;            // ruta absoluta del .mpack
  bool allow_unsigned = 2;    // confirmación explícita para un paquete de terceros
  repeated string hide = 3;   // IDs de playbook o script del paquete que quedan ocultos al instalar; los que no existan se ignoran (fase 32b)
  bool replace_hidden = 4;    // con true, hide es el conjunto exacto de ocultos tras instalar; sin él se conserva lo oculto y hide suma
}

message PackServiceInstallResponse {
  PackInfo pack = 1;
  string replaced_version = 2;   // versión anterior que reemplazó; vacío si era nuevo
}

message PackServiceListRequest {}

message PackServiceListResponse {
  repeated PackInfo packs = 1;
}

message PackInfo {
  string id = 1;                   // <editor>/<nombre>
  string version = 2;
  string min_core = 3;
  string name = 4;                 // texto plano
  string name_en = 5;
  string description = 6;          // texto plano
  string description_en = 7;
  repeated string platforms = 8;
  string author = 9;
  string license = 10;
  bool official = 11;              // firma oficial válida (derivada al arrancar, nunca guardada)
  int32 playbook_count = 12;
  int32 script_count = 13;         // los derivados de playbooks más los de scripts.json
  repeated string shadowed = 14;   // IDs de playbook que un playbook de <config>/playbooks tapa
  repeated string hidden = 15;     // IDs de playbook o de script que el usuario ocultó, ordenados (fase 32b)
}

message PackServiceShowRequest {
  string id = 1;
}

message PackServiceShowResponse {
  PackInfo pack = 1;
  string readme = 2;               // texto plano o Markdown sin HTML: el front no lo interpreta como HTML
  repeated string playbook_ids = 3;
  repeated string script_ids = 4;
}

message PackServiceRemoveRequest {
  string id = 1;
}

message PackServiceRemoveResponse {
  int32 favorites_removed = 1;     // scripts del paquete que estaban en colecciones o fijados
}

message PackServiceSetItemsRequest {
  string pack_id = 1;
  repeated string hide = 2;        // IDs de playbook o de script del paquete; un ID que no es suyo da pack.err.item
  repeated string show = 3;        // un ID en hide y show a la vez da pack.err.item
}

message PackServiceSetItemsResponse {
  PackInfo pack = 1;               // con hidden al día
}

message PackServiceInspectRequest {
  string path = 1;            // ruta absoluta del .mpack
  bool allow_unsigned = 2;    // igual que en Install: sin ella, un paquete de terceros da pack.err.unsigned
}

message PackServiceInspectResponse {
  PackInfo pack = 1;               // official indica si la firma oficial es válida; hidden trae lo ya oculto de una versión instalada
  repeated string playbook_ids = 2;
  repeated string script_ids = 3;  // los derivados de playbooks más los de scripts.json
  string replaced_version = 4;     // versión instalada que reemplazaría; vacío si es nuevo
}

message PackServiceExportRequest {
  string editor_name = 1;           // "<editor>/<nombre>"; editor [a-z0-9]{1,16}, sin los reservados
  repeated string script_ids = 2;   // scripts del usuario (0 a 1000; con include_playbooks pueden ser 0)
  bool include_playbooks = 3;       // todos los de <config>/playbooks exportables
  string license = 4;               // SPDX; vacío = NOASSERTION
  string path = 5;                  // absoluta; archivo nuevo 0600
  bool overwrite = 6;               // sin esto, una ruta que existe da AlreadyExists
  string name = 7;                  // opcional; vacío = la parte <nombre> del id
  string name_en = 8;               // opcional; vacío copia name
  string description = 9;           // opcional
  string description_en = 10;       // opcional; vacío copia description
  string author = 11;               // opcional; vacío = el editor
}

message PackServiceExportResponse {
  string id = 1;
  string version = 2;               // AAAA.MMDD.HHMMSS de la hora local
  string sha256 = 3;                // del archivo escrito
  int32 scripts = 4;
  int32 playbooks = 5;
  repeated string omitted_playbooks = 6;  // IDs de playbook que no se exportaron (plataforma no instalable o ID que no sirve)
}

message PackImportDecision {
  string item_id = 1;               // ID del script o del playbook tal como viene en el archivo
  string action = 2;                // renombrar | omitir (nunca reemplazar)
}

message PackServiceImportRequest {
  string path = 1;                  // absoluta; el .mpack no debe tener firma oficial
  bool confirm = 2;                 // false = vista previa (no escribe nada); true = aplica con decisions
  repeated PackImportDecision decisions = 3;
  string sha256 = 4;                // opcional: el de la vista previa; con confirm, si no coincide con el archivo, falla (pack.err.import.changed)
}

message PackImportItem {
  string kind = 1;                  // script | playbook
  string id = 2;                    // el del archivo
  string name = 3;
  string state = 4;                 // nuevo | igual | conflicto_id | conflicto_nombre
  string conflicts_with = 5;        // script: ID guardado; playbook: base, reserved, user, file o el id del paquete instalado
}

message PackServiceImportResponse {
  PackInfo pack = 1;
  repeated PackImportItem items = 2;
  reserved 3;                       // era warnings
  bool applied = 4;                 // false en la vista previa
  int32 scripts_created = 5;
  int32 scripts_renamed = 6;
  int32 scripts_skipped = 7;
  int32 playbooks_created = 8;
  int32 playbooks_renamed = 9;
  int32 playbooks_skipped = 10;
  repeated string playbook_ids = 11;  // IDs con los que quedaron escritos los playbooks
  string sha256 = 12;               // del archivo; pásalo en el Import con confirm para atar la vista previa a lo que se aplica
}
