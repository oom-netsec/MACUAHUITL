syntax = "proto3";

package macuahuitl.v1;

import "macuahuitl/v1/tools.proto";

option go_package = "github.com/oom-netsec/MACUAHUITL/gen/macuahuitl/v1;macuahuitlv1";

// Herramientas de seguridad y acceso (Fase 14): probadores RADIUS y TACACS+,
// PKI de laboratorio y decodificador de IKE/IPsec. Los secretos solo viajan del
// cliente al núcleo (o salen de la bóveda); nunca vuelven ni quedan en auditoría.
service SecurityService {
  rpc RadiusTest(RadiusTestRequest) returns (RadiusTestResponse);
  rpc TacacsTest(TacacsTestRequest) returns (TacacsTestResponse);
  rpc PkiKey(PkiKeyRequest) returns (PkiKeyResponse);
  rpc PkiCsr(PkiCsrRequest) returns (PkiCsrResponse);
  rpc PkiCaInit(PkiCaInitRequest) returns (PkiCaInitResponse);
  rpc PkiCaSign(PkiCaSignRequest) returns (PkiCaSignResponse);
  rpc PkiExport(PkiExportRequest) returns (PkiExportResponse);
  rpc PkiDecode(PkiDecodeRequest) returns (PkiDecodeResponse);
  rpc IkeDecode(IkeDecodeRequest) returns (IkeDecodeResponse);
}

// Origen de un secreto: una credencial de la bóveda (su contraseña) o el valor escrito.
message SecretSource {
  string credential_id = 1;
  bytes value = 2;
}

message RadiusTestRequest {
  string host = 1;
  uint32 auth_port = 2; // 1812 por defecto
  uint32 acct_port = 3; // 1813 por defecto
  SecretSource shared_secret = 4;
  // Usuario de prueba: con credential_id se toman usuario y contraseña de la bóveda.
  string username = 5;
  SecretSource password = 6;
  string method = 7; // pap (por defecto), chap, mschapv2
  string nas_ip = 8;
  string nas_identifier = 9;
  string nas_port_type = 10; // Ethernet, Wireless-802.11, Virtual… o número
  string service_type = 11;  // Framed, Login, Call-Check… o número
  string called_station_id = 12;
  string calling_station_id = 13;
  bool status_server = 14; // solo Status-Server (RFC 5997)
  bool accounting = 15;    // Start y Stop después del Access-Request
  int32 timeout_ms = 16;
  int32 retries = 17;
}

// Fase 30b: lo mismo que dice el texto del informe, con claves estables. Ningún campo trae el secreto
// compartido, la contraseña ni sus longitudes.

// Texto de catálogo ya armado: key y args, y el texto en el idioma pedido (accept-language).
message SecText {
  string key = 1;
  map<string, string> args = 2;
  string text = 3;
}

// Hallazgo: code estable (sin-respuesta, blast-radius, secreto, authen-fail…), severity cerrada
// (warning, error, info), args con los valores que cita y message con el detalle en el idioma pedido.
message SecFinding {
  string code = 1;
  string severity = 2;
  map<string, string> args = 3;
  string message = 4;
}

message RadiusAttribute {
  string name = 1;
  string value = 2;
}

message RadiusExchange {
  string kind = 1;              // access-request, status-server, accounting-start, accounting-stop
  string code = 2;              // Access-Accept…; vacío si no hubo respuesta
  double rtt_ms = 3;
  int32 attempts = 4;
  string message_authenticator = 5; // absent, valid, invalid; vacío si no hubo respuesta
  SecText error = 6;            // ausente si no hubo error
  repeated RadiusAttribute attrs = 7;
}

message RadiusTestResponse {
  ToolReport report = 1;
  string server = 2;
  string method = 3; // PAP, CHAP, MSCHAPV2 (como en el texto); vacío en Status-Server
  repeated RadiusExchange exchanges = 4;
  repeated SecFinding findings = 5;
}

message TacacsTestRequest {
  string host = 1;
  uint32 port = 2; // 49 por defecto
  SecretSource shared_secret = 3;
  string username = 4;
  SecretSource password = 5;
  string authen_type = 6; // ascii (por defecto) o pap
  string command = 7;     // p. ej. "show running-config"; vacío = sin autorización
  bool accounting = 8;
  int32 priv_lvl = 9;
  int32 timeout_ms = 10;
}

// AV pair de un paso: direction es sent (lo que mandó la prueba) o received (lo que devolvió el servidor).
message TacacsAvPair {
  string direction = 1;
  string value = 2;
}

message TacacsStep {
  string kind = 1;   // authentication, authorization, accounting-start, accounting-stop
  string status = 2; // PASS, FAIL, PASS_ADD…; vacío si no hubo respuesta
  double rtt_ms = 3;
  SecText error = 4; // ausente si no hubo error
  repeated string prompts = 5;
  string message = 6;
  string data = 7;
  repeated TacacsAvPair av_pairs = 8;
}

message TacacsTestResponse {
  ToolReport report = 1;
  string server = 2; // host:puerto
  repeated TacacsStep steps = 3;
  repeated SecFinding findings = 4;
}

// Certificado o CSR, como lo describe el informe de texto. Fechas en RFC 3339 UTC; sin validez (CSR) no hay
// days_left ni fechas. key.description es el texto «RSA 2048» o «ECDSA P-256».
message PkiKey {
  string algorithm = 1; // RSA, ECDSA
  uint32 bits = 2;
  string curve = 3;     // solo ECDSA
  string description = 4;
}

message PkiSignature {
  string algorithm = 1;
  optional bool valid = 2; // solo en CSR
}

message PkiWarning {
  string code = 1;               // rsa_small, weak_sig, no_san, expired, not_yet, expires_soon, self_signed, csr_signature
  map<string, string> args = 2;
  string message = 3;            // en el idioma pedido
}

message PkiCertificate {
  string kind = 1; // certificate, csr
  string subject = 2;
  string issuer = 3;
  string serial = 4;
  string not_before = 5;
  string not_after = 6;
  optional int32 days_left = 7;
  PkiKey key = 8;
  PkiSignature signature = 9;
  repeated string san = 10;
  repeated string key_usage = 11;
  repeated string ext_key_usage = 12;
  bool is_ca = 13;
  bool self_signed = 14;
  string sha1 = 15;
  string sha256 = 16;
  repeated PkiWarning warnings = 17;
}

message PkiKeyRequest {
  string algorithm = 1;    // rsa2048, rsa3072, rsa4096, p256, p384
  bytes key_password = 2;  // sella la llave (Argon2id + AES-256-GCM)
}

message PkiKeyResponse {
  string sealed_key_pem = 1;
}

message PkiSubject {
  string cn = 1;
  string o = 2;
  string ou = 3;
  string l = 4;
  string st = 5;
  string c = 6;
}

message PkiCsrRequest {
  string sealed_key_pem = 1; // vacío = generar una llave nueva con algorithm
  string algorithm = 2;
  bytes key_password = 3;
  PkiSubject subject = 4;
  repeated string dns = 5;
  repeated string ips = 6;
}

message PkiCsrResponse {
  string csr_pem = 1;
  string sealed_key_pem = 2; // la llave usada (nueva o la recibida)
  ToolReport report = 3;
  repeated PkiCertificate certificates = 4;
}

message PkiCaInitRequest {
  string name = 1;
  int32 days = 2; // 3650 por defecto
  string algorithm = 3; // p256 por defecto
  bytes key_password = 4;
}

message PkiCaInitResponse {
  string ca_cert_pem = 1;
  string sealed_key_pem = 2;
  ToolReport report = 3;
  repeated PkiCertificate certificates = 4;
  bool lab_warning = 5; // el texto del informe abre con el aviso de CA de laboratorio
}

message PkiCaSignRequest {
  string ca_cert_pem = 1;
  string ca_sealed_key_pem = 2;
  bytes ca_key_password = 3;
  string csr_pem = 4;
  string profile = 5; // server, client, server-client
  int32 days = 6;     // 365 por defecto
}

message PkiCaSignResponse {
  string cert_pem = 1;
  ToolReport report = 2;
  repeated PkiCertificate certificates = 3;
  bool lab_warning = 4;
}

message PkiExportRequest {
  string format = 1; // pem, der, p12, p12-legacy
  string cert_pem = 2;
  string chain_pem = 3;
  string sealed_key_pem = 4; // obligatorio para p12; en pem solo con include_plain_key
  bytes key_password = 5;
  bytes export_password = 6;
  bool include_plain_key = 7; // pem: exportar la llave SIN cifrar (decisión explícita)
}

message PkiExportResponse {
  bytes data = 1;
}

message PkiDecodeRequest {
  bytes data = 1; // PEM (uno o varios bloques) o DER
}

message PkiDecodeResponse {
  ToolReport report = 1;
  repeated PkiCertificate certificates = 2;
}

message IkeDecodeRequest {
  string text = 1;
}

message IkeDecodeResponse {
  ToolReport report = 1;
}
