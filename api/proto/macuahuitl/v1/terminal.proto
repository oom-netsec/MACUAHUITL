syntax = "proto3";

package macuahuitl.v1;

import "macuahuitl/v1/common.proto";

option go_package = "github.com/oom-netsec/MACUAHUITL/gen/macuahuitl/v1;macuahuitlv1";

// Terminal SSH interactiva (Fase 16b). Es manual: lo que el ingeniero teclea va directo al
// equipo, sin pasar por el modo asistido ni por listas cerradas. La sesión usa el EgressGuard,
// la credencial de la bóveda y la verificación estricta de la llave de host. Se graba lo que
// devuelve el equipo y lo tecleado, salvo lo que se escribe en un prompt de contraseña o secreto.
service TerminalService {
  // El primer mensaje debe ser `open`; después, `data` o `resize`. Cerrar el envío (o cancelar,
  // o cerrarse el núcleo, o cortarse el equipo) termina la sesión: cierra SSH, revoca el guard
  // y lo audita.
  rpc OpenTerminal(stream OpenTerminalRequest) returns (stream OpenTerminalResponse);
}

message TerminalOpen {
  string name = 1;     // etiqueta de la pestaña; si va vacía, address:port
  string address = 2;
  uint32 port = 3;     // 0 = 22
  string credential_id = 4;
  repeated string accepted_host_key_fingerprints = 5;
  // Huellas por equipo (host o host:puerto). Sustituye al campo anterior, que solo vale con un destino.
  repeated AcceptedHostKey accepted_host_keys = 10;
  uint32 rows = 6;     // 0 = 24
  uint32 cols = 7;     // 0 = 200
  // Fase 44: abrir un host guardado de la libreta. host_id es EXCLUSIVO: el núcleo toma la dirección, el puerto, la
  // credencial y la orden de inicio del host, y si el pedido trae además address, port o credential_id lo rechaza con
  // InvalidArgument (terminal.err.host_and_address), sin conectar: no se combina un host guardado con otra dirección u
  // otra credencial. Si el host
  // tiene orden de inicio, se manda como exec con PTY en vez del shell y la sesión termina cuando esa orden termina.
  // CheckDenied no aplica: es el terminal manual. Una credencial "key" solo se usa por host_id de un host linux o windows:
  // con dirección a mano o con un host Cisco se rechaza (FailedPrecondition, terminal.err.key_credential).
  string host_id = 8;
  // La orden de inicio que la UI le mostró al usuario antes de conectar. Si no es igual a la guardada, el núcleo no
  // conecta (FailedPrecondition): lo que corre es lo que se vio. Vacío = el host no debe tener orden de inicio.
  string expected_startup_command = 9;
}

message TerminalSize {
  uint32 rows = 1;
  uint32 cols = 2;
}

message OpenTerminalRequest {
  oneof msg {
    TerminalOpen open = 1;
    bytes data = 2;
    TerminalSize resize = 3;
  }
}

message OpenTerminalResponse {
  string opened = 1;     // primer evento: "usuario@host:puerto"
  string recording = 2;  // archivo de la grabación
  bytes data = 3;        // lo que devuelve el equipo
}
