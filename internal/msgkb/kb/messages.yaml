# SIN VALIDAR EN LABORATORIO: causas y acciones tomadas de la documentación pública de
# Cisco (System Message Guide y guías de solución de problemas de IOS e IOS-XE). Todos los
# comandos de verify son de lectura: msgkb.Load los valida con playbook.CheckDenied.
- id: "%SYS-2-MALLOCFAIL"
  meaning: "El equipo no pudo reservar memoria para un proceso o una función."
  cause: "Memoria agotada o fragmentada, fuga de memoria de un proceso, o una función que pide bloques enormes (tabla de rutas, ACL, MAC) para el tamaño del equipo."
  action: "Identifica el proceso del mensaje y el que más memoria retiene; si crece ronda tras ronda es una fuga. Guarda primero la evidencia (show memory statistics, show processes memory sorted, el crashinfo). La recarga controlada la planea y la ejecuta un humano en una ventana de cambio, nunca esta herramienta; revisa el Bug Search Tool de la versión."
  meaning_en: "The device could not allocate memory for a process or a function."
  cause_en: "Memory exhausted or fragmented, a process memory leak, or a function requesting huge blocks (routing table, ACL, MAC) for the size of the device."
  action_en: "Identify the process in the message and the one holding the most memory; if it grows round after round it is a leak. Save the evidence first (show memory statistics, show processes memory sorted, the crashinfo). A controlled reload is planned and executed by a human in a change window, never by this tool; check the Bug Search Tool for the version."
  verify: [show memory statistics, show processes memory sorted, show memory failures alloc, show logging | include MALLOCFAIL]
- id: "%SYS-3-CPUHOG"
  meaning: "Un proceso retuvo la CPU más tiempo del permitido."
  cause: "Proceso que itera sobre una tabla grande (rutas, ARP, SNMP walk), una tormenta de eventos o un defecto de software."
  action: "Mira qué proceso y qué tráfico lo dispara; correlaciona con cambios de topología y con sondeos SNMP intensos."
  meaning_en: "A process held the CPU longer than allowed."
  cause_en: "A process iterating over a large table (routes, ARP, SNMP walk), an event storm or a software defect."
  action_en: "See which process and which traffic triggers it; correlate with topology changes and intensive SNMP polling."
  verify: [show processes cpu sorted, show processes cpu history, show logging | include CPUHOG]
- id: "%SYS-5-CONFIG_I"
  meaning: "Alguien entró al modo de configuración y salió (la configuración cambió)."
  cause: "Cambio manual desde consola, SSH o Telnet; el mensaje dice quién y desde dónde."
  action: "Confirma que el cambio estaba autorizado y compáralo con el respaldo anterior. Guarda primero la evidencia (respaldo y running-config); write memory lo ejecuta un humano, solo si el cambio es correcto: esta herramienta no escribe en el equipo."
  meaning_en: "Someone entered configuration mode and left it (the configuration changed)."
  cause_en: "A manual change from the console, SSH or Telnet; the message says who and from where."
  action_en: "Confirm the change was authorized and compare it with the previous backup. Save the evidence first (backup and running-config); write memory is run by a human, only if the change is correct: this tool does not write to the device."
  verify: [show users, show logging | include CONFIG_I, show running-config | include ^! Last configuration change]
- id: "%SYS-5-RELOAD"
  meaning: "Se pidió una recarga del equipo."
  cause: "Un usuario ejecutó reload o una actualización de software la programó."
  action: "Verifica quién la pidió y si hay una recarga programada que cancelar."
  meaning_en: "A device reload was requested."
  cause_en: "A user ran reload or a software upgrade scheduled it."
  action_en: "Verify who requested it and whether there is a scheduled reload to cancel."
  verify: [show reload, show users, show logging | include RELOAD]
- id: "%SYS-5-RESTART"
  meaning: "El sistema se reinició."
  cause: "Recarga pedida, falla de software o corte de energía; show version dice el motivo de la última recarga."
  action: "Lee el motivo en show version; si fue una falla, revisa los archivos crashinfo y ábrelos con la herramienta de crashinfo."
  meaning_en: "The system restarted."
  cause_en: "A requested reload, a software failure or a power outage; show version gives the reason for the last reload."
  action_en: "Read the reason in show version; if it was a failure, check the crashinfo files and open them with the crashinfo tool."
  verify: [show version, dir crashinfo:, show logging | include RESTART]
- id: "%PARSER-5-CFGLOG_LOGGEDCMD"
  meaning: "Registro de un comando de configuración ejecutado por un usuario (logging de comandos activo)."
  cause: "Se configuró archive / log config / logging enable y alguien aplicó un comando."
  action: "Úsalo como bitácora de cambios; reenvíalo al syslog central y compáralo con los cambios autorizados."
  meaning_en: "Record of a configuration command run by a user (command logging is active)."
  cause_en: "archive / log config / logging enable was configured and someone applied a command."
  action_en: "Use it as a change log; forward it to the central syslog and compare it with the authorized changes."
  verify: [show archive log config all, show logging | include CFGLOG]
- id: "%LINK-3-UPDOWN"
  meaning: "El enlace físico de una interfaz subió o bajó."
  cause: "Cable o conector dañado, SFP defectuoso, el otro extremo apagado o reiniciándose, negociación de velocidad o dúplex, o PoE intermitente."
  action: "Si hay varias transiciones seguidas es flapping; revisa el cable, el transceptor y los contadores de errores de ambos extremos."
  meaning_en: "The physical link of an interface went up or down."
  cause_en: "Damaged cable or connector, faulty SFP, the other end powered off or rebooting, speed or duplex negotiation, or intermittent PoE."
  action_en: "Several transitions in a row are flapping; check the cable, the transceiver and the error counters at both ends."
  verify: [show interfaces status, show interfaces counters errors, show logging | include UPDOWN]
- id: "%LINEPROTO-5-UPDOWN"
  meaning: "El protocolo de línea de una interfaz subió o bajó."
  cause: "Sigue al enlace físico; con el enlace arriba y el protocolo abajo, falla de keepalive o de encapsulación."
  action: "Revisa la interfaz y los keepalives; si coincide con LINK-3-UPDOWN, atiende primero el enlace físico."
  meaning_en: "The line protocol of an interface went up or down."
  cause_en: "It follows the physical link; with the link up and the protocol down, a keepalive or encapsulation failure."
  action_en: "Check the interface and the keepalives; if it coincides with LINK-3-UPDOWN, deal with the physical link first."
  verify: [show interfaces status, show ip interface brief, show logging | include LINEPROTO]
- id: "%LINK-5-CHANGED"
  meaning: "Una interfaz cambió de estado administrativo."
  cause: "Se ejecutó shutdown o no shutdown en la interfaz."
  action: "Confirma que el cambio fue intencional."
  meaning_en: "An interface changed its administrative state."
  cause_en: "shutdown or no shutdown was run on the interface."
  action_en: "Confirm the change was intentional."
  verify: [show interfaces status, show ip interface brief]
- id: "%SPANTREE-2-BLOCK_BPDUGUARD"
  meaning: "BPDU Guard bloqueó un puerto que recibió un BPDU."
  cause: "Un switch, un puente o un equipo con STP se conectó a un puerto de acceso con PortFast y BPDU Guard."
  action: "Quita el equipo que envía BPDU o quita PortFast del puerto si es un enlace entre switches; recupera el puerto con shutdown y no shutdown solo tras corregir la causa."
  meaning_en: "BPDU Guard blocked a port that received a BPDU."
  cause_en: "A switch, a bridge or a device running STP was connected to an access port with PortFast and BPDU Guard."
  action_en: "Remove the device sending BPDUs, or remove PortFast from the port if it is a link between switches; recover the port with shutdown and no shutdown only after fixing the cause."
  verify: [show interfaces status err-disabled, show spanning-tree summary, show errdisable detect]
- id: "%SPANTREE-2-LOOPGUARD_BLOCK"
  meaning: "Loop Guard puso un puerto en estado inconsistente porque dejó de recibir BPDU."
  cause: "Enlace unidireccional o el vecino dejó de enviar BPDU."
  action: "Revisa la fibra y el UDLD del enlace; el puerto se recupera solo al volver a recibir BPDU."
  meaning_en: "Loop Guard put a port in an inconsistent state because it stopped receiving BPDUs."
  cause_en: "A unidirectional link or the neighbor stopped sending BPDUs."
  action_en: "Check the fiber and UDLD on the link; the port recovers on its own when it receives BPDUs again."
  verify: [show spanning-tree inconsistentports, show udld neighbors, show spanning-tree summary]
- id: "%SPANTREE-2-ROOTGUARD_BLOCK"
  meaning: "Root Guard bloqueó un puerto que recibió un BPDU superior."
  cause: "Un switch con prioridad menor intenta convertirse en raíz por ese puerto."
  action: "Confirma quién debe ser la raíz y corrige la prioridad del switch invasor."
  meaning_en: "Root Guard blocked a port that received a superior BPDU."
  cause_en: "A switch with a lower priority is trying to become root through that port."
  action_en: "Confirm who should be the root and fix the priority of the offending switch."
  verify: [show spanning-tree inconsistentports, show spanning-tree root]
- id: "%SPANTREE-5-TOPOTRAP"
  meaning: "Cambio de topología de spanning-tree en una VLAN."
  cause: "Un puerto subió o bajó, o llegó una notificación de cambio de topología desde otro switch."
  action: "Si se repite, busca el puerto que genera los cambios (show spanning-tree detail) y revisa PortFast en los puertos de usuario."
  meaning_en: "Spanning-tree topology change in a VLAN."
  cause_en: "A port went up or down, or a topology change notification arrived from another switch."
  action_en: "If it repeats, look for the port generating the changes (show spanning-tree detail) and check PortFast on user ports."
  verify: [show spanning-tree detail, show spanning-tree summary]
- id: "%PM-4-ERR_DISABLE"
  meaning: "El puerto pasó a err-disable por una condición de protección."
  cause: "bpduguard, port-security, udld, loopback, storm-control u otra función detectó una falla en el puerto."
  action: "Lee la causa en el mensaje, corrígela y recupera el puerto; considera errdisable recovery solo si la causa es temporal."
  meaning_en: "The port went into err-disable because of a protection condition."
  cause_en: "bpduguard, port-security, udld, loopback, storm-control or another function detected a failure on the port."
  action_en: "Read the cause in the message, fix it and recover the port; consider errdisable recovery only if the cause is temporary."
  verify: [show interfaces status err-disabled, show errdisable detect, show errdisable recovery]
- id: "%PM-4-ERR_RECOVER"
  meaning: "El equipo intenta recuperar un puerto de err-disable."
  cause: "errdisable recovery está activo para esa causa y venció su intervalo."
  action: "Si el puerto vuelve a caer, la causa sigue presente: corrígela en vez de dejar que se recupere en bucle."
  meaning_en: "The device is trying to recover a port from err-disable."
  cause_en: "errdisable recovery is active for that cause and its interval expired."
  action_en: "If the port goes down again, the cause is still present: fix it instead of letting it recover in a loop."
  verify: [show errdisable recovery, show interfaces status err-disabled]
- id: "%PORT_SECURITY-2-PSECURE_VIOLATION"
  meaning: "Port security detectó una dirección MAC no permitida o un exceso de direcciones."
  cause: "Un equipo no autorizado, un teléfono o hub agregado, o un máximo de direcciones demasiado bajo."
  action: "Identifica la MAC infractora; ajusta el máximo o quita el equipo; recupera el puerto si quedó en err-disable."
  meaning_en: "Port security detected a MAC address that is not allowed or too many addresses."
  cause_en: "An unauthorized device, a phone or hub that was added, or a maximum number of addresses that is too low."
  action_en: "Identify the offending MAC; adjust the maximum or remove the device; recover the port if it ended up in err-disable."
  verify: [show port-security, show port-security address, show interfaces status err-disabled]
- id: "%SW_MATM-4-MACFLAP_NOTIF"
  meaning: "Una misma dirección MAC se ve alternando entre dos puertos."
  cause: "Lazo de capa 2, balanceo mal hecho en un servidor (NIC teaming) o una máquina virtual que migra."
  action: "Busca el lazo (show spanning-tree) y revisa el puerto de cada lado; si es teaming, alinea el modo con la configuración del switch."
  meaning_en: "The same MAC address is seen alternating between two ports."
  cause_en: "A layer 2 loop, bad load balancing on a server (NIC teaming) or a virtual machine that is migrating."
  action_en: "Look for the loop (show spanning-tree) and check the port on each side; if it is teaming, align the mode with the switch configuration."
  verify: [show mac address-table, show spanning-tree summary, show etherchannel summary]
- id: "%ETHCNTR-3-LOOP_BACK_DETECTED"
  meaning: "El equipo detectó que lo que envía por un puerto le regresa (lazo en el cable)."
  cause: "Cable en lazo, dos puertos del mismo switch conectados entre sí o un equipo que refleja tramas."
  action: "Quita el lazo físico. El puerto pasa a err-disable (causa loopback) y no vuelve solo: una persona lo recupera con shutdown / no shutdown tras corregir el lazo, o queda configurado errdisable recovery cause loopback."
  meaning_en: "The device detected that what it sends out of a port comes back to it (a loop in the cable)."
  cause_en: "A looped cable, two ports of the same switch connected to each other or a device that reflects frames."
  action_en: "Remove the physical loop. The port goes into err-disable (cause loopback) and does not come back on its own: a person recovers it with shutdown / no shutdown after fixing the loop, or errdisable recovery cause loopback is configured."
  verify: [show interfaces status err-disabled, show errdisable recovery, show interfaces status, show spanning-tree summary]
- id: "%STORM_CONTROL-3-SHUTDOWN"
  meaning: "Storm control apagó un puerto por tráfico broadcast, multicast o unicast excesivo."
  cause: "Lazo de capa 2, equipo con falla que inunda la red o un umbral demasiado bajo."
  action: "Busca el origen del tráfico; no subas el umbral sin entender la causa."
  meaning_en: "Storm control shut down a port because of excessive broadcast, multicast or unicast traffic."
  cause_en: "A layer 2 loop, a faulty device flooding the network or a threshold that is too low."
  action_en: "Look for the source of the traffic; do not raise the threshold without understanding the cause."
  verify: [show storm-control, show interfaces status err-disabled, show interfaces counters]
- id: "%STORM_CONTROL-3-FILTERED"
  meaning: "Storm control está filtrando tráfico que superó el umbral."
  cause: "Ráfaga de broadcast, multicast o unicast desconocido."
  action: "Revisa si es una ráfaga legítima (arranque masivo, backup) o un lazo."
  meaning_en: "Storm control is filtering traffic that exceeded the threshold."
  cause_en: "A burst of broadcast, multicast or unknown unicast."
  action_en: "Check whether it is a legitimate burst (mass boot, backup) or a loop."
  verify: [show storm-control, show interfaces counters]
- id: "%CDP-4-DUPLEX_MISMATCH"
  meaning: "CDP detectó dúplex distinto en los dos extremos de un enlace."
  cause: "Un extremo con negociación automática y el otro fijo, o dos extremos fijos distintos."
  action: "Pon ambos extremos en automático, o ambos fijos con la misma velocidad y dúplex."
  meaning_en: "CDP detected a different duplex at the two ends of a link."
  cause_en: "One end with autonegotiation and the other fixed, or two different fixed ends."
  action_en: "Set both ends to auto, or both fixed with the same speed and duplex."
  verify: [show interfaces status, show cdp neighbors detail, show interfaces counters errors]
- id: "%CDP-4-NATIVE_VLAN_MISMATCH"
  meaning: "La VLAN nativa de un troncal no coincide con la del vecino."
  cause: "Configuración distinta de switchport trunk native vlan en cada extremo."
  action: "Iguala la VLAN nativa en ambos extremos; la discrepancia puede mezclar tráfico de VLAN."
  meaning_en: "The native VLAN of a trunk does not match the neighbor's."
  cause_en: "Different switchport trunk native vlan configuration at each end."
  action_en: "Make the native VLAN the same at both ends; the mismatch can mix VLAN traffic."
  verify: [show interfaces trunk, show cdp neighbors detail]
- id: "%UDLD-4-UDLD_PORT_DISABLED"
  meaning: "UDLD apagó un puerto por un enlace unidireccional."
  cause: "Una fibra de la pareja rota o mal conectada, o un transceptor que solo transmite o recibe."
  action: "Revisa y limpia las fibras y los transceptores; cambia el par de fibras si persiste."
  meaning_en: "UDLD shut down a port because of a unidirectional link."
  cause_en: "One fiber of the pair broken or badly connected, or a transceiver that only transmits or receives."
  action_en: "Check and clean the fibers and transceivers; replace the fiber pair if it persists."
  verify: [show udld neighbors, show interfaces status err-disabled, show interfaces transceiver detail]
- id: "%IP-4-DUPADDR"
  meaning: "Hay dos equipos con la misma dirección IP en el segmento."
  cause: "IP configurada a mano en dos equipos o un DHCP con rango solapado."
  action: "Localiza la MAC del otro equipo en el mensaje y corrige su dirección."
  meaning_en: "There are two devices with the same IP address on the segment."
  cause_en: "An IP configured by hand on two devices or a DHCP with an overlapping range."
  action_en: "Locate the other device's MAC in the message and fix its address."
  verify: [show ip arp, show mac address-table, show ip dhcp conflict]
- id: "%OSPF-5-ADJCHG"
  meaning: "Cambió el estado de una adyacencia OSPF."
  cause: "Dead timer vencido, flap de la interfaz, desajuste de MTU o de temporizadores, cambio de autenticación o un vecino que se reinicia."
  action: "Lee el motivo en el mensaje; si se repite, revisa el estado físico de la interfaz y los parámetros hello y dead de ambos lados."
  meaning_en: "The state of an OSPF adjacency changed."
  cause_en: "Dead timer expired, interface flap, MTU or timer mismatch, an authentication change or a neighbor that is rebooting."
  action_en: "Read the reason in the message; if it repeats, check the physical state of the interface and the hello and dead parameters on both sides."
  verify: [show ip ospf neighbor, show ip ospf interface, show logging | include OSPF]
- id: "%OSPF-4-ERRRCV"
  meaning: "Se recibió un paquete OSPF inválido."
  cause: "Área, temporizadores, autenticación o tipo de red distintos entre los vecinos."
  action: "Compara la configuración OSPF de los dos extremos de la interfaz."
  meaning_en: "An invalid OSPF packet was received."
  cause_en: "Different area, timers, authentication or network type between the neighbors."
  action_en: "Compare the OSPF configuration of the two ends of the interface."
  verify: [show ip ospf interface, show ip ospf neighbor]
- id: "%BGP-5-ADJCHANGE"
  meaning: "Cambió el estado de un vecino BGP."
  cause: "Hold timer vencido, reinicio del vecino, flap del enlace, límite de prefijos o cambio de política."
  action: "Revisa el motivo en show ip bgp neighbors y la conectividad TCP/179 con el vecino."
  meaning_en: "The state of a BGP neighbor changed."
  cause_en: "Hold timer expired, neighbor restart, link flap, prefix limit or a policy change."
  action_en: "Check the reason in show ip bgp neighbors and the TCP/179 connectivity with the neighbor."
  verify: [show ip bgp summary, show ip bgp neighbors, show logging | include BGP]
- id: "%BGP-3-NOTIFICATION"
  meaning: "Se envió o se recibió una notificación BGP, normalmente seguida de la caída de la sesión."
  cause: "Error de OPEN, hold timer, límite de prefijos excedido o cierre administrativo."
  action: "El código y subcódigo del mensaje dicen el motivo; compáralos con los códigos de la RFC 4271."
  meaning_en: "A BGP notification was sent or received, normally followed by the session going down."
  cause_en: "OPEN error, hold timer, prefix limit exceeded or administrative shutdown."
  action_en: "The code and subcode of the message give the reason; compare them with the codes in RFC 4271."
  verify: [show ip bgp neighbors, show ip bgp summary]
- id: "%DUAL-5-NBRCHANGE"
  meaning: "Cambió un vecino EIGRP."
  cause: "Holding time vencido, flap de la interfaz o un vecino que se reinicia o reconfigura."
  action: "Revisa el motivo del mensaje y la estabilidad del enlace al vecino."
  meaning_en: "An EIGRP neighbor changed."
  cause_en: "Holding time expired, interface flap or a neighbor that is rebooting or being reconfigured."
  action_en: "Check the reason in the message and the stability of the link to the neighbor."
  verify: [show ip eigrp neighbors, show ip eigrp interfaces, show logging | include DUAL]
- id: "%STANDBY-6-STATECHANGE"
  meaning: "Cambió el estado de un grupo HSRP."
  cause: "El activo falló, se perdieron hellos, o se aplicó preempt o un cambio de prioridad."
  action: "Si el estado cambia seguido, revisa el enlace entre los dos routers y los temporizadores."
  meaning_en: "The state of an HSRP group changed."
  cause_en: "The active router failed, hellos were lost, or preempt or a priority change was applied."
  action_en: "If the state changes often, check the link between the two routers and the timers."
  verify: [show standby brief, show standby, show logging | include STANDBY]
- id: "%VRRP-6-STATE"
  meaning: "Cambió el estado de un grupo VRRP."
  cause: "El maestro dejó de anunciarse o cambió la prioridad."
  action: "Revisa la conectividad entre los routers del grupo."
  meaning_en: "The state of a VRRP group changed."
  cause_en: "The master stopped advertising or the priority changed."
  action_en: "Check the connectivity between the routers of the group."
  verify: [show vrrp brief, show vrrp]
- id: "%SEC-6-IPACCESSLOGP"
  meaning: "Una ACL con log registró un paquete."
  cause: "Tráfico que coincide con una entrada con la palabra log."
  action: "Decide si el tráfico debía permitirse; revisa los contadores de la ACL."
  meaning_en: "An ACL with log recorded a packet."
  cause_en: "Traffic matching an entry with the log keyword."
  action_en: "Decide whether the traffic should have been permitted; check the ACL counters."
  verify: [show ip access-lists, show access-lists]
- id: "%SEC_LOGIN-4-LOGIN_FAILED"
  meaning: "Falló un intento de inicio de sesión."
  cause: "Contraseña equivocada, usuario inexistente o un intento de fuerza bruta."
  action: "Si se repite desde una misma IP, restringe el acceso a vty con una ACL y revisa quién es."
  meaning_en: "A login attempt failed."
  cause_en: "Wrong password, nonexistent user or a brute-force attempt."
  action_en: "If it repeats from the same IP, restrict vty access with an ACL and find out who it is."
  verify: [show login failures, show users, show ip ssh]
- id: "%SNMP-3-AUTHFAIL"
  meaning: "Una petición SNMP llegó con una comunidad o credencial inválida."
  cause: "Estación de monitoreo mal configurada o un escaneo de comunidades."
  action: "Identifica la IP origen y restringe SNMP con una ACL o pasa a SNMPv3."
  meaning_en: "An SNMP request arrived with an invalid community or credential."
  cause_en: "A misconfigured monitoring station or a community scan."
  action_en: "Identify the source IP and restrict SNMP with an ACL or move to SNMPv3."
  verify: [show snmp, show snmp host]
- id: "%AUTHMGR-5-FAIL"
  meaning: "Falló la autenticación 802.1X o MAB de un cliente en un puerto."
  cause: "Credenciales o certificado inválidos, servidor RADIUS inaccesible o MAC no registrada."
  action: "Revisa el motivo en el mensaje y la conectividad con el servidor RADIUS."
  meaning_en: "802.1X or MAB authentication of a client failed on a port."
  cause_en: "Invalid credentials or certificate, RADIUS server unreachable or MAC not registered."
  action_en: "Check the reason in the message and the connectivity with the RADIUS server."
  verify: [show authentication sessions, show radius statistics, show dot1x all]
- id: "%SW_DAI-4-DHCP_SNOOPING_DENY"
  meaning: "Inspección dinámica de ARP descartó un paquete que no coincide con la tabla de DHCP snooping."
  cause: "Equipo con IP estática sin entrada en la tabla, o un intento de ARP spoofing."
  action: "Agrega una entrada estática o ACL de ARP para los equipos legítimos; investiga el origen si no lo es."
  meaning_en: "Dynamic ARP inspection dropped a packet that does not match the DHCP snooping table."
  cause_en: "A device with a static IP and no entry in the table, or an ARP spoofing attempt."
  action_en: "Add a static entry or ARP ACL for the legitimate devices; investigate the source if it is not legitimate."
  verify: [show ip arp inspection, show ip dhcp snooping binding]
- id: "%DHCP_SNOOPING-5-DHCP_SNOOPING_UNTRUSTED_PORT"
  meaning: "DHCP snooping descartó un mensaje de servidor DHCP recibido en un puerto no confiable."
  cause: "Servidor DHCP no autorizado o un puerto de enlace ascendente sin trust."
  action: "Marca como trust solo los puertos hacia el servidor DHCP legítimo; busca el servidor falso."
  meaning_en: "DHCP snooping dropped a DHCP server message received on an untrusted port."
  cause_en: "An unauthorized DHCP server or an uplink port without trust."
  action_en: "Mark as trusted only the ports toward the legitimate DHCP server; look for the rogue server."
  verify: [show ip dhcp snooping, show ip dhcp snooping binding]
- id: "%DATACORRUPTION-1-DATAINCONSISTENCY"
  meaning: "El software detectó una inconsistencia interna de datos."
  cause: "Defecto de software; suele traer un traceback."
  action: "Guarda el traceback completo y el show tech-support y abre un caso con TAC."
  meaning_en: "The software detected an internal data inconsistency."
  cause_en: "A software defect; it usually comes with a traceback."
  action_en: "Save the full traceback and the show tech-support and open a TAC case."
  verify: [show version, show logging, dir crashinfo:]
- id: "%PLATFORM_ENV-*"
  meaning: "Alerta ambiental de la plataforma (temperatura, ventiladores o fuentes)."
  cause: "Ventilador detenido, flujo de aire bloqueado, temperatura ambiente alta o fuente de poder con falla."
  action: "Revisa el estado de ventiladores, temperatura y fuentes, y la ventilación física del equipo."
  meaning_en: "Platform environmental alert (temperature, fans or power supplies)."
  cause_en: "A stopped fan, blocked airflow, high ambient temperature or a failing power supply."
  action_en: "Check the state of the fans, temperature and power supplies, and the physical ventilation of the device."
  verify: [show environment all, show environment temperature, show inventory]
- id: "%PLATFORM-*"
  meaning: "Mensaje de la capa de plataforma (hardware y controladores del equipo)."
  cause: "Depende del mensaje: falla de hardware o de memoria de tablas (TCAM, MAC), o un defecto del controlador."
  action: "Lee el texto exacto del mensaje; si habla de recursos agotados (TCAM), reduce ACL o rutas; si es hardware, abre un caso con TAC."
  meaning_en: "Platform layer message (hardware and device drivers)."
  cause_en: "It depends on the message: a hardware failure or a table memory failure (TCAM, MAC), or a driver defect."
  action_en: "Read the exact text of the message; if it talks about exhausted resources (TCAM), reduce ACLs or routes; if it is hardware, open a TAC case."
  verify: [show platform resources, show logging, show version]
- id: "%ILPOWER-5-POWER_GRANTED"
  meaning: "El equipo entregó energía PoE a un puerto."
  cause: "Se conectó un dispositivo PoE (teléfono, punto de acceso) y se le asignó potencia."
  action: "Informativo; si se repite en el mismo puerto, el dispositivo se reinicia o el cable falla."
  meaning_en: "The device delivered PoE power to a port."
  cause_en: "A PoE device (phone, access point) was connected and was assigned power."
  action_en: "Informational; if it repeats on the same port, the device is rebooting or the cable is failing."
  verify: [show power inline, show power inline detail]
- id: "%ILPOWER-5-IEEE_DISCONNECT"
  meaning: "El dispositivo PoE se desconectó, o el puerto le quitó la energía."
  cause: "Cable desconectado, dispositivo apagado o consumo fuera de clase."
  action: "Revisa el cable y el consumo del dispositivo; si se repite, es flapping de PoE."
  meaning_en: "The PoE device disconnected, or the port removed its power."
  cause_en: "Cable unplugged, device powered off or consumption out of class."
  action_en: "Check the cable and the device's consumption; if it repeats, it is PoE flapping."
  verify: [show power inline, show interfaces status]
- id: "%ILPOWER-3-CONTROLLER_PORT_ERR"
  meaning: "El controlador de PoE reportó un error en un puerto."
  cause: "Cortocircuito, sobrecorriente o falla del controlador PoE."
  action: "Cambia el cable y el dispositivo; si el error se mueve con el puerto, abre un caso por hardware."
  meaning_en: "The PoE controller reported an error on a port."
  cause_en: "A short circuit, overcurrent or a PoE controller failure."
  action_en: "Replace the cable and the device; if the error moves with the port, open a hardware case."
  verify: [show power inline, show power inline detail, show environment power]
- id: "%ILPOWER-*"
  meaning: "Mensaje de Power over Ethernet (PoE)."
  cause: "Cambio en la negociación o la entrega de energía hacia un dispositivo alimentado."
  action: "Lee el detalle del mensaje y revisa el presupuesto de energía del switch."
  meaning_en: "Power over Ethernet (PoE) message."
  cause_en: "A change in the negotiation or the delivery of power to a powered device."
  action_en: "Read the message detail and check the switch's power budget."
  verify: [show power inline, show environment power]
