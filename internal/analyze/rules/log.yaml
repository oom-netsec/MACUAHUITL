# SIN VALIDAR EN LABORATORIO: formatos y umbrales tomados de la documentación
# pública de Cisco IOS-XE, sin transcripciones reales todavía. Ajustar con
# salidas de equipos reales antes de confiar en los umbrales.
- id: log-mallocfail
  title: Falla de asignación de memoria
  severity: critica
  commands: [show logging]
  check: match
  params: {pattern: '%SYS-2-MALLOCFAIL'}
  explanation: El equipo no pudo asignar memoria; procesos pueden fallar y el equipo puede recargar.
  action: Revisa memoria-baja/memoria-fuga y el proceso indicado en -Process=; abre caso TAC con los tracebacks.
  title_en: "Memory allocation failure"
  explanation_en: "The device could not allocate memory; processes may fail and the device may reload."
  action_en: "Check memoria-baja/memoria-fuga and the process shown in -Process=; open a TAC case with the tracebacks."
- id: log-cpuhog
  title: Proceso acaparando el CPU
  severity: alta
  commands: [show logging]
  check: match
  params: {pattern: '%SYS-3-CPUHOG'}
  explanation: Un proceso retuvo el CPU más tiempo del permitido; otros procesos (keepalives, protocolos) se retrasan.
  action: Anota el proceso de "process =" y busca el defecto para la versión; correlaciona con la CPU de esa ronda.
  title_en: "Process hogging the CPU"
  explanation_en: "A process held the CPU longer than allowed; other processes (keepalives, protocols) are delayed."
  action_en: "Note the process from \"process =\" and look for the defect for the version; correlate with the CPU of that round."
- id: log-traceback
  title: Traceback en el log
  severity: alta
  commands: [show logging]
  check: match
  params: {pattern: '^\s*-Traceback='}
  explanation: Un traceback acompaña a un error de software; es la firma que TAC usa para identificar el defecto.
  action: Copia el traceback completo con el mensaje que lo precede y búscalo en el Bug Search Tool o adjúntalo al caso TAC.
  title_en: "Traceback in the log"
  explanation_en: "A traceback accompanies a software error; it is the signature TAC uses to identify the defect."
  action_en: "Copy the full traceback with the message that precedes it and search for it in the Bug Search Tool or attach it to the TAC case."
- id: log-critico
  title: Mensaje de severidad 0-2 en el log
  severity: alta
  commands: [show logging]
  check: match
  params: {pattern: '%[A-Z0-9_]+-[0-2]-[A-Z0-9_]+:', exclude: '%SYS-2-MALLOCFAIL|%PKI-2-NON_AUTHORITATIVE_CLOCK'}
  explanation: Hay mensajes de emergencia, alerta o crítico (severidad 0 a 2).
  action: Lee cada mensaje con su mnemónico en la guía de mensajes de sistema de la versión.
  title_en: "Severity 0-2 message in the log"
  explanation_en: "There are emergency, alert or critical messages (severity 0 to 2)."
  action_en: "Read each message with its mnemonic in the system message guide for the version."
- id: log-reloj-no-autoritativo
  title: Reloj sin fuente autoritativa
  severity: baja
  commands: [show logging]
  check: match
  params: {pattern: '%PKI-2-NON_AUTHORITATIVE_CLOCK'}
  explanation: El certificado no se puede validar bien porque el reloj del equipo no tiene una fuente autoritativa (sin NTP o sin sincronizar).
  action: Configura NTP (ntp server) y confirma la sincronía con show ntp status; luego revisa de nuevo los certificados PKI.
  title_en: "Clock without an authoritative source"
  explanation_en: "The certificate cannot be validated properly because the device clock has no authoritative source (no NTP or not synchronized)."
  action_en: "Configure NTP (ntp server) and confirm synchronization with show ntp status; then re-check the PKI certificates."
- id: log-flap-interfaz
  title: Interfaz con flaps
  severity: media
  commands: [show logging]
  check: match
  params: {pattern: '%LINK-3-UPDOWN: Interface (\S+?),', group: "true", min: "4"}
  explanation: La misma interfaz cambió de estado varias veces en el búfer de log.
  action: Revisa capa 1 (errores CRC, transceptor) y el vecino; considera errdisable flap-setting si el flap afecta la topología.
  title_en: "Interface flapping"
  explanation_en: "The same interface changed state several times in the log buffer."
  action_en: "Check layer 1 (CRC errors, transceiver) and the neighbor; consider errdisable flap-setting if the flap affects the topology."
- id: log-adyacencia-caida
  title: Adyacencia de enrutamiento caída
  severity: media
  commands: [show logging]
  check: match
  params: {pattern: '%BGP-5-ADJCHANGE: neighbor \S+ .*Down|%OSPF-5-ADJCHG: .* to DOWN'}
  explanation: Una sesión BGP o una adyacencia OSPF se cayó.
  action: Revisa el motivo indicado en el mensaje (notificación, dead timer, interfaz) y el estado actual con show ip bgp summary / show ip ospf neighbor.
  title_en: "Routing adjacency down"
  explanation_en: "A BGP session or an OSPF adjacency went down."
  action_en: "Check the reason given in the message (notification, dead timer, interface) and the current state with show ip bgp summary / show ip ospf neighbor."
- id: log-eigrp-vecino-caido
  title: Vecino EIGRP caído
  severity: media
  commands: [show logging]
  check: match
  params: {pattern: '%DUAL-5-NBRCHANGE: .* is down'}
  explanation: Una adyacencia EIGRP se cayó; el mensaje trae el motivo al final.
  action: Lee el motivo del mensaje. «Auth failure» apunta al key chain o a la autenticación; «holding time expired» a hellos perdidos (enlace, ACL, CPU); «K-value mismatch» a los K-values; «peer restarted» a un reinicio del vecino. Confirma con show ip eigrp neighbors.
  title_en: "EIGRP neighbor down"
  explanation_en: "An EIGRP adjacency went down; the message carries the reason at the end."
  action_en: "Read the reason in the message. 'Auth failure' points to the key chain or authentication; 'holding time expired' to lost hellos (link, ACL, CPU); 'K-value mismatch' to the K-values; 'peer restarted' to a neighbor reload. Confirm with show ip eigrp neighbors."
- id: log-ldp-vecino-caido
  title: Vecino LDP caído
  severity: media
  commands: [show logging]
  check: match
  params: {pattern: '%LDP-5-NBRCHG: .* is DOWN'}
  explanation: Una sesión LDP se cayó; las etiquetas MPLS aprendidas de ese vecino se pierden.
  action: Revisa el motivo entre paréntesis del mensaje, que mpls ip siga en la interfaz, la alcanzabilidad del router-id LDP y el transporte TCP 646. Confirma con show mpls ldp neighbor.
  title_en: "LDP neighbor down"
  explanation_en: "An LDP session went down; the MPLS labels learned from that neighbor are lost."
  action_en: "Check the reason in parentheses in the message, that mpls ip is still on the interface, reachability of the LDP router-id and TCP 646 transport. Confirm with show mpls ldp neighbor."
- id: log-track-caido
  title: Objeto de seguimiento (track) caído
  severity: media
  commands: [show logging]
  check: match
  params: {pattern: '%TRACK(?:ING)?-\d-STATE: .* Up ?-> ?Down'}
  explanation: Un objeto track pasó a Down; si gobierna rutas estáticas, HSRP o PBR, el tráfico cambia de camino.
  action: Revisa qué usa ese track (show track, show standby, rutas estáticas) y la causa (show ip sla statistics si es una sonda IP SLA, o la interfaz si es line-protocol).
  title_en: "Tracked object down"
  explanation_en: "A track object went Down; if it drives static routes, HSRP or PBR, traffic changes path."
  action_en: "Check what uses that track (show track, show standby, static routes) and the cause (show ip sla statistics for an IP SLA probe, or the interface for line-protocol)."
- id: log-fhrp-inestable
  title: Grupo HSRP/GLBP/VRRP cayó a Init
  severity: media
  commands: [show logging]
  check: match
  params: {pattern: '(?i)%(HSRP|GLBP|VRRP)-\d-STATE(CHANGE)?: .* -> Init\b'}
  explanation: Un grupo FHRP pasó a Init (la interfaz o el grupo dejó de participar); el gateway virtual puede haber perdido redundancia o servicio. Los cambios normales de un failover (Active, Standby, Speak, Listen) no se reportan aquí.
  action: Verifica que la interfaz o SVI esté arriba, que los pares se vean (grupo, versión, autenticación) y el track asociado. Confirma con show standby brief, show glbp brief o show vrrp brief.
  title_en: "HSRP/GLBP/VRRP group fell to Init"
  explanation_en: "An FHRP group moved to Init (the interface or group stopped participating); the virtual gateway may have lost redundancy or service. Normal failover changes (Active, Standby, Speak, Listen) are not reported here."
  action_en: "Verify the interface or SVI is up, that the peers see each other (group, version, authentication) and the associated track. Confirm with show standby brief, show glbp brief or show vrrp brief."
- id: log-ospf-router-id-duplicado
  title: Router-id OSPF duplicado
  severity: alta
  commands: [show logging]
  check: match
  params: {pattern: '%OSPF-4-DUP_RTRID'}
  explanation: OSPF detectó otro router con el mismo router-id; las adyacencias y la base de datos quedan inestables.
  action: Identifica los dos equipos con ese router-id (la dirección del mensaje es el otro), cambia uno con router-id y reinicia el proceso con clear ip ospf process.
  title_en: "Duplicate OSPF router-id"
  explanation_en: "OSPF detected another router with the same router-id; adjacencies and the database become unstable."
  action_en: "Identify the two devices with that router-id (the address in the message is the other one), change one with router-id and restart the process with clear ip ospf process."
- id: log-bfd-sesion-caida
  title: Sesión BFD caída
  severity: media
  commands: [show logging]
  check: match
  params: {pattern: '%BFDFSM-6-BFD_SESS_DOWN'}
  explanation: Una sesión BFD se cayó; los protocolos que dependen de ella reconvergen.
  action: Lee el motivo (ECHO FAILURE, control detection time expired, admin down), revisa el enlace y la ACL del puerto UDP 3784/3785, y show bfd neighbors details.
  title_en: "BFD session down"
  explanation_en: "A BFD session went down; the protocols that depend on it reconverge."
  action_en: "Read the reason (ECHO FAILURE, control detection time expired, admin down), check the link and any ACL on UDP port 3784/3785, and show bfd neighbors details."
- id: log-isis-adyacencia-caida
  title: Adyacencia IS-IS caída
  severity: media
  commands: [show logging]
  check: match
  params: {pattern: '%CLNS-5-ADJCHANGE: .* Down'}
  explanation: Una adyacencia IS-IS se cayó; el mensaje trae el motivo al final.
  action: Revisa el motivo (hold time expired, interface down, authentication), el MTU y el nivel (L1/L2) de ambos lados con show clns neighbors.
  title_en: "IS-IS adjacency down"
  explanation_en: "An IS-IS adjacency went down; the message carries the reason at the end."
  action_en: "Check the reason (hold time expired, interface down, authentication), the MTU and the level (L1/L2) on both sides with show clns neighbors."
