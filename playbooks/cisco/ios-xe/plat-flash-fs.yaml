# Propósito: Revisa los sistemas de archivos, el espacio libre y la imagen de arranque.
# Cuándo usarlo: Antes de subir una imagen, flash llena, arranque desde una imagen incorrecta o archivos de crash acumulados.
# Fuente: https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/fundamentals/command/cf_command_ref.html
# Sin validar en laboratorio.
id: plat-flash-fs
platform: ios-xe
name: Plataforma · Flash y sistemas de archivos
commands:
  - cmd: show clock
  - cmd: show file systems
  - cmd: show boot
  - cmd: show bootvar
  - cmd: show version | include System image|image file|uptime
  - cmd: dir
  - cmd: "dir flash:"
  - cmd: "dir bootflash:"
    platforms: [ios-xe] # IOS clásico no tiene bootflash:
  - cmd: "dir nvram:"
  - cmd: "dir crashinfo:"
  - cmd: dir all-filesystems
    timeout: 120s
