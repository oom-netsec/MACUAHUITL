# Propósito: Revisa el estado de port-security, las MAC seguras y las violaciones registradas.
# Cuándo usarlo: Un usuario pierde red tras mover su equipo, o un puerto cae por violación de MAC.
# Fuente: https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/software/release/17-9/command_reference/b_179_9300_cr.html
# Sin validar en laboratorio.
id: l1-port-security
platform: ios-xe
name: L1 · Port-security
name_en: L1 · Port security
commands:
  - cmd: show clock
  - cmd: show port-security
  - cmd: show port-security address
  - cmd: show mac address-table secure
  - cmd: show interfaces status err-disabled
  - cmd: show errdisable recovery
  - cmd: show logging | include PSECURE|PORT_SECURITY
  - cmd: show running-config | include port-security|^interface
    may_contain_secrets: true
