# Propósito: Revisa el acceso de administración: líneas VTY, SSH, SNMP, AAA, ACL, CPU y el plano de control.
# Cuándo usarlo: El equipo no responde a SSH o SNMP pero sigue reenviando tráfico; se accede por consola u otra vía.
# Fuente: https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/software/release/17-9/command_reference/b_179_9300_cr.html
# Sin validar en laboratorio.
id: tac-ssh-snmp
platform: ios-xe
name: TAC · No responde a SSH/SNMP
commands:
  - cmd: show clock
  - cmd: show users
  - cmd: show line
  - cmd: show ip ssh
  - cmd: show ssh
  - cmd: show snmp
  - cmd: show aaa servers
  - cmd: show tcp brief
  - cmd: show ip sockets
  - cmd: show ip interface brief
  - cmd: show control-plane host open-ports
  - cmd: show processes cpu sorted
  - cmd: show processes cpu history
  - cmd: show ip access-lists
  - cmd: show crypto key mypubkey rsa
  - cmd: show logging | include SSH|SNMP|LOGIN|AAA|VTY|TACACS|RADIUS|CPUHOG
  - cmd: show running-config | section line vty|ip ssh|snmp-server|access-class|aaa
    may_contain_secrets: true
