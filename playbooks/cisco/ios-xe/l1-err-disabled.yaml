# Propósito: Lista los puertos en err-disabled, sus causas detectadas y la recuperación automática configurada.
# Cuándo usarlo: Un puerto aparece 'err-disabled' o se apaga solo tras un evento (BPDU guard, port-security, UDLD, loop).
# Fuente: https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/software/release/17-9/command_reference/b_179_9300_cr.html
# Sin validar en laboratorio.
id: l1-err-disabled
platform: ios-xe
name: L1 · Err-disabled
name_en: L1 · Err-disabled
commands:
  - cmd: show clock
  - cmd: show interfaces status err-disabled
  - cmd: show errdisable detect
  - cmd: show errdisable recovery
  - cmd: show errdisable flap-values
  - cmd: show interfaces status
  - cmd: show port-security
  - cmd: show spanning-tree summary
  - cmd: show etherchannel summary
  - cmd: show logging | include ERR_DISABLE|ERRDISABLE|PSECURE|BPDUGUARD|UDLD|LOOPBACK|DHCP_SNOOPING
